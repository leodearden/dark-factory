# Recon Code-Fix Premise-Verification Registry
# ============================================================
# Each entry documents a self-referential (reconciler / fused-memory-internal)
# code-fix premise that an architect empirically REFUTED against live
# source/tests. Unlike cancelled_premise_blocklist.yaml — which drops a
# matching candidate unconditionally, forever — the curator RE-VERIFIES each
# entry's source_assertions against the live source tree on every match.
# A matching candidate is dropped BEFORE any LLM call ONLY WHILE those
# assertions still hold. If a later refactor makes the premise valid again
# (e.g. the cited filter is genuinely removed), the candidate stops matching
# on the very next check — no operator action required.
#
# Schema per entry:
#   name                  : str  — stable identifier for the entry
#   reason                : str  — human-readable explanation (cite the esc id + incident)
#   title_substrings      : list[str]  — ALL must appear in candidate title (case-insensitive)
#   description_substrings: list[str]  — AT LEAST ONE must appear in
#                           candidate description+details (case-insensitive)
#   source_assertions     : list[{file, must_contain, must_not_contain}]
#                           — file is relative to the fused-memory/ server cwd;
#                           an assertion holds iff every must_contain token is
#                           present in the file AND every must_not_contain
#                           token is absent. ALL assertions in the entry must
#                           hold for the premise to still be considered
#                           refuted (must_contain/must_not_contain each
#                           default to [] when omitted).
#
# Guidance for operators adding new entries:
#   - Use a tight title anchor: prefer 2-3 specific tokens over generic
#     phrases to minimize false positives. Always pair a title anchor with
#     specific description_substrings.
#   - source_assertions should cite the SAME evidence the architect used to
#     refute the premise (a filter/token that is present, a pinning test
#     name, or a constraint that is absent) so the gate self-corrects the
#     moment that evidence changes.
#   - A textual match alone never drops a candidate — see
#     recon_code_fix_premise_guard.premise_refuted_entry.
# ============================================================

- name: entity_summary_rebuild_invalid_at_filter_already_present
  reason: >
    esc-1946-15 claimed the entity-summary rebuild is missing an invalid_at
    filter. Empirically refuted by the architect: the rebuild's bulk valid-edge
    fetch (GraphitiBackend.get_all_valid_edges — the single query both the
    force=True and force=False MemoryService.rebuild_entity_summaries code
    paths route through, the latter via detect_stale_with_edges) already
    filters with `WHERE e.invalid_at IS NULL`. Any recurrence of this claim
    should be dropped without an LLM call while that function and its
    invalid_at filter clause remain in place. Anchored to this specific
    function + clause (not just any occurrence of "invalid_at" in the
    codebase) so the gate self-corrects the moment this particular filter is
    actually removed, per the registry's own operator guidance below.
  title_substrings:
    - "entity-summary rebuild"
    - "invalid_at"
  description_substrings:
    - "missing invalid_at filter"
    - "invalid_at filter"
  source_assertions:
    - file: src/fused_memory/backends/graphiti_client.py
      must_contain:
        - "def get_all_valid_edges"
        - "e.invalid_at IS NULL"

- name: stage2_flag_query_stage1_flag_marker_forbidden_regression
  reason: >
    esc-1947-17 asked Stage2's flag-query to also consume stage1_flag_marker,
    framing it as a schema-drift bug. This is a forbidden regression: the two
    marker families are deliberately kept separate, pinned by
    tests/test_stages.py::test_stage1_flag_marker_fp_key_is_never_consumed_by_stage2.
    Any recurrence should be dropped without an LLM call while that pinning
    test remains in place.
  title_substrings:
    - "stage2 flag-query"
    - "stage1_flag_marker"
  description_substrings:
    - "schema drift"
    - "stage1_flag_marker"
  source_assertions:
    - file: tests/test_stages.py
      must_contain:
        - "test_stage1_flag_marker_fp_key_is_never_consumed_by_stage2"

- name: add_finding_suggested_action_no_max_length_field
  reason: >
    esc-1971-34 claimed add_finding drops long suggested_action values due to
    a length field-required bug. Empirically refuted by the architect:
    add_finding's description/suggested_action fields are plain str with no
    Field(max_length=...) constraint in recon_report.py, so the proposed
    regression test would be green on first run (invalid TDD). Any
    recurrence should be dropped without an LLM call while no max_length
    constraint exists on those fields.
  title_substrings:
    - "add_finding"
    - "suggested_action"
  description_substrings:
    - "length"
    - "field-required"
  source_assertions:
    - file: src/fused_memory/server/recon_report.py
      must_not_contain:
        - "max_length"

- name: deterministic_gate_escalation_record_archived_not_missing
  reason: >
    Task 3023. Recon Stage 1/2 have repeatedly asserted that a done
    task_kind='deterministic' gate task stamped metadata.gate_escalated_at has
    "no escalation record" — filed 16 times across dark_factory (2841, 2842,
    2844, 2846, 2919, 2954, 2955, 2958, 2999, 3005, 3006) and reify (5330,
    5341, 5349, 5352, 5353). Empirically refuted: the record IS written for
    every deterministic-gate instance. Once a human resolves a born-at-L2
    gate, EscalationQueue.resolve() MOVES the file to
    data/escalations/archive/<date>/, so the root-only
    get_pending_escalations(task_id) probe the auditor used correctly returns
    [] — an archive-inclusive fact read through a pending-only lens. Verified
    on disk: esc-2999-1 and esc-3005-1 are resolved and archived; esc-3011-1
    is pending in the queue root. The orchestrator side is already
    archive-inclusive (deterministic_runner.py calls get_by_task with no
    status filter — task 2954, commit 403c978) and is NOT the defect.
    Task 3023 additionally exposed get_task_escalations on the escalation MCP
    surface and pointed both stages at it, so an auditor can now disconfirm
    this hypothesis directly. Any recurrence should be dropped without an LLM
    call while the archive-inclusive scan and that guidance remain in place.
    Anchored on assertion-of-absence phrasings only (NOT a bare
    "gate_escalated_at" token), so a legitimate proposal to improve this area
    still reaches the architect — pinned by
    tests/test_recon_code_fix_premise_guard.py::TestSeedRegistryRealSource::
    test_legitimate_archive_inclusive_lookup_proposal_is_not_dropped.
  title_substrings:
    - "deterministic"
    - "escalation"
  description_substrings:
    - "no escalation record exists"
    - "gate_escalated_at but no escalation record"
    - "escalation record was never written"
    - "never wrote an escalation record"
  source_assertions:
    # The archive-inclusive two-tier scan that refutes the premise. Path is
    # relative to the fused-memory/ server cwd; _assertion_holds fails OPEN on
    # an unreadable file, so a fused-memory-only deployment without the sibling
    # escalation package simply leaves this entry inert (the safe direction).
    - file: ../escalation/src/escalation/queue.py
      must_contain:
        - "def get_by_task"
        - "_iter_archive_paths"
    # The disconfirming tool the Stage 1/2 guidance points auditors at. The
    # guidance prose is a shared constant in prompts/__init__.py (it is
    # interpolated into the stage f-strings, so the literal tool name appears
    # HERE, not in stage1.py/stage2.py). If get_task_escalations is ever
    # retired, this assertion stops holding and the guard self-corrects,
    # letting the candidate through to a human.
    - file: src/fused_memory/reconciliation/prompts/__init__.py
      must_contain:
        - "_GATE_CLOSURE_ARCHIVE_GUIDANCE"
        - "get_task_escalations"
    # ...and the guidance is actually WIRED INTO the stage that files
    # remediation tasks. Unwiring it also self-corrects the guard, so the
    # candidate is only dropped while an auditor genuinely had the
    # disconfirming instruction in front of it.
    - file: src/fused_memory/reconciliation/prompts/stage2.py
      must_contain:
        - "_GATE_CLOSURE_ARCHIVE_GUIDANCE"
