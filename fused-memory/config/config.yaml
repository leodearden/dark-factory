# Fused Memory MCP Server Configuration
# Supports ${VAR_NAME} and ${VAR_NAME:default_value} environment variable expansion

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8002
  stateless_http: true
  json_response: true
  keepalive_timeout: 120

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  max_tokens: 4096

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}

    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      api_url: ${ANTHROPIC_API_URL:https://api.anthropic.com}

embedder:
  provider: "openai"
  model: "text-embedding-3-small"
  dimensions: 1536

  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}

graphiti:
  provider: "falkordb"
  falkordb:
    uri: ${FALKORDB_URI:redis://localhost:6379}
    password: ${FALKORDB_PASSWORD:}
    # database is derived per-request from group_id (= project_id)

mem0:
  qdrant_url: ${QDRANT_URL:http://localhost:6333}
  collection_prefix: "fused"

routing:
  confidence_threshold: 0.7
  use_heuristics: true
  llm_fallback: true

queue:
  semaphore_limit: ${SEMAPHORE_LIMIT:3}
  workers_per_group: ${QUEUE_WORKERS_PER_GROUP:1}
  graphiti_max_coroutines: ${GRAPHITI_MAX_COROUTINES:5}
  max_attempts: ${QUEUE_MAX_ATTEMPTS:5}
  retry_base_seconds: ${QUEUE_RETRY_BASE:5}
  retry_max_delay_seconds: ${QUEUE_RETRY_MAX_DELAY:300}
  write_timeout_seconds: ${QUEUE_WRITE_TIMEOUT:120}
  backend_read_timeout_seconds: ${BACKEND_READ_TIMEOUT:30}
  backend_write_timeout_seconds: ${BACKEND_WRITE_TIMEOUT:120}
  search_timeout_seconds: ${SEARCH_TIMEOUT:30}
  data_dir: "${QUEUE_DATA_DIR:./data/queue}"
  # Error-aware retry budget (task 1936, membership revised by task 3585).
  # Errors whose class name matches any entry below — walked over the raised
  # exception's __mro__, so subclasses match too — get transient_max_attempts
  # instead of the plain max_attempts ceiling.
  #
  # The not-found family (NodeNotFoundError, EdgeNotFoundError,
  # EdgesNotFoundError) is DELIBERATELY ABSENT: esc-3561-3 refuted the
  # visibility-race premise it was added on. See
  # DEFAULT_TRANSIENT_ERROR_NAMES in
  # src/fused_memory/services/durable_queue.py for the evidence and for the
  # clustered/read-routed-backend condition that would justify putting it back.
  #
  # RECORDED COST (task 3585). Spelling the list out here makes it a THIRD
  # copy — schema.QueueConfig's default and durable_queue's frozenset are the
  # other two — so a future membership change in code has to be made in three
  # places, not two. That is accepted deliberately, for one reason: the policy
  # is otherwise editable only by changing code, and an operator responding to
  # an incident needs it visible and tunable in the DEPLOYED file. Retuning
  # here is expected and supported; CI does not freeze this list to the code
  # default. What it does enforce (test_config_schema.py::
  # TestQueueConfigTransientErrorFields::
  # test_deployed_config_transient_retry_policy) is the 3585 verdict plus the
  # anti-drift floor: this list may ADD names, must contain every name in
  # DEFAULT_TRANSIENT_ERROR_NAMES, and must not readmit the not-found family.
  # Re-add one of those three only after re-deriving the argument from the
  # durable_queue.py comment — the test will make you mean it.
  #
  # queue.* is NOT in reload.py's hot-reload allowlist, so mcp__fused-memory__
  # reload_config reports a change here under restart_required rather than
  # silently no-op'ing — the queue reads this config once, at construction.
  # A change takes effect on restart.
  #
  # transient_error_names is spelled literally: _expand_env_vars substitutes
  # per string and recurses INTO lists, so a whole-list ${VAR:default} would
  # reach pydantic as one string and fail validation.
  transient_max_attempts: ${QUEUE_TRANSIENT_MAX_ATTEMPTS:12}
  transient_error_names:
    - TimeoutError
    - ConnectionError
    - ConnectionResetError
    - ServerDisconnectedError
    - OperationalError

# ── Project isolation (task 1143) ────────────────────────────────────────────
# The reconciliation harness hard-binds project_root per project_id via a
# registry built from two sources:
#
#   1. taskmaster.project_root below (this server's primary project).
#   2. DASHBOARD_KNOWN_PROJECT_ROOTS env var — a comma-separated list of
#      absolute paths for *all* additional projects reconciled by this server.
#      The committed template (scripts/fused-memory.service.template) defaults to
#      this repo only; additional roots are a LOCAL setting, appended to the
#      INSTALLED unit (~/.config/systemd/user/fused-memory.service).
#      Example: DASHBOARD_KNOWN_PROJECT_ROOTS=/abs/path/proj-a,/abs/path/proj-b
#
# Basename derivation: /abs/path/my-project  →  my_project  (lowercase,
# dashes replaced by underscores).
#
# If a project_id passed to run_full_cycle() has no entry in this registry,
# the harness raises UnknownProjectError pre-flight (no silent fallback to any path).
# ─────────────────────────────────────────────────────────────────────────────
taskmaster:
  project_root: "${PROJECT_ROOT:.}"
  tool_mode: "all"

# task_metadata.enforce — RED-TIER / restart-only (task 2162, W3-β). warn-mode
# (false) logs a task_metadata.schema_warning line per SchemaWarning and lets
# the write proceed; true rejects a schema-violating add_task/update_task with
# ValidationError. See shared/src/shared/task_metadata.py and
# plans/task-metadata-schema-prd.md.
task_metadata:
  enforce: true

# task_status.enforce_transitions — RED-TIER / restart-only (Γ gate; tasks 2214/2215/2216 +
# τ2 table task 2614). Default false = LOG-MODE: an illegal (from,to,actor) transition logs an
# 'illegal_transition would-reject' WARNING and the write proceeds. true = a typed
# illegal_transition rejection. Flipped 2026-07-14 via operator gate esc-2216-1 after task 2614
# landed the missing PENDING→DONE / PENDING→BLOCKED human edges and a clean production soak
# (0 would-rejects in ~495k journal lines since the 15:35Z fm restart onto the τ2 fix).
task_status:
  enforce_transitions: true

reconciliation:
  enabled: true
  # Phase 2 enforcement of done_provenance: require commit|note payload on done transitions
  require_done_provenance: true
  data_dir: "${RECONCILIATION_DATA_DIR:./data/reconciliation}"
  buffer_size_threshold: 250
  max_staleness_seconds: 14400
  conditional_trigger_ratio: 0.2
  burst_window_seconds: 30
  burst_cooldown_seconds: 150
  stale_lock_seconds: 7200
  agent_llm_provider: "claude_cli"
  agent_llm_model: "sonnet"
  agent_max_steps: 50
  tool_timeout_seconds: ${RECON_TOOL_TIMEOUT:120}
  stage_timeout_seconds: ${RECON_STAGE_TIMEOUT:3600}
  cycle_timeout_seconds: ${RECON_CYCLE_TIMEOUT:86400}
  judge_enabled: true
  judge_llm_provider: "claude_cli"
  judge_llm_model: "sonnet"
  # Auto-resume-after-cooldown (task 2920). On 2026-07-20 the judge halted
  # dark_factory (08:34:36Z) and the halt sat unhalted for ~2 days — its
  # cooldown_until (09:04:36Z) expired and nothing acted on the expiry, so the
  # reconciliation backlog grew monotonically (501→1548). Enacting true here
  # closes that gap: once a halt's cooldown expires the project auto-resumes
  # with the normal post-unhalt grace, and a genuinely-sick pipeline re-halts on
  # the next serious verdict — re-firing a distinct, now-loud halt escalation —
  # instead of resuming silently. Restart-tier (read each cycle; not hot-reloadable).
  auto_unhalt_after_cooldown: true
  explore_codebase_root: "${PROJECT_ROOT:.}"
  # Escalation
  escalation_port: ${RECON_ESCALATION_PORT:8103}
  escalation_host: "127.0.0.1"
  escalation_queue_dir: "${RECONCILIATION_DATA_DIR:./data/reconciliation}/escalations"
  # WP-D per-project backlog override map (task 1764 / esc-fused-memory-237).
  # reify's steady-state backlog hovers at ~500-520 (< 1.2% of its ~45k-item store),
  # just over the flat 500 default, causing benign L1→L2 alert noise. 1500 is ~3x
  # the observed peak (still ~3% of the store) — comfortable headroom that clears
  # benign hovering without masking a real runaway (which would blow well past 1500).
  backlog_hard_limit_overrides:
    reify: 1500
  # Aggregate storm alarm — dead_owner_shielded suppression burst (task 1755 / PRD β).
  # When >=threshold suppressions occur in a rolling window, one loud
  # recon_watchdog_kill_storm escalation fires. Per-event suppression (task 1731) is kept.
  dead_owner_suppression_storm_threshold: 6
  dead_owner_suppression_storm_window_seconds: 3600.0
  # Tiered models
  sonnet_model: "sonnet"
  opus_model: "opus"
  opus_threshold_ratio: 1.5
  sonnet_episode_limit: 125
  sonnet_memory_limit: 250
  opus_episode_limit: 500
  opus_memory_limit: 1000
  # Token-budget context assembly
  token_budget: 65000
  context_search_limit: 5
  context_fetch_batch_size: 10
  usage_cap:
    enabled: true
    wait_for_reset: true
    probe_interval_secs: 300
    max_probe_interval_secs: 1800
    accounts_file: "${DARK_FACTORY_ROOT:/home/leo/src/dark-factory}/config/usage-accounts.yaml"

curator:
  # Cancelled-premise blocklist: YAML file listing premises proven wrong by
  # revert. Matching candidates are dropped before any LLM call. See
  # fused-memory/config/cancelled_premise_blocklist.yaml for the schema.
  cancelled_premise_blocklist_path: "config/cancelled_premise_blocklist.yaml"

  # Recon code-fix premise-verification registry: YAML file listing
  # self-referential recon/fused-memory-internal code-fix premises an
  # architect has empirically refuted. Matching candidates are dropped
  # before any LLM call ONLY WHILE the live source/tests still refute the
  # premise (self-correcting — unlike cancelled_premise_blocklist_path's
  # unconditional forever-drop). See
  # fused-memory/config/recon_code_fix_premise_registry.yaml for the schema.
  recon_code_fix_premise_registry_path: "config/recon_code_fix_premise_registry.yaml"

  # Recon claim-verification backstop (task 2438): when true, specific
  # code-level tokens a Stage 2 candidate attributes to a completed
  # task/commit/ACTION (a metadata key, a stamp like foo=true, a named
  # identifier) are verified against the live source tree + git history
  # before the candidate is filed. Unlike recon_code_fix_premise_registry_path
  # above, an unverified token is never dropped — it is only logged as an
  # advisory recon_claim_verification.unverified WARNING for human review.
  # Schema default is false (byte-identical for other deployments); enabled
  # here for dark_factory.
  recon_claim_verification_enabled: true

  # Operational-ask registry: YAML file listing recurring operational
  # live-data/live-mutation asks (already-built+unit-tested scripts whose
  # remaining work is dry-run -> human-review -> apply against live external
  # stores, modifying ZERO repo files). Matching candidates are routed before
  # any LLM call to a deterministic PURE-GATE instead of the TDD architect.
  # See fused-memory/config/operational_ask_registry.yaml for the schema.
  operational_ask_registry_path: "config/operational_ask_registry.yaml"

  # Background ticket janitor — see middleware/ticket_janitor.py.
  # Replaces per-call resolve_ticket waits with a server-side sweep that
  # batches failed tickets into one info-severity ticket_failure escalation
  # per (task_id, escalation_id) group.
  janitor:
    enabled: true
    interval_seconds: 60
    cooldown_seconds: 3600
    batch_limit: 100

# Periodic entity-summary rebuild — scheduled staleness backstop (fix (b),
# task 1958; follow-up to task 1949's fix (a) best-effort post-ingestion
# refresh). Calls memory_service.rebuild_entity_summaries(project_id, force)
# on each listed project every interval_seconds. Disabled by default
# (enabled: false, projects: []) — costs nothing until an operator opts in
# by enabling it and listing the project_ids to sweep.
summary_rebuild:
  enabled: false
  interval_seconds: 3600
  projects: []
  force: false

# In-place Mem0 amendment (task 3088) — the update_memory MCP tool, which
# rewrites a record's content and/or metadata while PRESERVING its Qdrant point
# id. All five leaves are green-tier hot-reloadable (see OPERATIONS.md §6);
# every value below is the shipped default, shown so the knobs are discoverable
# without reading the schema. Uncomment to change one.
mem0_update:
  # Kill switch. false denies every caller on the very next call, allowlisted
  # or not — this is the knob to flip during a runaway-rewrite incident.
  enabled: true
  # Two independent agent_id-prefix allowlists, one per arm. Widening the
  # metadata bar ALONE is the supported way to admit an interactive tagging
  # flow without granting content-amend authority: a mistagged record is cheap
  # to notice and cheap to correct, a silent content rewrite is neither.
  # agent_id is self-reported, so this deters misuse by cooperating callers
  # rather than enforcing a security boundary.
  #
  # 'curator-' ADDED 2026-08-11 by Leo's ruling (b) on esc-3524-1 — see that
  # record's triage addendum for the full rationale. It admits the interactive
  # memory-consolidation sitting (task 3524 / gate 3625) rather than routing
  # those consolidations through a recon-stage agent, which was the rejected
  # option (a). Deliberately a DEDICATED NARROW prefix that a sitting session
  # opts into by self-reporting agent_id='curator-<something>', NOT the everyday
  # 'claude-interactive' — admitting that would grant silent history-rewrite
  # authority to every ordinary interactive session in every project sharing
  # this config.
  #
  # BOTH arms carry it, and that is required rather than incidental: gate 3200
  # ratified Option C's retain-and-tag write shape (2026-08-11), whose folded
  # entries are RETAINED as topic-tagged peers via a metadata-only patch. A
  # sitting granted content_amend alone could rewrite the canonical but not
  # stamp the peers it retains, i.e. it could do the destructive half and not
  # the preserving half.
  content_amend_allowed_agent_prefixes: ['recon-stage-', 'curator-']
  metadata_patch_allowed_agent_prefixes: ['recon-stage-', 'curator-']
  # Content-amend burst alarm: escalates, never blocks (a hard block would
  # risk a legitimate large consolidation cycle failing mid-run over its own
  # success count). Metadata-only calls do not count toward it.
  storm_threshold: 20
  storm_window_seconds: 3600.0

write_triage:
  # CALIBRATION OUTPUT — do not hand-edit.
  # Derived from measured similarity distributions by
  # scripts/calibrate_write_triage.py; both values are order statistics of
  # the observed curator-labeled corpus, not chosen constants.
  # Report: calibration/write_triage_calibration_report.json
  # -- records the measured distributions and the deterministic band's
  # false-positive count. Re-run the script to change these values.
  t_high: 0.8868282526657318
  t_low: 0.5229672433064231
  calibration_report_path: calibration/write_triage_calibration_report.json
  # Per-category cutoffs, measured the same way over each category's
  # OWN pairs. A category ABSENT here has no derived cutoff — see the
  # report's per_category section for the refusal and its reason.
  t_high_by_category:
    procedural_knowledge: 0.839045608910388
  # EVIDENCE STATUS (hand-added prose, task 3357 — no numbers here; the
  # machine-readable record is the report's per_category section, which
  # the calibration guard test binds. A later --write-config run rewrites
  # this whole block and drops this note; the report survives it.)
  # - procedural_knowledge: has its own cutoff above, derived from that
  #   category's own 242 duplicate / 3328 negative labeled pairs.
  # - observations_and_summaries: NO cutoff. Refusal reason
  #   `insufficient_pairs` — 4 duplicate and 51 negative pairs, below the
  #   20/20 minimum. Both band edges are fitted to a sample's observed
  #   extreme, which a fresh pair clears with expected probability
  #   1/(n+1), so a band fitted here is weaker evidence than the pooled
  #   corpus it would displace.
  # - preferences_and_norms: NO cutoff is derivable from this corpus.
  #   Refusal reason `empty_class` — every one of its fixture records sits
  #   in a single cluster, so the category has zero negative pairs and
  #   there is nothing to separate a duplicate from.
  # Both refused categories are therefore ABSENT above and fall back to
  # the pooled t_high. That fallback is counted by audit_duplicate_memories
  # (`ann_pooled_fallback_categories`), and their ANN-only clusters are
  # withheld from `--apply` deletion (`ann_cutoff_not_evidenced_for_category`):
  # still reported, never irreversibly acted on with a cutoff measured
  # elsewhere.
