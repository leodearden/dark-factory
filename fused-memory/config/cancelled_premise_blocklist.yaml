    no fixc_flags_deleted_not_found metric anywhere in the codebase. This task was
    proposed as task 1376 and re-proposed as task 1432 after revert ae58a59d81f1.
    Any future recurrence must be dropped without an LLM call.
  title_substrings:
    - "fix c"
    - "search-then-delete"
  description_substrings:
    - "fixc_flags_deleted_not_found"
    - "stage1_flag_marker"
    - "delete-by-recorded-id"
    - "delete by recorded id"
