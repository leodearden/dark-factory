# Cancelled Premise Blocklist
# ============================================================
# Each entry documents a premise that was tried, shipped, and reverted.
# The curator matches incoming candidates against this list *before* any
# LLM call. A match returns action='drop' with the operator reason below.
#
# Schema per entry:
#   name                  : str  — stable identifier for the entry
#   reason                : str  — human-readable explanation (cite revert SHA + task IDs)
#   title_substrings      : list[str]  — ALL must appear in candidate title (case-insensitive)
#   description_substrings: list[str]  — AT LEAST ONE must appear in
#                           candidate description+details (case-insensitive)
#
# Guidance for operators adding new entries:
#   - Use a tight title anchor: prefer 3+ specific tokens over generic 2-token
#     phrases to minimize false positives.  A title-only gate is never enough
#     on its own — always pair it with specific description_substrings.
#   - When a re-proposed hallucination slips through by paraphrasing, add the
#     new phrasing as an additional description_substrings entry here (e.g.
#     hyphens vs. underscores, spaces vs. underscores, alternate word order).
#     The blocklist is the canonical record of all known forms of a premise.
# ============================================================

- name: fixc_flag_marker_search_then_delete
  reason: >
    The premise that _sweep_stale_fixc_markers deletes by a "recorded ID" instead
    of by search result is fictional. The function at task_knowledge_sync.py:893
    already deletes by search-result id. There is no stage1_flag_marker source and
    no fixc_flags_deleted_not_found metric anywhere in the codebase. This task was
    proposed as task 1376 and re-proposed as task 1432 after revert ae58a59d81f1.
    Any future recurrence must be dropped without an LLM call.
  title_substrings:
    - "fix c"
    - "search-then-delete"
  description_substrings:
    - "fixc_flags_deleted_not_found"
    - "flags_deleted_not_found"
    - "stage1_flag_marker"
    - "stage 1 flag marker"
    - "stage-1 flag marker"
    - "delete-by-recorded-id"
    - "delete by recorded id"

- name: verify_summary_glob_jsondecodeerror_refuted
  reason: >
    Leo ruled option (b) on esc-5120-2, 2026-09-08. The premise of task 5120
    ("[legibility census] Verify-summary glob miss cascades into a generic
    JSONDecodeError instead of a clear not-found") is refuted: it claimed an
    agent guessed a wrong artifact name/location under .task/verify/, and that
    the resulting glob miss cascaded into an opaque JSONDecodeError instead of
    a clear not-found signal.

    The refutation comes from reading the raw session transcript and must NOT
    be re-derived here. The file existed under exactly the guessed name. The
    real failure was CWD DRIFT: the agent had cd'd into .task/verify and then
    used a worktree-relative glob, so the glob resolved against the wrong
    directory. The agent self-corrected 19 seconds later. There is no
    naming-convention defect and no error-cascade defect to fix.

    The true cause is already catalogued as docs/legibility/confusion-codebook.yaml
    entry entry-cand-20260729-4 ("Bash cwd persists across turns"), which is
    where a genuine recurrence of this phenomenon belongs.

    ANCHOR SAFETY, measured against the real matcher before this entry was
    committed: it does NOT match task 5198 (this remediation task) nor task
    5199 (the separately-filed, real, measured task-path verify-summary ARCHIVE
    GAP defect). Both must stay fileable; both are pinned as controls in
    fused-memory/tests/test_task_curator.py::TestCancelledPremiseBlocklistPinsVerifySummaryGlobPremise.

    Any future recurrence must be dropped without an LLM call.
  title_substrings:
    - "verify"
    - "glob"
    - "jsondecodeerror"
  description_substrings:
    - "scripts.summary.json"
    - "JSONDecodeError"
    - "cannot access"
