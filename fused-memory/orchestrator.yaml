# Fused-memory orchestrator configuration
# Scopes verification to fused-memory's own venv so pyright/ruff/pytest
# use the module's pyproject.toml config and don't resolve orchestrator
# from the main project's editable install.

# Verification commands — must run from a directory where fused-memory/ is
# a direct subdirectory (repo root or full-checkout worktree), so that
# --directory fused-memory resolves correctly.
#
# `--project fused-memory` was REMOVED (task 3830): uv applies --directory
# first, so it then resolved --project against the new cwd and looked for
# fused-memory/fused-memory, warning "will become an error in a future
# release". --directory is the one kept because cwd is load-bearing — pyright
# reads this module's own [tool.pyright], whose venvPath/venv pin is resolved
# relative to this directory. Project selection survives scoping via
# verify_cmd.promote_cwd_to_project. Measured green in the new shape.
test_command: "uv run --directory fused-memory pytest tests/ --tb=short -q --timeout=300"
# bare-MagicMock + asyncmock-assertion gates (also run in merge-queue verify; see hooks/project-checks)
lint_command: "uv run --directory fused-memory ruff check src/ tests/ && python3 fused-memory/scripts/check_bare_magicmock_config.py fused-memory/tests && python3 fused-memory/scripts/check_asyncmock_assertion_style.py fused-memory/tests && python3 tests/scripts/raw_envelope_literal_guard.py fused-memory"
type_check_command: "uv run --directory fused-memory pyright src/ tests/ scripts/"

# Per-module verify budget (task 3473; re-sized by task 7882). Before 3473,
# fused-memory declared nothing here and fell HARD through to the repo-root
# whole-fleet ceiling.
#
# (1) MEASUREMENT PROVENANCE. W is the max of the production verify-summary
# census of this module's task-role test legs over a FIXED closed window, so the
# next figure is a repeat rather than a re-derivation. Measured 2026-10-31:
#
#   uv run --project shared python scripts/verify_budget_census.py \
#     --root /home/leo/src/dark-factory --module fused-memory --label test \
#     --role task \
#     --window 2026-10-17T00:00:00+00:00..2026-10-31T08:00:00+00:00 --json
#
#   overall.durations  n=191  p50=848.68  p90=1160.14  max=1695.08
#   p50 by load band   light 474, moderate 696, heavy 939
#
# The max is a GREEN run (task 6199, 2026-10-29, rc=0). It was cold-verified,
# so it ran under the cold budget instead of being killed at the old 1200. The
# junit archive counts ~33.3k tests per run, against 11353 at task 3473's
# sizing. EVERY FIGURE IS CONTENDED (most runs sit in the heavy band) and none
# is quoted as an unloaded one, per orchestrator/tests/warm-lane/README.md; the
# error runs in the safe direction, toward a larger budget.
#
# The summary corpus keeps ONE record per attempt (the final command after any
# in-attempt timeout retries), so its timed_out count understates timeouts;
# runs.db's verify_admission_plan legs are the timeout count.
#
# (1a) THIS IS AN `-n 8` FIGURE, VALID ONLY WHILE THAT HOLDS. Task and
# background legs get `-n <verify_admission_pytest_n>` appended (repo-root
# dark-factory-orchestrator.yaml, "8" today), which overrides
# fused-memory/pyproject.toml addopts' `-n auto`; the summaries record
# load.xdist.n_flag="8". Task 3473's W (439.80s) was a hand run of the verbatim
# test_command, so it ran at `-n auto` (16 or 32 workers) — exactly why it
# under-sized this leg. A change to that knob, or to addopts' `-n` or dist mode,
# INVALIDATES this measurement rather than merely shifting it: re-measure, do
# not scale the number below.
#
# (2) SIZING. W = 1695.08s, the WORST run, never the mean.
#     B ~= 2.6 x W = 4407.2 -> rounded up to 4500.
# Guard (b)'s floor is min_budget(1695.08) = 3300; guard (c)'s ceiling is the
# repo-root 7200. Max-not-mean is forced by recorded evidence:
# scripts/orchestrator.yaml logs a ~3x spread (310.33s -> 914.61s) for a
# BYTE-IDENTICAL command on a BYTE-IDENTICAL tree — host load at measurement
# time, not suite variance. This module's own load-band p50s span ~2x.
#
# (3) THE 2.6x MULTIPLE AND THE 600s FLOOR ARE INHERITED DELIBERATELY, not
# coincidentally: tests/scripts' 600 ~= 2.6 x 233.50 and scripts' 2400 ~= 2.6 x
# 930.59, and scripts/orchestrator.yaml states it kept the multiple identical
# across the two on purpose. The 600s floor is not binding here.
#
# (4) WHAT THIS ACTUALLY BUYS: 7200s -> 4500s, a 1.6x narrowing. It does NOT
# make the suite faster and does not detect suite growth.
#
# (4a) COUNT THE RETRIES. config.verify_timeout_retries defaults to 2 and the
# repo-root yaml does not override it, and verify.py's attempt loop re-runs a
# PURE TIMEOUT failure — so on the TASK path a hang here costs up to
# 3 x 4500s = ~225 minutes, not ~75, against up to 3 x 7200s = ~6 hours without
# this declaration. The merge-verify and background paths pass max_retries=0
# and pay 4500s once. Full statement of the mechanism in shared/orchestrator.yaml
# paragraph (4a). The suite budget is not the hang guard: the per-test cap
# (test_command's `--timeout=300`, thread method per pyproject.toml) ends the
# session on an in-test hang, and the census window shows no pure suite hang —
# every timed-out leg was killed at ~1200s and its task went green on a later
# plan.
#
# (5) verify_command_timeout_secs is a PER-COMMAND budget, so this bounds the
# TEST leg on its own — NOT test + lint + type summed. That matters more here
# than elsewhere: this module's lint_command chains THREE checks.
#
# (6) verify_cold_command_timeout_secs is DELIBERATELY LEFT UNSET: no build step
# whose cold cost would justify a separate cold budget. Per
# verify._resolve_verify_timeout, an unset module cold knob does NOT inherit the
# 4500 below — it falls through to the repo-root verify_cold_command_timeout_secs
# (10800), and on a MERGE-cold verify falls through first to
# config.merge_verify_cold_command_timeout_secs (7200, shipped by the
# package-bundled orchestrator/src/orchestrator/defaults.yaml and not overridden
# by the root yaml). Gated by assertion (f) of the guard below.
#
# (7) RAISE THEM TOGETHER. If this suite grows enough to approach 4500s,
# RE-MEASURE and raise this value,
# MEASURED_MODULE_SUITE_WORST_SECS['fused-memory'] in
# tests/scripts/test_module_verify_budgets.py, and the family-band figure in
# shared/orchestrator.yaml paragraph (3) — never quietly widen one.
#
# (8) GATED BY tests/scripts/test_module_verify_budgets.py::
# test_module_carries_its_own_measured_verify_budget[fused-memory].
verify_command_timeout_secs: 4500
