[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fused_memory"]

[project]
name = "fused-memory"
version = "0.1.0"
description = "Fused Memory MCP Server — unified Graphiti + Mem0 memory system"
requires-python = ">=3.11,<4"
dependencies = [
    "graphiti-core[falkordb]>=0.28.1",
    # hiredis C reply parser for FalkorDB: tests/test_redis_hiredis_parser.py (task 9308)
    "redis[hiredis]>=7.4.0",
    "mem0ai>=1.0.10",
    "mcp>=1.9.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "openai>=1.91.0",
    "anthropic>=0.52.0",
    "aiosqlite>=0.20.0",
    "dark-factory-shared",
]

[tool.uv.sources]
dark-factory-shared = { workspace = true }
escalation = { workspace = true }

[tool.pytest.ini_options]
markers = [
    "integration: live tests requiring real external services/credentials (e.g. OpenAI API / network egress); deselect: -m 'not integration'",
    "reads_git_history: the test reads the checkout's git history (log, merge-base, rev-list, describe), so a byte-identical tree under a new parent can verify differently; re-run alone on the merge gate's same-tree path by merge_gate_history_test_command. Not deselected by default.",
]
pythonpath = ["src", "../orchestrator/src"]
asyncio_mode = "strict"
# --max-worker-restart=0 (task 5114) stays under signal, as in
# orchestrator/pyproject.toml, for the worker deaths a timeout no longer causes.
# The reason, the recorded set that pins it (RESTART_DISABLED_CONFIGS), and an
# executable reproduction of the unattributed INTERNALERROR abort that permitted
# restarts produce, live in tests/scripts/test_xdist_worker_restart_policy.py.
addopts = "-n auto --dist loadgroup --max-worker-restart=0 -m 'not integration'"
# Default per-test timeout — see shared/pyproject.toml for the full rationale
# (UsageGate mock hang, make_gate_mock, asyncio-sleep footguns, and why this
# is large rather than the original 60: the cap is WALL-CLOCK, so a healthy test
# starved of CPU on a loaded 32-core host trips it; under signal it reds
# itself, where thread mode plus --max-worker-restart=0 used to red a SHIFTING
# VICTIM).
# 420 is DERIVED FROM MEASUREMENT — worst unmarked per-test wall clock under
# real fleet load x the 8x headroom factor — and no longer judgement-picked.
# This suite's repo-wide scans in tests/test_check_bare_magicmock_config.py
# carry their own mark at their measured ceiling, so they do not govern this
# default. The measurement and the value's history are in
# plans/pytest-per-test-timeout-measurement-2026-09-17.md.
# Slow tests opt out with @pytest.mark.timeout(N).
# In-band markers (60 < N < verify --timeout) are rejected by
# tests/test_timeout_marker_inversion_guard.py; see
# shared/src/shared/testing_timeout_markers.py.
# timeout_method: signal, decided on measurement by task 6354. The trade and
# its measurement live in tests/scripts/test_timeout_method_policy.py. A breach
# fails the one test, with its traceback, and the worker lives on, so the tally
# stays complete. Tests with a real-time budget approaching 300s should still
# opt up with @pytest.mark.timeout(N) rather than risk a false red at the cap.
# Fix the mock (shared.testing.make_gate_mock) rather than leaning on this cap
# to recover from hangs.
timeout = 420
timeout_method = "signal"

[tool.pyright]
include = ["src", "tests", "scripts"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "tests", "scripts", "../shared/src", "../escalation/src", "../orchestrator/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Task 3367 / esc-3359-1: pins pyright's interpreter to THIS worktree's own
# .venv (venvPath is resolved relative to this file's directory, so it can
# never name another tree's environment). Without it, `cd fused-memory && npx
# pyright` resolves the interpreter from ambient VIRTUAL_ENV/PATH — which
# verify._target_subprocess_env deliberately strips — so a cold merge worktree
# type-checks against an env holding none of the workspace's third-party
# packages: measured 514 phantom reportMissingImports here, 0 with this pin.
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.7.1",
    "escalation",
]
# Eval-only (plans/write-triage-flip-readiness-prd.md ρ1); nothing under src/ imports it.
reranker = [
    "torch>=2.4",
    "sentence-transformers>=6.0",
    "huggingface-hub<1.16",  # >=1.16 requires click>=8.4, which would move the workspace's click pin
]
