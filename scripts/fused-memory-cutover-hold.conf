# Cutover hold drop-in for fused-memory.service and fused-memory.socket.
# While the lock file below exists, systemd refuses to start either unit; with
# no lock the drop-in does nothing. The embedder cutover writes the lock at
# quiesce and removes it at release.
#
# This is the ONE definition of the lock path; the cutover's `live` profile
# reads it from here. It lives under the state directory, not $XDG_RUNTIME_DIR
# or /tmp: the lock must survive a reboot, because the installed orchestrator
# units carry Wants=fused-memory.service and would start a held unit at boot
# the moment the lock vanished. %h is expanded by systemd in Condition paths.
[Unit]
ConditionPathExists=!%h/.local/state/dark-factory/fused-memory-cutover.lock
