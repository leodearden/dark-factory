# Shared Claude Max account pool — single source of truth.
# Both orchestrator and fused-memory reconciliation reference this file
# via usage_cap.accounts_file in their respective configs.
#
# Order matters: accounts are tried in list order during failover.
# Account A is reserved for INTERACTIVE use only (not here) — Leo's own
# sessions exhaust its weekly cap most weeks, so it cannot double as a
# reserve. Evals have NO dedicated account: they share this same pool
# and must be robust to cap/429 events (ruling 2026-08-30, task 4741).

# max-b and max-h are switched off on the Anthropic side by Leo's deliberate
# choice (ruling 2026-10-06, task 5944). They stay listed, last, so switching
# them back on there is the whole restore: a long-running gate re-probes an
# auth-failed account (usage_cap.auth_reprobe_secs) and re-admits it once a
# probe is served, and the nightly legibility trickle starts each run afresh.
# Do not comment them out. max-c was off too on 2026-09-29 and was measured
# served again on 2026-09-30.
accounts:
  - name: max-d
    oauth_token_env: CLAUDE_OAUTH_TOKEN_D
  - name: max-e
    oauth_token_env: CLAUDE_OAUTH_TOKEN_E
  - name: max-f
    oauth_token_env: CLAUDE_OAUTH_TOKEN_F
  - name: max-g
    oauth_token_env: CLAUDE_OAUTH_TOKEN_G
  - name: max-b
    oauth_token_env: CLAUDE_OAUTH_TOKEN_B
  - name: max-c
    oauth_token_env: CLAUDE_OAUTH_TOKEN_C
  - name: max-h
    oauth_token_env: CLAUDE_OAUTH_TOKEN_H
# max-b previously believed permanently dead (HTTP 403 since 2026-04-20);
# re-tested 2026-04-26 with a haiku probe and found alive (real tokens consumed).
# max-a remains reserved for interactive use only — NOT an eval account,
# and not part of the shared pool above. Evals draw on the pool above
# like the rest of the fleet (ruling 2026-08-30, task 4741).
#  - name: max-a
#    oauth_token_env: CLAUDE_OAUTH_TOKEN_A
