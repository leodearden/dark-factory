[project]
name = "dark-factory"
version = "0.0.0"
description = "Dark Factory workspace root — not a package, just coordinates subprojects"
requires-python = ">=3.11,<4"

[tool.uv.workspace]
members = [
    "cockpit",
    "dashboard",
    "escalation",
    "fused-memory",
    "orchestrator",
    "sampler",
    "shared",
]

[tool.pyright]
include = ["conftest.py", "df_pytest_isolation.py"]
extraPaths = [
    # scripts/ is a flat script directory rather than a package src root, so
    # both it and scripts/legibility/ are listed explicitly. scripts/tests/
    # conftest.py performs the same two sys.path insertions at runtime, and the
    # `scripts` module's declared type gate (`npx pyright scripts/`) runs from
    # this directory, so it resolves against this table. Pinned by
    # tests/scripts/test_scripts_module_config.py::
    # test_root_pyright_extrapaths_resolves_scripts_imports (task 3456).
    "scripts",
    "scripts/legibility",
    "cockpit/src",
    "dashboard/src",
    "escalation/src",
    "fused-memory/src",
    "orchestrator/src",
    "sampler/src",
    "shared/src",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = [
    "smoke: live smoke tests requiring a real X11/tmux host (DISPLAY, wmctrl/xdotool/xprop/tmux, python3-tk); deselect: -m 'not smoke'",
]
addopts = "--import-mode=importlib -m 'not smoke'"
asyncio_mode = "auto"
