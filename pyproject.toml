[project]
name = "dark-factory"
version = "0.0.0"
description = "Dark Factory workspace root — not a package, just coordinates subprojects"
requires-python = ">=3.11,<4"

[tool.uv.workspace]
members = [
    "cockpit",
    "dashboard",
    "escalation",
    "fused-memory",
    "orchestrator",
    "sampler",
    "shared",
]

[tool.pyright]
include = ["conftest.py", "df_pytest_isolation.py"]
extraPaths = [
    # scripts/ is a flat script directory rather than a package src root, so
    # both it and scripts/legibility/ are listed explicitly. scripts/tests/
    # conftest.py performs the same two sys.path insertions at runtime, and the
    # `scripts` module's declared type gate (`npx pyright scripts/`) runs from
    # this directory, so it resolves against this table. Pinned by
    # tests/scripts/test_scripts_module_config.py::
    # test_root_pyright_extrapaths_resolves_scripts_imports (task 3456).
    "scripts",
    "scripts/legibility",
    "cockpit/src",
    "dashboard/src",
    "escalation/src",
    "fused-memory/src",
    "orchestrator/src",
    "sampler/src",
    "shared/src",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = [
    "smoke: live smoke tests requiring a real X11/tmux host (DISPLAY, wmctrl/xdotool/xprop/tmux, python3-tk); deselect: -m 'not smoke'",
    "integration: live tests requiring real external services/credentials (live Claude CLI + OAuth accounts, real Qdrant/OpenAI); deselect: -m 'not integration'",
]
# pytest reads exactly ONE [tool.pytest.ini_options] — the rootdir's inifile —
# and never merges addopts/markers across pyproject.toml files. So any marker a
# workspace member deselects must be MIRRORED here, or that member's decision is
# silently ignored on every root-bound run (`-c pyproject.toml`, a bare `pytest`
# from the repo root, or any arg set spanning two subprojects) and those tests
# RUN. Owners today: `smoke` (cockpit), `integration` (shared, fused-memory).
# Enforced by tests/scripts/test_pytest_workspace_collection.py
# ::test_root_pyproject_mirrors_member_marker_deselections.
#
# ONE combined -m expression, never two -m flags: -m is a single argparse
# option, so a second one would silently REPLACE the first and drop that
# deselect.
addopts = "--import-mode=importlib -m 'not smoke and not integration'"
asyncio_mode = "auto"
