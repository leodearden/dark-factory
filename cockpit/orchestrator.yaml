# Cockpit orchestrator configuration
# Scopes verification to cockpit's own venv and the full tests/ tree (not just
# the files a task happens to touch) — tests marked @pytest.mark.smoke are
# default-deselected via cockpit/pyproject.toml's `addopts = "-m 'not smoke'"`
# (a marker-based rule that deselects regardless of location, not a
# tests/smoke/ path convention; this worktree is the live DISPLAY=:0 host, so
# routine unscoped runs must never spawn real X11 windows/tmux sessions).
# Pinning the full tests/ tree keeps the selected set non-empty regardless of
# which files a task touches, avoiding a pytest rc=5 ("no tests ran")
# misclassification — see task 2446 / precedent 1852.

# Verification commands
test_command: "uv run --project cockpit --directory cockpit pytest tests/ --tb=short -q"
# bare-MagicMock config gate (also runs in merge-queue verify; see hooks/project-checks).
# NOTE: `--directory cockpit` scopes only the `uv run ruff` invocation; the
# chained `python3 fused-memory/scripts/...` call is a separate process whose
# relative paths (`fused-memory/scripts/...`, `cockpit/tests`) resolve against
# the *verify runner's* cwd, not cockpit/. That cwd is always the worktree
# root (orchestrator/src/orchestrator/verify.py's run_verification passes
# cwd=worktree to every command, never a subdirectory), so this is safe as
# long as lint_command keeps being invoked that way — same assumption
# shared/orchestrator.yaml and dashboard/orchestrator.yaml make for their
# identical chained check_bare_magicmock_config.py call.
lint_command: "uv run --project cockpit --directory cockpit ruff check src/ tests/ && python3 fused-memory/scripts/check_bare_magicmock_config.py cockpit/tests"
type_check_command: "uv run --project cockpit --directory cockpit pyright src/ tests/"

# Per-module verify budget (task 3473). Before this, cockpit declared nothing
# here and fell HARD through to the repo-root whole-fleet ceiling.
#
# (1) MEASUREMENT PROVENANCE. Six runs of the VERBATIM test_command above,
# copied byte-for-byte, on base main 5a7770d239. 321 passed / 3 deselected
# (pyproject's `addopts = "-m 'not smoke'"` excludes the smoke suite by
# construction, so these figures are of the deselected-smoke form and nothing
# else). EVERY FIGURE IS CONTENDED — a 32-core host running /proc/loadavg
# 144-252 throughout — and none is quoted as an unloaded one, per
# orchestrator/tests/warm-lane/README.md.
#
#     71.06s wall / 66.12s pytest @ loadavg 184.69  <- the CONVENIENT figure
#     81.82s wall / 75.46s pytest @ loadavg 144.00
#     99.21s wall / 93.85s pytest @ loadavg 156.86  <- rc=1, see (1a)
#    101.01s wall / 88.01s pytest @ loadavg 148.42
#    123.71s wall /116.36s pytest @ loadavg 241.98
#    130.50s wall /117.27s pytest @ loadavg 191.12  <- the INCONVENIENT one
#                                                      (6-way concurrent wave)
#
# (1a) ONE RUN WAS RED, recorded rather than quietly dropped. The 99.21s run
# exited rc=1 with `1 failed, 320 passed, 3 deselected` while the five other runs
# of the byte-identical command on the byte-identical tree all reported 321
# passed. THE IDENTITY OF THAT FAILURE IS NOT KNOWN: a concurrently-running
# duplicate measurement driver overwrote the pytest log before the failure could
# be read (the defect is described in .task/measurements.md), so only the counts
# survive. Stated as the observation it is — one run in six failed one test,
# cause unidentified. Hypothesis: a flake under that contention; plausible but
# NOT established. W below is taken from a GREEN run, so no part of this budget
# is sized from the red one. Left recorded so a future cockpit flake
# investigation has the data point rather than having to rediscover it.
#
# (1b) THE CONCURRENT ARM OF THAT SWEEP WAS A 6-WAY WAVE, which is a LOWER
# BOUND on the production shape rather than a reproduction of it:
# verify.run_full_verification asyncio.gathers over module_configs.values() —
# NINE registered configs today, including the dominant `orchestrator` segment
# measured at 1366.23s — so a full gather is materially heavier than what was
# measured, and W under-states the fully-concurrent cost. Two uncredited
# mechanisms bound the gap (verify_plan scoping, and the
# shared.verify_admission slot gate whose wait falls outside the timeout
# clock); what remains is what the 2.6x multiple absorbs, as an assumption
# rather than a measurement. Full statement in shared/orchestrator.yaml
# paragraph (1a).
#
# (2) SIZING. W = 130.50s, the worst GREEN run. 2.6 x W = 339.3, which rounds to
# 400. The 600s ABSOLUTE FLOOR binds instead:
#     B = max(600, ceil_to_100(2.6 x W)) = max(600, 400) = 600.
# The floor exists because this host has a DOCUMENTED ~3x run-to-run spread for
# byte-identical commands on byte-identical trees (scripts/orchestrator.yaml
# records 310.33s -> 914.61s); cockpit's own six runs already span 1.8x. 600s is
# tests/scripts/orchestrator.yaml's own declared value, so the floor is
# precedent rather than a fresh guess.
#
# (3) THE 2.6x MULTIPLE AND THE 600s FLOOR ARE INHERITED DELIBERATELY, not
# coincidentally: tests/scripts' 600 ~= 2.6 x 233.50 and scripts' 2400 ~= 2.6 x
# 930.59, and scripts/orchestrator.yaml states it kept the multiple identical
# across the two on purpose.
#
# (4) WHAT THIS ACTUALLY BUYS — AND IT BUYS MORE HERE THAN ON ANY SIBLING.
# 3600s -> 600s, a 6x narrowing. The reason it is worth more here is (5a) below:
# on every other module this is the OUTER of two bounds, but on cockpit it is
# the only one.
#
# (4a) COUNT THE RETRIES. config.verify_timeout_retries defaults to 2 and the
# repo-root yaml does not override it, and verify.py's attempt loop re-runs a
# PURE TIMEOUT failure — so on the TASK path a hang here costs up to
# 3 x 600s = ~30 minutes, not ~10, against up to 3 x 3600s = ~3 hours before
# this declaration. The 6x ratio is unaffected (the multiplier divides out);
# the absolute minutes are 3x larger than the budget alone suggests. That bites
# hardest on this module precisely because of (5a): with no per-test cap
# underneath it, a hung cockpit test occupies the full 600s on each of the three
# attempts rather than being cut short by pytest-timeout first. The
# merge-verify and background paths pass max_retries=0 and pay 600s once.
# Full statement of the mechanism in shared/orchestrator.yaml paragraph (4a).
#
# (5) verify_command_timeout_secs is a PER-COMMAND budget, so this bounds the
# TEST leg on its own — NOT test + lint + type summed.
#
# (5a) ON THIS MODULE IT IS THE ONLY WALL-CLOCK BOUND THAT EXISTS. Every sibling
# passes `--timeout=300` to pytest, so a single hung TEST is capped there and
# this budget is a second, outer bound. cockpit passes no `--timeout` at all AND
# cockpit/pyproject.toml sets no `timeout` ini value, so nothing bounds a hung
# cockpit test at any level. This declaration is consequently cockpit's sole
# wall-clock bound.
#
# That is a REASON TO CLOSE THE `--timeout` GAP SEPARATELY, NOT A SUBSTITUTE FOR
# CLOSING IT. The two knobs are independent: `--timeout` is pytest's PER-TEST
# cap, this is the PER-COMMAND budget, and a 600s command budget still lets one
# hung test consume the whole 600s. Deliberately NOT done here: cockpit is the
# sole member of TIMEOUT_GUARD_EXCLUSIONS in
# tests/scripts/test_fallback_verify_config.py, whose documented deletion
# condition is "once cockpit's test_command carries --timeout>=300". This task
# does not satisfy that condition and does not touch test_command, so the
# carve-out stays; removing it here would make
# test_per_module_merge_verify_raises_per_test_timeout fail.
#
# (6) verify_cold_command_timeout_secs is DELIBERATELY LEFT UNSET: no build step
# whose cold cost would justify a separate cold budget. Per
# verify._resolve_verify_timeout, an unset module cold knob does NOT inherit the
# 600 below — it falls through to the repo-root verify_cold_command_timeout_secs
# (5400), and on a MERGE-cold verify falls through first to
# config.merge_verify_cold_command_timeout_secs (7200, shipped by the
# package-bundled orchestrator/src/orchestrator/defaults.yaml and not overridden
# by the root yaml). Gated by assertion (f) of the guard below. Note this
# interacts with (5a): on a merge-cold cockpit verify there is no per-test cap
# AND the command bound is 7200s, not the 600 below.
#
# (7) RAISE THEM TOGETHER. If this suite grows enough to approach 600s,
# RE-MEASURE and raise BOTH this value and
# MEASURED_MODULE_SUITE_WORST_SECS['cockpit'] in
# tests/scripts/test_module_verify_budgets.py — never quietly widen one.
#
# (8) GATED BY tests/scripts/test_module_verify_budgets.py::
# test_module_carries_its_own_measured_verify_budget[cockpit].
verify_command_timeout_secs: 600
