[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[project]
name = "cockpit"
version = "0.1.0"
description = "Fleet Cockpit — priority scoring library and TUI (C3)"
requires-python = ">=3.11,<4"
dependencies = [
    "textual>=0.60",
    "pyyaml>=6.0",
    "orchestrator",
]

[project.scripts]
cockpit = "cockpit.app:main"

[tool.uv.sources]
orchestrator = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.7.1",
    "hypothesis>=6.0",
]

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "../shared/src", "../orchestrator/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
markers = [
    "smoke: live smoke tests requiring a real X11/tmux host (DISPLAY, wmctrl/xdotool/xprop/tmux, python3-tk); deselect: -m 'not smoke'",
]
# PARALLEL TEST EXECUTION (task 5408). Spelling and flag ORDER copy
# fused-memory/pyproject.toml verbatim (`-n auto --dist loadgroup -m 'not
# integration'` there), so every parallel module in this workspace reads as one
# family with only the marker differing.
# WHY each flag is spelled this way is written ONCE, in the guard that enforces
# it: tests/scripts/test_merge_gate_parallelism_config.py — its module docstring
# for `auto` rather than a literal worker count (the count resolves through
# dark-factory-orchestrator.yaml's PYTEST_XDIST_AUTO_NUM_WORKERS, so one knob
# governs every parallel module and the A/B cut moves them together),
# ::test_parallel_member_addopts_declare_xdist_with_loadgroup for `--dist
# loadgroup`, and ::test_parallel_member_addopts_do_not_copy_max_worker_restart
# for why orchestrator's `--max-worker-restart=0` is deliberately NOT copied.
# Five near-identical copies of that argument would be five places to drift when
# the A/B knob is next cut, so this file states only what is local to it.
# THE `-m` TERM SURVIVES, and stays ONE flat `not X`: smoke tests drive real
# X11/tmux against the live host DISPLAY and are opt-in only
# (tests/test_smoke_marker_config.py proves that behaviourally), `-m` is a
# single argparse option so a second one would silently replace this, and
# tests/scripts/test_pytest_workspace_collection.py::_FLAT_DESELECT_RE rejects
# any richer expression rather than approximating it.
# MEASURED at `-n 8 --dist loadgroup` on the 5408 tree: 346 passed in 18.76s,
# exit 0.
addopts = "-n auto --dist loadgroup -m 'not smoke'"
asyncio_mode = "auto"
# Default per-test timeout. This entry CLOSES A TOTAL-ABSENCE GAP rather than
# updating a stale value: until task 5442 this config declared neither key, so
# this suite ran uncapped even though pytest-timeout was already a dev
# dependency — the plugin was installed and inert.
# `signal` is chosen from existing evidence, not a new experiment, and the
# signal-vs-thread trade is deliberately NOT reopened here: the addopts above are
# the IDENTICAL flag set dashboard/ and escalation/pyproject.toml run, both of
# which carry timeout_method = "signal" and record themselves measured green
# under exactly those flags (task 5408). The argument for why flipping to
# `thread` is a real trade rather than a free upgrade lives once, in
# fused-memory/pyproject.toml's own timeout_method block.
# Value provenance: plans/pytest-per-test-timeout-measurement-2026-09-17.md.
# Rationale for the setting: shared/pyproject.toml. Neither is restated here.
timeout = 540
timeout_method = "signal"
