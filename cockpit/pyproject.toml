[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit"]

[project]
name = "cockpit"
version = "0.1.0"
description = "Fleet Cockpit — priority scoring library and TUI (C3)"
requires-python = ">=3.11,<4"
dependencies = [
    "textual>=0.60",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7.1",
    "hypothesis>=6.0",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "../shared/src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
