[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalation"]

[project]
name = "escalation"
version = "0.1.0"
description = "Escalation MCP server — agents escalate issues they can't solve at their scope"
requires-python = ">=3.11,<4"
dependencies = [
    "dark-factory-shared",
    # >=3.2, raised from >=2.0 by task 3690: this server now registers
    # shared.mcp_markup_middleware.MarkupGuardMiddleware, and that module
    # imports `fastmcp.tools.base` (a path that exists only after tool.py was
    # renamed to base.py) and `fastmcp.server.middleware.Middleware` (absent
    # before 2.9). Under the old >=2.0 floor a fresh resolve could hand this
    # package a 2.x where `import shared.mcp_markup_middleware` fails OUTRIGHT
    # rather than degrading. 3.2.2 is the version every substrate fact in that
    # module was measured against and what uv.lock already resolves. Mirrors
    # shared/pyproject.toml, which carries the same floor for the same reason.
    "fastmcp>=3.2",
    "inotify_simple>=1.3",
    "uvicorn>=0.30",
]

[project.scripts]
escalation = "escalation.submit:main"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    # Needed by TestMergeRequestDedup / TestGetMergeQueue in tests/test_server.py
    # (added by task 1604), which lazily import orchestrator.merge_queue and
    # orchestrator.git_ops. Dev-only — does not affect the published escalation
    # package. orchestrator depends on escalation at runtime, so this is a
    # dev-scoped workspace cycle, which uv resolves as one graph.
    "orchestrator",
]

[tool.uv.sources]
dark-factory-shared = { workspace = true }
orchestrator = { workspace = true }

[tool.pytest.ini_options]
# Default per-test timeout. Catches deadlocked lock implementations and
# accidental hangs; slow tests opt out with @pytest.mark.timeout(N).
# See shared/pyproject.toml for the full rationale, including why this is large
# rather than the original 60: the cap is WALL-CLOCK, so a healthy test starved
# of CPU on a loaded 32-core host trips it, and in the xdist packages that
# reds a SHIFTING VICTIM rather than the starved test. 540 is DERIVED FROM
# MEASUREMENT (task 5442) — worst unmarked per-test wall clock under real fleet
# load x the 8x headroom factor — and no longer judgement-picked; the corpus and
# the arithmetic are in
# plans/pytest-per-test-timeout-measurement-2026-09-17.md.
# signal method is load-bearing: thread method can't interrupt a blocking
# syscall in the main thread. UNCHANGED by the 60→300 and 300→540 raises,
# deliberately, and UNCHANGED by task 5408's addopts below.
# THE PREMISE THIS USED TO GIVE IS CORRECTED, not softened. It read "escalation
# runs no pytest-xdist so signal is always safe here", and that was false twice
# over. It was ALREADY false before 5408: verify.py injects
# `-n <verify_admission_pytest_n>` for roles task/background, so this suite has
# been running 8-way on task-role verify all along, with signal, staying green.
# 5408's `-n auto --dist loadgroup` then made it false on its face.
# WHAT SURVIVES IS A MEASUREMENT: the addopts block below records this suite
# green under those exact flags, signal unchanged.
# NOT flipped to `thread`, deliberately, and the argument for why that flip is a
# real trade rather than a free upgrade is NOT restated here — it lives once in
# fused-memory/pyproject.toml's own `timeout_method` block, which records the
# opposite experience ("signal proved unreliable under pytest-xdist workers in
# practice") together with the mechanism (pytest-timeout's thread handler ends in
# `os._exit(1)`, killing the whole xdist worker; near end-of-suite the controller
# can deadlock waiting for a completion signal that never arrives). Changing it
# on no measurement, inside a config-only task, would be unmeasured scope creep;
# the open question is filed as residue 2 of task 5470.
timeout = 540
timeout_method = "signal"

# PARALLEL TEST EXECUTION (task 5408). Spelling and flag ORDER copy
# fused-memory/pyproject.toml verbatim, so every parallel module in this
# workspace reads as one family rather than as independently-invented variants.
# WHY each flag is spelled this way is written ONCE, in the guard that enforces
# it: tests/scripts/test_merge_gate_parallelism_config.py — its module docstring
# for `auto` rather than a literal worker count (the count resolves through
# dark-factory-orchestrator.yaml's PYTEST_XDIST_AUTO_NUM_WORKERS, so one knob
# governs every parallel module and the A/B cut moves them together),
# ::test_parallel_member_addopts_declare_xdist_with_loadgroup for `--dist
# loadgroup`, and ::test_parallel_member_addopts_do_not_copy_max_worker_restart
# for why orchestrator's `--max-worker-restart=0` is deliberately NOT copied.
# Five near-identical copies of that argument would be five places to drift when
# the A/B knob is next cut, so this file states only what is local to it.
# LOCAL MEASUREMENT, at `-n 8 --dist loadgroup` on the 5408 tree: this suite ran
# 1721 passed / 2 xfailed in 32.33s, exit 0.
addopts = "-n auto --dist loadgroup"

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "tests", "../shared/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Task 3367 / esc-3359-1: pins pyright's interpreter to THIS worktree's own
# .venv (venvPath is resolved relative to this file's directory, so it can
# never name another tree's environment). Without it, a bare `cd escalation &&
# npx pyright` resolves the interpreter from ambient VIRTUAL_ENV/PATH — which
# verify._target_subprocess_env deliberately strips — so a cold merge worktree
# type-checks against an env holding none of the workspace's third-party
# packages: measured 39 phantom reportMissingImports here, 0 with this pin.
# Today this member is type-checked via `uv run --project escalation ... pyright`,
# which resolves the SAME root .venv, so the pin changes no current result —
# it only removes the dependency on ambient resolution.
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
