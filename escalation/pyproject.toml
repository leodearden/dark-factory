[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalation"]

[project]
name = "escalation"
version = "0.1.0"
description = "Escalation MCP server — agents escalate issues they can't solve at their scope"
requires-python = ">=3.11,<4"
dependencies = [
    "dark-factory-shared",
    "fastmcp>=2.0",
    "inotify_simple>=1.3",
    "uvicorn>=0.30",
]

[project.scripts]
escalation = "escalation.submit:main"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4.0",
    # Needed by TestMergeRequestDedup / TestGetMergeQueue in tests/test_server.py
    # (added by task 1604), which lazily import orchestrator.merge_queue and
    # orchestrator.git_ops. Dev-only — does not affect the published escalation
    # package. orchestrator depends on escalation at runtime, so this is a
    # dev-scoped workspace cycle, which uv resolves as one graph.
    "orchestrator",
]

[tool.uv.sources]
dark-factory-shared = { workspace = true }
orchestrator = { workspace = true }

[tool.pytest.ini_options]
# Default per-test timeout. Catches deadlocked lock implementations and
# accidental hangs. signal method is load-bearing: thread method can't
# interrupt a blocking syscall in the main thread. escalation runs no
# pytest-xdist so signal is always safe here.
timeout = 60
timeout_method = "signal"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src", "tests", "../shared/src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
