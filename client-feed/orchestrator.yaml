# task 11846, all rc=0 with 1639 passed, parallel through addopts with
# PYTEST_XDIST_AUTO_NUM_WORKERS=16, on a contended 32-core host. (audit) marks
# the verify-cache audit's own context: nice -n 19 ionice -c3,
# DF_VERIFY_ROLE=merge DF_VERIFY_CACHE=off. Loadavg at start/end:
#     140.89s wall @ loadavg 248/220          <- W, the worst
#     134.04s wall @ loadavg 216/194 (audit)
#     110.64s wall @ loadavg 192/189
#      77.03s wall @ loadavg 189/192 (audit)
# Why parallel: run SERIAL, the suite took 336.58s in the audit's green pass
# 20261126T085457 and hit the 600s timeout in passes 20261126T031642-a750b3 and
# 20261126T052727-a61744 (confirm). The task's architect measured it serial at
# 291.97s (nice 0, loadavg ~100) and 655.27s wall in the (audit) context.
# 600 is the absolute floor, since min_budget(W) = 200 is below it: see
