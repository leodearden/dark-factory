# (4a) COUNT THE RETRIES — the wall-clock a hang really costs is a MULTIPLE of
# the number below, not the number below. This paragraph is the full statement;
# the other five module yamls this task closed carry their own arithmetic plus a
# pointer here rather than a sixth copy of the mechanism.
#
# config.verify_timeout_retries defaults to 2 (orchestrator/src/orchestrator/
# defaults.yaml) and dark-factory-orchestrator.yaml does NOT override it, and
# verify.py's attempt loop re-runs a PURE TIMEOUT failure — it breaks only on
# `attempt.passed or not attempt.pure_timeout_failure or retries >=
# max_retries`. So on the TASK path a genuine hang burns up to 3 x 800s = ~40
# minutes before it surfaces, not ~10. Before task 3473's declaration it
# burned up to 3 x 3600s = ~3 hours, not ~60 minutes.
#
# The 4.5x RATIO (was 6x at the now-superseded 600s) is what the narrowing
# buys and is unaffected by the multiplier — it divides out. The absolute
# minutes are 3x larger than the budget alone suggests, and are written down
# here because a block that promises to state things "plainly rather than
# oversold" cannot quietly be 3x optimistic about the one number an operator
# would act on.
#
# The MERGE-verify and background-sweep paths pass max_retries=0 explicitly,
# so on those the bound is a single 800s.
#
# (5) verify_command_timeout_secs is a PER-COMMAND budget, so this bounds the
