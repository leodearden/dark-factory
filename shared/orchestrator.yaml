# Shared orchestrator configuration
# Scopes verification to shared's own venv. Runs lint, tests, and pyright on src/+tests/.

# Verification commands
# bare-MagicMock config gate (also runs in merge-queue verify; see hooks/project-checks)
lint_command: "uv run --project shared --directory shared ruff check src/ tests/ && python3 fused-memory/scripts/check_bare_magicmock_config.py shared/tests"
test_command: "uv run --project shared --directory shared pytest tests/ --tb=short -q"
type_check_command: "uv run --project shared --directory shared pyright src/ tests/"
