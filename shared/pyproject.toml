[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[project]
name = "dark-factory-shared"
version = "0.1.0"
description = "Shared utilities for the dark-factory software factory"
requires-python = ">=3.11,<4"
dependencies = [
    "pydantic>=2.7",
    # Not imported by shared/src itself. Needed so `uv run --project shared
    # pytest tests/scripts/` can collect tests/scripts/test_orchestrator_restart_config_drift.py,
    # which imports orchestrator.config (pydantic-settings-based). See task 2070.
    "pydantic-settings>=2.0",
    # Not imported by shared/src itself. Needed so `uv run --project shared
    # pytest tests/scripts/` can collect test_trial_module_tagger_haiku.py,
    # which reaches orchestrator.mcp_lifecycle's module-level `import anyio`
    # / `import httpx` via orchestrator.harness -> digest -> workflow ->
    # agents.invoke. See task 2965 (recurrence of the same class of break as
    # task 2070).
    "anyio>=4.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # A GENUINE runtime import, unlike the four above: shared/src/shared/
    # mcp_markup_middleware.py imports fastmcp at module scope to subclass
    # Middleware and to type its ToolResult return. Declared in [project]
    # dependencies rather than the dev group for that reason — a dev-only
    # declaration would leave `cd shared && npx pyright` reporting
    # reportMissingImports and would break any consumer importing the module.
    # The module is deliberately NOT re-exported from shared/__init__, so
    # `import shared` still does not pull fastmcp. See task 3689.
    #
    # >=3.2, NOT the >=2.0 that escalation/ and orchestrator/ declare: this is
    # the first module in the workspace to depend on a 3.x-only import path.
    # `fastmcp.tools.base` exists only after tool.py was renamed to base.py,
    # and `fastmcp.server.middleware.Middleware` did not exist before 2.9 — so
    # any resolution under 3.2 breaks `import shared.mcp_markup_middleware`
    # outright rather than degrading. 3.2.2 is what every substrate fact in
    # that module's docstring was measured against and what uv.lock already
    # resolves, so the floor now names the API actually validated.
    "fastmcp>=3.2",
]

[project.optional-dependencies]
vllm = ["aiohttp>=3.9"]

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.4",
    "aiohttp>=3.9",
]

[tool.pytest.ini_options]
markers = ["integration: live CLI tests requiring OAuth accounts (deselect: -m 'not integration')"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
# Default per-test timeout. THE CANONICAL RATIONALE for this setting across
# the workspace — orchestrator/, fused-memory/, escalation/ and dashboard/
# pyproject.toml cite this block rather than restating it.
#
# WHAT IT CATCHES: accidental asyncio-sleep hangs (e.g. a misconfigured
# UsageGate mock whose slot.detect_cap_hit returns a truthy MagicMock, sending
# invoke_with_cap_retry through 19 real exponential-backoff sleeps), and
# deadlocked lock implementations. Slow tests can opt out with
# @pytest.mark.timeout(N).
#
# WHY 300 AND NOT THE FORMER 60 (2026-09-12). The cap is WALL-CLOCK, not CPU
# time. On this 32-core host under sustained load (~180 at the time of the
# change) a perfectly healthy test can exceed 60s from CPU STARVATION alone,
# without being hung at all. The cost of that is not one honest red: under
# timeout_method = "thread" pytest-timeout answers a breach by os._exit()ing
# the xdist worker, and --max-worker-restart=0 degrades that into a clean
# per-test FAILURE whose victim is whatever test happened to be on the dead
# worker — NOT the starved one. That is the "shifting victim" false-red
# mechanism from the CPU-contention RCA (memory:
# project_cpu_contention_test_flakiness_rootcause_2026_07_18).
#
# So 300 attacks the TRIGGER and deliberately leaves both safety mechanisms
# intact: timeout_method and --max-worker-restart=0 are UNCHANGED, each having
# been chosen against a measured worse failure (task 1907).
#
# 300 IS INTERIM AND JUDGEMENT-PICKED, NOT MEASURED. Nobody has yet measured
# the real test-duration distribution under load; a follow-up task owns that
# measurement and owns replacing this with a data-driven value. The cost of
# the interim: a genuinely hung test now takes 5 minutes to surface, not 1.
#
# signal method is load-bearing HERE: thread method prints a stack trace but
# can't actually interrupt a blocking asyncio.sleep in the main thread.
timeout = 300
timeout_method = "signal"

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "tests", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Task 3367 / esc-3359-1: pins pyright's interpreter to THIS worktree's own
# .venv (venvPath is resolved relative to this file's directory, so it can
# never name another tree's environment). Without it, a bare `cd shared && npx
# pyright` resolves the interpreter from ambient VIRTUAL_ENV/PATH — which
# verify._target_subprocess_env deliberately strips — so a cold merge worktree
# type-checks against an env holding none of the workspace's third-party
# packages: measured 68 phantom reportMissingImports here, 0 with this pin.
# Today this member is type-checked via `uv run --project shared ... pyright`,
# which resolves the SAME root .venv, so the pin changes no current result —
# it only removes the dependency on ambient resolution.
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
