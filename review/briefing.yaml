# Review briefing — contextualises /review runs with durable project truths.
# Auto-generated by /review-briefing. Human edits preserved on update.
# Last updated: 2026-06-23T12:00:00Z

project: dark-factory

# Current focus: stability and robustness. Prioritize findings that affect
# data integrity, resource leaks, crash recovery, and — above all — SILENT
# STRANDS (non-terminal work whose only advancer can die with no escalation;
# see stability_concerns[0]) over feature gaps.

# Conventions and rules with teeth — violations are always bugs.
conventions:
  # --- Standing review invariants (enforced every review) ---
  - rule: "TODO-tracking invariant — every real TODO/FIXME/HACK marker (and todo!()/unimplemented!() stubs) must be tracked by a NON-TERMINAL task whose brief names resolving that marker as a completion condition"
    why: "A TODO merely citing a task id is NOT tracked — the cited task's brief must actually cover it. A marker whose tracking task is done/cancelled while the marker still applies is ORPHANED and must be re-attached or re-filed. As of 2026-06-23 the four live app-code markers are tracked by tasks 1876 (verify_runner.py:531 γ cleanup), 1877 (task_knowledge_sync 1139-gc removal), 1878 (git_ops.py:915 train β₂ reuse), 1879 (escalation queue.py:240/:927 perf). NOTE: the TODO/FIXME/HACK strings in orchestrator/src/orchestrator/agents/roles.py are reviewer-instruction PROMPT TEXT, not real markers — do not flag them."

  - rule: "Deferred-task invariant — a task must never sit in `deferred` without a concrete, actionable flip-to-pending condition recorded on it"
    why: "If the gate is dependency-shaped, express it as dep edges and keep the task `pending` (the scheduler respects deps; `deferred` quarantines — nobody polls it). Human-judgment gates use the escalate-on-dispatch SOP (file `pending`, brief escalates to human on dispatch with concrete A/B evidence). Both current deferred tasks (1147 architect plan-resume, 1853 σ allowlist re-baseline) correctly record their flip/cancel triggers."

  - rule: "Silent fall-through on error is a tracked anti-pattern; new bare-except/silent-degradation sites are forbidden by the σ pytest AST-scan lint gate"
    why: "A 2026-06 agent-team sweep found 48 silent-fall-through-on-error sites (task-1799 family); the dedup batch (1803-1819) added a pytest AST-scan gate with an explicit allowlist at shared/tests/silent_fallthrough_allowlist.py. A guard that detects a SYSTEMIC break must escalate LOUDLY to get it fixed FIRST; degradation is secondary and must never suppress the escalation."

  - rule: "Cross-project task dependencies use the qualified `project_id:task_id` form, routed to metadata.external_deps and resolved at dispatch via get_external_statuses"
    why: "A `:`-containing depends_on goes to metadata.external_deps (a list), not the integer dependencies table — no schema migration. The gate lives in the dependent's scheduler only, checked at dispatch time; `cancelled` escalates immediately, unresolvable sentinels (unknown_project/unknown_task/malformed) grace-then-escalate, resolver errors fail-safe WAIT (never unblock on a lie). See CLAUDE.md 'Cross-project task dependencies'."

  - rule: "Each subproject's orchestrator.yaml verify command must use `uv run --project <member> --directory <member>`, not bare `uv run`"
    why: "Bare `uv run` fails with 'Failed to spawn: pytest' in a fresh _merge-* worktree; unregistered members fall back to __fallback__ root-pyright false errors. Configs are CACHED at orchestrator startup, so orchestrator.yaml fixes CANNOT land via the merge queue (self-block) — they need direct-commit + stop→commit→start."

  - rule: "merge_request is never called foreground/unbounded at the top level — always pass an explicit bounded wait_secs (≤100s server clamp) and poll merge_status"
    why: "An unbounded foreground call froze a real watch loop >30 min on a reify merge. The invariant is 'never call merge_request at top level'; fixing only the one documented call site leaves improvised paths uncovered. asyncio.shield + the durable-intent waiter mean a submitted merge survives a session drop."

  # --- Subsystem rules ---
  - rule: "All task state operations route through fused-memory MCP tools, never Taskmaster directly"
    why: "TaskInterceptor must see every state transition to trigger reconciliation and emit done_provenance; bypassing it causes memory/task desync"

  - rule: "set_task_status is the only legal path for terminal-state transitions; update_task(status=...) is server-rejected"
    why: "Status changes raise the SetTaskStatusRejected family (TerminalExitRejection, DoneGateRejection, ProvenanceValidationRejection) and run gates; the update_task bypass was closed 2026-05-08 after causing repeated phantom-done corruption. Scheduler.mark_done is the canonical done helper."

  - rule: "aiosqlite stores set the pragma triad and expose checkpoint()"
    why: "synchronous=FULL + wal_autocheckpoint=100 + journal_size_limit. Mandated 2026-05-14 after the task-DB-loss incident where a fused-memory SIGABRT silently lost ~150 reify tasks because WAL frames had not checkpointed for 60+ hours."

  - rule: "Every curator ticket is owned by exactly one fused-memory instance"
    why: "Enforced by (1) the OS-wide singleton lock binding an abstract Unix socket on fused-memory startup, (2) per-process tickets.db with no replication, (3) DASHBOARD_FUSED_MEMORY_URLS is documented as failover-only network paths to the same logical store — not sharding. A not_found response from URL[0] is authoritative. See DESIGN.md 'Curator Tickets & Routing Invariant'."

  - rule: "Merges to main route through the escalation MCP's merge_request when the orchestrator is running"
    why: "Serializes merges and prevents races against the orchestrator's own merge worker. Direct `git merge --no-ff` on main is only acceptable when the orchestrator is stopped and the pre-merge-commit hook is bypassed with explicit user authorization."

  - rule: "LLM prompts use system/user message split, not f-string interpolation"
    why: "Prompt injection mitigation — user content must never be interpolated into system prompts (commit 163594a)"

  - rule: "Orchestrator agents use OAuth tokens, not ANTHROPIC_API_KEY"
    why: "API key is stripped from subprocess env in cli_invoke.py to prevent accidental direct API billing; forces Max subscription usage. Account pool is centralised in config/usage-accounts.yaml."

  - rule: "Task project_root must be an absolute path — empty/relative/None is rejected"
    why: "Cross-project contamination fix — _base_args used to silently fall back to server default, routing all projects to dark-factory"

  - rule: "Active databases live at data/ (repo root), not fused-memory/data/"
    why: "Fused-memory config uses relative paths that resolve against systemd CWD (repo root). Live tickets DB is data/reconciliation/tickets.db. Exception: fused-memory/data/qdrant/ is live Qdrant storage."

  - rule: "FalkorDB and Qdrant run as native host processes, not via docker-compose"
    why: "docker-compose.yml exists but is not the active deployment model; services run natively with systemd/manual management"

  - rule: "Port 8002 is the canonical fused-memory HTTP endpoint; the multi-URL config is failover-only"
    why: "Singleton lock prevents any second instance from binding; DASHBOARD_FUSED_MEMORY_URLS provides alternate network paths to the one logical store, not separate stores"

  - rule: "MEM0_TELEMETRY must be set to false in fused-memory's environment"
    why: "mem0's capture_event() creates a new Posthog Consumer thread per API call, leaking ~8000 threads/day and causing 1400% CPU"

  - rule: ".task/ directories must never be committed to main"
    why: "Per-task plan.json/iterations.jsonl artifacts from worktrees contaminate later unrelated worktrees if they land on main"

  - rule: "The redux dashboard never renders synthetic, PRNG, or mockup data"
    why: "Hard product rule — operators distrust dashboards that lie. Empty state is '—' or empty spark, not a stand-in. Caught regressions in early-mockup PRs."

subprojects:
  fused-memory:
    purpose: >
      Unified memory backbone. Combines Graphiti (temporal knowledge graph on FalkorDB)
      and Mem0 (vector store on Qdrant) behind a single MCP interface, proxies Taskmaster
      for task management, runs automatic reconciliation on state transitions, and hosts
      the Curator subsystem that produces ticket-level decisions for task state changes.
      If this doesn't work, nothing else in the factory works.

    key_scenarios:
      - "A memory written via add_memory is retrievable via search across sessions (the core value prop)"
      - "Task status changes trigger targeted reconciliation automatically — completion knowledge is written, dependent tasks get memory_hints"
      - "Status transitions go through the typed gate family — terminal-exit, done-gate, provenance-validation, phantom-done — and emit done_provenance"
      - "Curator (TicketStore + TaskInterceptor + TicketJanitor + Curator agent) produces decisions for ticket workers; tickets live on exactly one fused-memory instance"
      - "TicketJanitor reaps stale work via worker-liveness (task_interceptor.is_worker_alive), not TTL — sweep_expired/extend_pending_expiry were retired 2026-05-08"
      - "The durable SQLite write queue survives crashes without losing Graphiti writes (pragma triad enforced)"
      - "Two-phase task creation: submit_task returns a ticket; resolve_ticket blocks for the curator's create/combine/drop decision"
      - "get_external_statuses resolves cross-project task deps for a dependent project's scheduler (flat {dep: status}, explicit unknown_project/unknown_task/malformed sentinels)"
      - "Stage 1 → Stage 2 reconciliation pipeline runs post-flight guards (terminal-state pre-check, flag dedup, snapshot discipline) without corrupting data"
      - "Multiple concurrent MCP clients share state correctly through the singleton server instance (one host, one daemon)"
      - "Thread count stays stable over time — no resource leaks from telemetry, backends, or reconciliation subprocesses"

    what_working_means:
      - "Server starts on port 8002, singleton lock prevents duplicate instances"
      - "get_status returns healthy for all backends (Graphiti, Mem0, Taskmaster)"
      - "Unit tests pass — they mock backends so no running services needed"
      - "Thread monitor shows ~33-40 Python threads (threading.active_count) stable over time — MainThread + bounded asyncio default pool + one aiosqlite worker per SQLite store; no upward drift = no leak (OS-level thread count is higher, ~66, due to jemalloc and unnamed python3 kernel threads)"
      - "Memories route correctly by category: entities/temporal/decisions → Graphiti, preferences/procedural/observations → Mem0"
      - "tickets.db pragma settings include synchronous=FULL, journal_mode=WAL, wal_autocheckpoint=100"

    key_decisions:
      - decision: "Two-tier write classification — heuristic regex first, LLM fallback if ambiguous"
        why: "Latency matters for the fast path; most queries are classifiable by keyword patterns alone"

      - decision: "Reconciliation stages run as Claude CLI subprocesses, not in-process agents"
        why: "Stages need MCP tool access; CLI provides that without reimplementing the protocol. Per-stage permissions enforced via --disallowedTools. NB: CLI 2.1.168 routes --json-schema via a denied-able synthetic StructuredOutput tool — disallowed_tools='*' must expand to real builtins EXCLUDING StructuredOutput, else all structured classifier calls silently fail (fixed acd0814373)."

      - decision: "SQLite durable queue with the pragma triad"
        why: "Crash safety — Graphiti writes take seconds and losing them is unacceptable. The 2026-05-13 reify incident proved that aiosqlite defaults (synchronous=NORMAL, no auto-checkpoint cap) are insufficient under reader contention."

      - decision: "Singleton lock via abstract Unix socket"
        why: "Found 6 concurrent stale instances causing task tree corruption and data integrity issues; systemd Restart=on-failure would spawn new instances without killing orphans. This is also the basis for the curator-ticket routing invariant."

      - decision: "Typed SetTaskStatusRejected gate family with carve-outs"
        why: "Phantom-done corruption (2026-05-10) and the update_task(status=) bypass (2026-05-08) showed that string-return error reporting let callers ignore failures. Typed exceptions force handling; carve-outs (terminal-target, reopen_reason) are explicit."

      - decision: "Write deference during full reconciliation cycles"
        why: "Targeted-recon writes are deferred to a table and replayed after the cycle, preventing conflicts with the consolidation stage"

      - decision: "Worker-liveness, not TTL, for ticket reaping"
        why: "TTL expiry rate was too coarse — cap-bounce sessions completing slowly were reaped mid-work. TicketJanitor now consults task_interceptor.is_worker_alive and expires_at is a far-future placeholder."

      - decision: "Reconciliation must not load the full task tree on the event loop"
        why: "A full-tree read on the loop starved the systemd watchdog into ~10min SIGABRT cycles (2026-06-15, tasks 1754/1755/1758/1759). WatchdogSec is 120; status-only callers should use get_statuses, not get_tasks."

    known_gaps:
      - what: "No e2e integration tests against real FalkorDB/Qdrant"
        why: "Infrastructure complexity; unit tests cover routing/classification/queue logic"
        tracking: null

      - what: "Cap detection relies on text-pattern matching of CLI stdout/stderr"
        why: "No structured error code from Claude CLI; fragile against future phrasing changes"
        tracking: null

      - what: "The known-bug-1139 drop guard (_KNOWN_BUG_1139_CONTENT_MARKERS + _should_skip_known_bug_1139_flag) is orphaned leftover GC"
        why: "Task 1139 (the Stage-1→Stage-2 flag relay fix) merged 2026-05-09 and has been stable; the temporary scoped drop guard should now be removed. TODO(task-1139-gc) at task_knowledge_sync.py:88/:138."
        tracking: "1877"

    exclude:
      - "dark_factory/, reify/ — untracked symlink artifacts, not application code"
      - "docker/ — infrastructure config, not actively used for deployment"
      - "maintenance/ scripts — one-off database repair tools for specific incidents, not part of the running server"

  orchestrator:
    purpose: >
      Decomposes PRDs into task trees and implements them via coordinated AI agents
      in isolated git worktrees. The engine that turns specifications into working code
      without human intervention under normal conditions.

    key_scenarios:
      - "A PRD is parsed into tasks, scheduled respecting module locks (eager parks, cross-tier preemption, no tier caps), and implemented concurrently"
      - "Each task goes through ARCHITECT → IMPLEMENT → REVIEW → MERGE without human intervention"
      - "Steward (persistent Claude session with $12 budget) auto-resolves L0 escalations before they reach L1/human"
      - "Cross-tier preemption PUSHES the victim's park onto a per-module LIFO stack (shadowing); when the preemptor clears, the buried owner is POPPED and RESTORED — wide-footprint high-priority tasks reassemble without stranding the displaced lower-priority owners"
      - "Multiple waiting single merges can be COALESCED into an atomic train (GroupMergeRequest); the stacked tip is verified+merged once, then each member is flipped done"
      - "A task gated on a cross-project dependency (metadata.external_deps) is dispatched only when all external deps resolve to done; cancelled/unresolvable deps escalate"
      - "A merge verify can be dispatched to a remote host (RemoteRunner over ssh) with fail-safe fallback to local when the host is unreachable (Lever C multi-host verify)"
      - "Drop-guard / L1-on-clash / merge-thrash detection catches plan/merge divergence — short-circuits to L1 without retry-budget waste"
      - "Crashed runs recover work-in-progress from surviving worktrees; agent sessions resume across orchestrator restarts"
      - "Cancelling a task auto-sweeps its non-terminal descendants — classifies each as cancel (deterministic orphan), L1 (orch live), or block (orch dead)"
      - "Merge happens in an isolated temporary worktree via git update-ref, never in the main working tree"
      - ".task/ artifacts stay in worktrees and never land on main"

    what_working_means:
      - "CLI starts and parses arguments correctly"
      - "Unit tests pass"
      - "A dry run successfully parses a PRD into a task tree"
      - "Tasks produce commits on main with no .task/ directory contamination"
      - "The scheduler dispatches tasks honouring module locks without starvation under cross-tier load; preempted park owners are restored, not destroyed"

    key_decisions:
      - decision: "Single scheduler (the former 'v2') — eager parks (full set), no leases, no tier caps, cross-tier preemption, SQLite-backed override store"
        why: "v1's tier caps continuously idled worker slots speculatively. v1 has been fully removed; scheduler.py is the sole scheduler (the old 'v1 still present' gap is closed)."

      - decision: "Park-stack LIFO ('shadowing'), not destroy-the-park, on cross-tier preemption"
        why: "The old behaviour DESTROYED a lower-priority owner's park when a higher-priority task preempted it, so a wide-footprint preemptor that never fully reassembled left an immortal partial park and stranded the displaced owners (df task 1865). install_parks() now PUSHES on top; _remove_owner() POPS & RESTORES the next buried owner under its original module identity. snapshot_parks() is intentionally TOP-ONLY (INV-7) — buried/shadowed owners are invisible to it by design; a separate full-stack snapshot (snapshot_park_stacks, task 1868) feeds the dashboard."

      - decision: "Merge-queue COALESCING / atomic train merges (live and load-bearing)"
        why: "Multiple waiting single MergeRequests are promoted into one coalesce-* GroupMergeRequest (linear-stacked branches); the tip is verified+merged once and mark_member_done flips each member on success only. Members hold in the 'merge-deferred' state. Coalescing fires only when the pipeline is idle (never behind a verifying speculative merge), debounces on an unchanged waiting-set signature, and excludes risky-terminal members (blocked/error). It is ENABLED in production — treat the train / merge-deferred / derail paths as production-critical (see stability_concerns[0] for the derail-strand hazard)."

      - decision: "Cross-project external task dependencies resolved at dispatch time"
        why: "metadata.external_deps (list of 'project_id:task_id') is resolved via get_external_statuses at each dispatch tick; the gate lives only in the dependent's scheduler. Resolver read mismatch (consumer expected key 'statuses', producer returns flat dict) silently wait-blocked forever until fixed 2026-06-19 (tasks 1854/1855) — fail-safe-wait must never be confused with a satisfied dep."

      - decision: "Multi-host remote merge verify (Lever C) with fail-safe local fallback"
        why: "RemoteRunner git-pushes the merge SHA to refs/merge-verify/<id> and ssh-runs `orchestrator verify-merge --sha --spec`; a transport failure raises RunnerUnavailable and the pool falls back to LocalRunner — a closed/offline laptop must NEVER stall the queue. ≤1 in-flight verify per host (the per-host warm worktree makes this a hard bound). LocalRunner intentionally IGNORES the spec document (drives via injected callables + live config); RemoteRunner consumes it."

      - decision: "Multi-provider agent invocation (Claude, Codex, Gemini) via eval-driven selection"
        why: "Different providers excel at different task types and price points; tiered routing recommended by eval results"

      - decision: "Git worktree isolation per task"
        why: "Prevents merge conflicts between concurrent tasks; each works on a clean branch"

      - decision: "Module-lock framing for scope discipline, not file-in-diff"
        why: "The scheduler's own invariant is membership of a task's module-lock set; checking against the diff produces phantom overlaps when stale worktrees branch from a moved HEAD."

      - decision: "Merge via git update-ref in temporary worktree, not in the main working tree"
        why: "Atomic pointer update only after post-merge verification passes; serialized by _merge_lock. Post-merge equivalence check is branch-touched-scoped to avoid false positives from speculative-merger siblings."

      - decision: "Per-task verification scoped to task files; merge-gate verify runs the project's WORKSPACE-WIDE command"
        why: "Fast per-task verification; integration-level regressions caught at the post-merge step. Train members run workspace verify against their own stacked tip before entering merge-deferred."

      - decision: "Drop-guard truth-from-tip: plan-targets are compared against the task HEAD vs the merge commit, not against speculative resolution"
        why: "UnresolvedStep machinery was retired 2026-05-08; reason.startswith() short-circuits dropped_plan_targets / plan_files_not_touched / post_merge_equivalence_failed to L1 (no steward)."

    known_gaps:
      - what: "Sandbox: bwrap remains crash-prone for Bun (Bun 1.3.x segfaults under bwrap on kernel 6.17), so auto-selection prefers landlock"
        why: "config exposes auto/bwrap/landlock/none; _resolve_auto picks landlock > bwrap > none. bwrap is NOT globally broken — it is a Bun-on-kernel-6.17 crash; bwrap stays in the codebase and is functional on unaffected hosts."
        tracking: null

      - what: "The reuse-existing-worktree path rebases onto main unconditionally, even for stacked train members (order>0)"
        why: "TODO(train, β₂ follow-up) at git_ops.py:915. The train create path is stacking-aware but the mid-verify REUSE path is not — a reused order>0 worktree could be rebased onto main and lose its predecessor base. Matters now that coalesce trains are live."
        tracking: "1878"

      - what: "Orphaned stale TODO(γ) at verify_runner.py:531 ('when a RemoteRunner is added…')"
        why: "RemoteRunner now exists and consumes spec; the future event the TODO waited on has occurred. Comment-only cleanup; LocalRunner ignoring spec is by design."
        tracking: "1876"

    exclude:
      - "evals/tasks/, evals/results/, evals/reviewer_trial/results/ — evaluation fixtures and output data (their JSON contains TODO/NotImplementedError strings that are eval content, not real markers)"

  shared:
    purpose: >
      Internal library providing the Claude CLI invocation wrapper and the multi-account
      usage gate (OAuth failover across Max subscription accounts). Exists so fused-memory
      and orchestrator share this code without circular dependencies. It is now the SINGLE
      source of truth: orchestrator/usage_gate.py is a thin re-export shim.

    key_scenarios:
      - "invoke_claude_agent shells out to Claude CLI and returns structured AgentResult"
      - "Session resume via --resume for long-running steward conversations"
      - "invoke_with_cap_retry automatically fails over to backup OAuth accounts when usage caps are hit"
      - "Per-session budget enforcement prevents runaway spending — note LLM-gate budgets must clear the FIXED cli_invoke cost floor (~$0.10+), not be sized on prompt length"
      - "Both orchestrator and fused-memory reconciliation read the same account pool from config/usage-accounts.yaml"

    what_working_means:
      - "Unit tests pass (all CLI invocations mocked)"
      - "ANTHROPIC_API_KEY is stripped from subprocess env (forces OAuth)"
      - "Cap detection phrases match current Claude CLI output"
      - "HTTP 429 from the CLI routes to cap-hit, not auth-failed"

    key_decisions:
      - decision: "Cap detection via text-pattern matching on stdout/stderr"
        why: "No structured error code from CLI; scans for phrases like 'You've hit your' and 'RESOURCE_EXHAUSTED'"

      - decision: "Usage gate state is per-process, but the account list is centralised"
        why: "Simplicity; two concurrent processes maintain independent gate state, but both consult config/usage-accounts.yaml so account ordering and identity stays consistent"

      - decision: "HTTP 429 classifies as cap-hit, not auth_failed"
        why: "cli_invoke's auth predicate is narrowed to {401, 403}; _run_probe also demotes auth_failed→capped on cap prefix as belt-and-braces"

      - decision: "shared.usage_gate is canonical; orchestrator/usage_gate.py is a `from shared.usage_gate import *` shim"
        why: "The old 'not yet unified' gap is closed — there is one implementation (~1376 lines in shared), no drift risk"

    known_gaps:
      - what: "No cross-process usage gate coordination"
        why: "Orchestrator and fused-memory reconciliation each have their own gate instance; could cause both to hit the same account simultaneously"
        tracking: null

    exclude: []

  dashboard:
    purpose: >
      Read-only monitoring web UI. The user-facing surface is a JSX SPA in
      static/redux/ (tabs: overview, tasks, curator, scheduler), served by a FastAPI
      backend that reads directly from the same SQLite databases fused-memory and the
      sampler write, and proxies a narrow set of MCP calls. Gives a human operator a live
      view of memory health, write-queue status, reconciliation activity, orchestrator
      progress, scheduler parks, curator queue/latency, merge-queue/halt state, host load,
      and historical cost/performance metrics.

    key_scenarios:
      - "Watching an orchestrator run in real time with per-task progress and details panes"
      - "Inspecting the curator queue — outstanding tickets, latency, cancel button per ticket"
      - "Observing merge-queue state — queued merges, halt status, who/why halted"
      - "Inspecting scheduler park state — which modules are parked and by whom"
      - "Reviewing host load (PSI + verify concurrency/RSS + OCCT queue depth) from the sampler's load-samples.db"
      - "Reviewing costs by account / project / role / run, plus burndown and cap history"
      - "Checking memory subsystem health — Graphiti, Mem0, queue status"
      - "Inspecting reconciliation pipeline history — runs, events, judge verdicts"

    what_working_means:
      - "Server starts on port 8080 and the redux SPA loads all tabs"
      - "Health cards show live data from fused-memory on port 8002"
      - "Graceful degradation when fused-memory or SQLite DBs are unavailable (offline banner, empty state — never synthetic data)"
      - "Tests pass covering routes, data layer, and template/JSX behaviour"
      - "After a backend (Python) change, `systemctl --user restart dark-factory-dashboard.service` is required for the API to pick it up — uvicorn does not auto-reload"

    key_decisions:
      - decision: "JSX SPA ('redux') is the only UI; htmx + Jinja partials were fully removed"
        why: "After the 2026-04 rewrite, regressions are fixed forward in JSX, never by restoring htmx partials. The legacy templates/ directory is gone; static/redux/*.jsx is the UI."

      - decision: "No synthetic / PRNG / mockup data anywhere in the dashboard"
        why: "Operators distrust dashboards that lie. Empty state is '—' or empty spark; never fake sparklines or hardcoded literals."

      - decision: "Direct SQLite reads for reconciliation/performance/curator/load data"
        why: "Read-only URI mode (mode=ro) on the same DBs fused-memory and the sampler write; avoids adding API endpoints for monitoring. The load schema (LOAD_SAMPLES_SCHEMA) is a hand-maintained copy of sampler.store._SCHEMA — a manual sync contract, not an import."

      - decision: "Fan-out across DASHBOARD_FUSED_MEMORY_URLS is failover-only, with first-success-per-root semantics"
        why: "Curator tickets live on a single instance (singleton-lock invariant), so a not_found from URL[0] short-circuits — no need to try other URLs. Avoids double-counting across failover URLs."

      - decision: "The ORCHESTRATORS panel is live-process-driven; DASHBOARD_KNOWN_PROJECT_ROOTS only feeds cost/burndown aggregation"
        why: "A missing project means a dead service (find_running_orchestrators returns [] for non-running), not a known-roots gap — check systemctl is-active first. Known roots are registered in INSTALLED systemd units, not committed templates."

      - decision: "DF_DATA reference-capture loader pattern"
        why: "shell.jsx captures PROJECTS/AGENTS arrays at module load; the loader mutates them in place via STABLE_ARRAY_KEYS so live refresh keeps the references stable for child components"

    known_gaps:
      - what: "The scheduler view shows only ACTIVE-TOP parks (INV-7); buried/shadowed park owners and orphaned parks are invisible"
        why: "snapshot_parks() is intentionally top-only, so a preempted-but-shadowed owner or a stranded orphan park does not render. The park-stack-visibility batch (PRD plans/dashboard-park-stack-visibility-prd.md, tasks 1868-1874) adds a full-stack snapshot, stranded/orphan surfacing, and an evict control."
        tracking: "1868"

    exclude:
      - "static/ — vendored CSS/JS assets (favicon, tailwind, third-party libs)"

  escalation:
    purpose: >
      Filesystem-based escalation queue and MCP server implementing a THREE-tier
      interrupt ladder: L0 (agent → per-task steward, autonomous), L1 (steward/workflow →
      escalation-watcher-auto, automated triage), L2 (auto-watcher → human, via
      promote_to_l2). Also serializes orchestrator merges via the merge_request /
      merge-queue halt/release family. Uses plain JSON files with atomic tmp-rename writes.

    key_scenarios:
      - "Blocking escalation pauses the agent until the steward (L0) resolves it"
      - "L1 escalation-watcher-auto resolves admin-class items (scope_violation, dependency_discovered, cleanup_needed) directly and PROMOTES everything else to L2 for the human"
      - "promote_to_l2 dedups on root_cause (exact-string key): a matching pending L2 is UPDATED (members appended) rather than duplicated; member L1s stay at L1 and are resolved by cascade"
      - "Born-at-L2 bypass: only sentinel roles (harness-*/orchestrator-*) filing severity critical/urgent reach humans directly; a non-sentinel critical is downgraded to blocking"
      - "merge_request serializes orchestrator merges (async, bounded wait_secs ≤100s, then poll merge_status); asyncio.shield keeps a submitted merge alive across an MCP disconnect"
      - "unhalt_merge_queue is a strict recovery hatch — refuses to act if force_unhalt_merge_queue points to an active escalation"
      - "Stale escalations auto-dismissed on orchestrator restart after crash"
      - "Resolution text injected into next agent briefing as the feedback mechanism (reaches the agent only on the L0 live-workflow path; memberless born-at-L2 does not re-pend)"

    what_working_means:
      - "Unit tests pass (queue atomicity, dismiss, watcher behavior, promote/cascade)"
      - "Escalation JSON files appear in data/escalations/ during orchestrator runs"
      - "Blocking escalations transition pending → resolved before agent resumes"
      - "merge_request returns serialized merge outcomes; the merger does not race against direct git merge --no-ff"
      - "A `park` resolution leaves the record pending/level-2 in the queue dir (NOT archived) — get_pending_escalations keeps returning it; this is intended, not a leak"

    key_decisions:
      - decision: "Three-tier ladder with level as a top-level integer field on each record"
        why: "Default level 0; steward/workflow promote to 1; promote_to_l2 stamps level 2. Escalations are exceptional — common edge cases get explicit inputs/escape hatches, not escalation, to avoid burning steward budget and hiding bugs."

      - decision: "Steward (L0) is a persistent Claude session (--resume) with a $12 lifetime budget"
        why: "Accumulates context across multiple escalations for the same task; budget cap forces re-escalation rather than silent runaway"

      - decision: "Async merge_request is the only merge model; 'never foreground merge at top level' is enforced at the skill layer"
        why: "wait_secs is server-clamped to ≤100s and the server accepts wait_secs=0; the bounded-wait-then-poll protocol prevents the >30min watch-loop freeze a foreground unbounded call caused"

      - decision: "Born-at-L2 severity downgrade for non-sentinel roles (C4/D3)"
        why: "Only harness-*/orchestrator-* roles can create genuine L2-born records via agent calls; a non-sentinel critical/urgent is silently downgraded to blocking (summary tagged [downgraded:critical]). A reviewer expecting critical to always reach humans will be wrong."

      - decision: "Resolution is mediated through the escalation MCP only — never edit data/escalations/*.json directly"
        why: "The escalation server holds in-memory state; direct file edits desync from server state and corrupt the queue"

    known_gaps:
      - what: "Archive scans are O(archive) on every miss — get() rglobs per archive miss; make_id() rescans for max_seq per submission"
        why: "Both are bounded by the 30-day retention window (no correctness risk) but scan cost grows with archive size. TODOs at queue.py:240 and queue.py:927."
        tracking: "1879"

      - what: "The merge-worker snapshot is read via duck-typed harness._merge_worker coupling"
        why: "Acknowledged intentional debt — the ideal fix (a public harness.merge_worker_snapshot() accessor) requires a harness module change scoped to a separate task"
        tracking: null

    exclude: []

  sampler:
    purpose: >
      Host-load sampler. A timer-fired ONE-SHOT (Type=oneshot, every 5s — NOT a daemon)
      that collects 9 load metrics — PSI cpu/memory/io avg10 from /proc/pressure, plus
      occt_queue_depth, verify_concurrency, verify_rss_total_bytes from the process table —
      and appends them to data/load-samples.db, which the dashboard reads to render live
      system-health panels. Gives the factory an always-on load signal without a long-lived
      process that could hang or leak.

    key_scenarios:
      - "Every 5s systemd fires the unit; PSI rows + process-level rows are written to data/load-samples.db; the dashboard /api/load endpoint reads them into sparklines"
      - "occt_queue_depth shows how many cargo-test-occt-gated bash processes are blocked on the OCCT semaphore; verify_concurrency/RSS show verify.sh saturation"
      - "24-hour rolling window retained (per-tick prune + daily VACUUM) so the DB stays small regardless of uptime"
      - "Degrade-and-continue: a PSI-collection failure still writes process metrics and vice versa; only a store-construction failure exits non-zero"

    what_working_means:
      - "systemctl --user is-active dark-factory-load-sampler.timer returns active"
      - "data/load-samples.db exists at repo root within ~15s of enabling"
      - "9 distinct metrics appear in the last 30s; journal shows `tick ts=… psi={…} process={…}` lines every 5s with no exception entries"
      - "The dashboard load panel shows non-null sparklines for all 9 metrics"

    key_decisions:
      - decision: "Timer-fired oneshot, not a daemon — no in-memory state survives between ticks"
        why: "Avoids a long-lived process that could hang/leak; trailing-window process metrics are computed by querying the last ~59 DB rows each tick, not from an in-process ring buffer"

      - decision: "occt_queue_depth uses an FD-9 jobserver heuristic (a gated bash proc whose /proc/<pid>/fd/9 is absent is 'waiting')"
        why: "FD 9 is the jobserver semaphore read-end; this is an implementation-detail heuristic (metrics.py docstring flags it) that may break if the gate script changes FD numbers. Matching is substring on the cmdline, so path-form invocations (…/cargo-test-occt-gated.sh) are counted."

      - decision: "VACUUM opened with isolation_level=None (autocommit), timestamp recorded only after success"
        why: "Avoids 'cannot VACUUM from within a transaction'; recording the time only on success avoids suppressing retries on transient failure"

    known_gaps:
      - what: "The load-samples schema is duplicated between sampler.store._SCHEMA and dashboard's LOAD_SAMPLES_SCHEMA with no automated sync check"
        why: "A manual contract; a sampler schema change without a matching dashboard update would surface only as a dashboard query failure at read time. Documented in both files, but unenforced."
        tracking: null

    exclude: []

# Recurring stability issues — these are the highest-priority review targets.
# A reviewer should actively look for regressions or new instances of these patterns.
# stability_concerns[0] is the HEADLINE concern as of 2026-06.
stability_concerns:
  - area: "Non-terminal-parked-strand — silent permanent strand of parked work (HEADLINE)"
    history: >
      The factory's highest-recurrence integrity failure in 2026-06. A task enters a
      NON-TERMINAL PARKED state — a scheduler park ('blocked'), a 'merge-deferred' train
      member, or a degenerate-branch 'in-progress' (tip == branch_base_sha) — whose
      advancement is owned by exactly ONE actor (the park owner / group-merge worker /
      provisioning agent). When that sole advancer dies, the task strands forever: the
      reconciliation recovery sweep is DELIBERATELY excluded from acting on that parked
      state (to protect live worktrees / declared-train members), so no escalation ever
      fires and the dashboard shows nothing. Confirmed instances:
      (1) park-stack preemption destroying a lower-priority owner's park → wide-footprint
      task never reassembles, strands the displaced owners (df task 1865, fixed via LIFO
      push/restore);
      (2) degenerate-branch in-progress with no live claimant (fixed at harness.py via
      _revert_in_progress_if_no_live_claimant — reify 2992 stuck 31h/127 sweeps);
      (3) coalesce-train derail orphaning absorbed members in merge-deferred (df task 1867,
      IN PROGRESS as of 2026-06-23 — reify 3577/3427 stranded ~19h, empty queue, no escalation).
    fix_discipline: >
      The fix is ALWAYS to restore a recovery EDGE (re-pend, re-file a stranded_* L1, or
      re-drive an orphaned member to a solo merge) — NEVER to weaken the sweep exclusion
      that protects the parked state, which would destroy worktrees the advancer still needs.
    what_to_check: >
      Any new non-terminal status or parked state; any change to _RECONCILE_SWEEP_STATUSES
      or the merge-deferred early-return guard (harness.py); any 'superseded' / 'merge-deferred'
      / 'park' transition whose only re-driver is an in-memory structure wiped on orchestrator
      restart (e.g. one-strike derail registries); any sole-advancer pattern that does not
      escalate or re-pend on advancer death.

  - area: "Task-state corruption via gate bypass"
    history: >
      Two recurring failure modes: (1) phantom-done — a task gets set to done while still
      in-progress on a worktree, fixed 2026-05-10 by inverting the phantom-done gate after
      provenance validation and adding the SetTaskStatusRejected typed family; (2) the
      update_task(status=...) bypass, closed 2026-05-08 by server-side rejection plus four
      defence-in-depth fixes. Reviewers should treat any new code path that mutates task
      status outside of Scheduler.mark_done / set_task_status with extreme suspicion.
    what_to_check: "Any new caller of update_task that might include status; any path that mutates tasks.json or task records directly; any error swallow around SetTaskStatusRejected"

  - area: "SQLite durability under reader contention"
    history: >
      2026-05-13 incident: fused-memory SIGABRT silently lost ~150 reify tasks; root cause
      was WAL auto-checkpoint stalled for 60+ hours under persistent reader snapshots.
      Fix mandates the pragma triad (synchronous=FULL, wal_autocheckpoint=100,
      journal_size_limit) on every aiosqlite store, plus an exposed checkpoint() method.
      Hard rule: never TRUNCATE WAL on suspected loss — PASSIVE only, never delete -wal/-shm
      even if they look stale (forensic frames may carry recoverable data).
    what_to_check: "Any new aiosqlite store missing the pragma triad; any code that deletes -wal/-shm files; any maintenance script that runs WAL TRUNCATE"

  - area: "Thread leaks in fused-memory"
    history: >
      mem0's Posthog telemetry created ~8000 threads/day. Fixed via MEM0_TELEMETRY=false.
      Thread monitor (60s interval, warn >30) added for early detection.
    what_to_check: "Any new per-call object instantiation that spawns threads; any code path that creates clients without cleanup"

  - area: "Task tree corruption from concurrent access"
    history: >
      Found 6 concurrent fused-memory instances sharing one Taskmaster subprocess.
      Fixed via singleton abstract Unix socket lock. Cross-project contamination
      fixed via _validate_project_root rejecting non-absolute paths.
    what_to_check: "Any path where task mutations could race; any fallback/default logic for project_root"

  - area: ".task/ directory contamination on main"
    history: >
      Per-task artifacts (plan.json, iterations.jsonl) from worktrees getting committed
      to main, then polluting later unrelated worktrees that branch from main.
    what_to_check: "Merge logic ensuring .task/ is excluded; .gitignore coverage; any code that stages files broadly (git add -A)"

  - area: "Silent merge-queue halt"
    history: >
      The merger loop is gated by an asyncio.Event; a stuck halt strands merges silently.
      unhalt_merge_queue exists as a strict recovery hatch that refuses to act if an active
      escalation still holds the halt. Distinct from but related to the strand class above —
      a wedged merger is itself a dead sole-advancer for everything in merge-deferred.
    what_to_check: "Any code path that sets the halt event without a corresponding release; any escalation handler that returns without clearing its halt; any change to merge_request that could swallow exceptions"

  - area: "Silent fall-through on error"
    history: >
      A 2026-06 agent-team sweep found 48 silent-fall-through-on-error sites (task-1799
      family) — bare excepts / degrade-to-default paths that hid systemic breaks (e.g. the
      StructuredOutput curator outage that read as sporadic '1 of 3' blips). The dedup batch
      (1803-1819) added a pytest AST-scan lint gate (σ) with an explicit allowlist.
    what_to_check: "Any new bare except / except-and-continue that swallows a systemic failure; any guard that degrades without a loud escalation; new entries to the silent_fallthrough allowlist that should instead be fixed"

# Excluded from review entirely — these are not dark-factory application code.
global_exclude:
  - "graphiti/ — vendored upstream Graphiti repository"
  - "mem0/ — vendored upstream Mem0 repository"
  - "recon-watch/ — reconciliation-watcher run state (close-manifests, run.sh), not application code"
  - "node_modules/ — vendored JS dependencies"
  - ".claude/worktrees/, .worktrees/, .eval-worktrees/, .worktrees-orphaned/ — ephemeral working directories"
  - "data/ — runtime databases and queue files"
  - ".taskmaster/ — Taskmaster AI state files"
  - "plans/ — durable plan/briefing/PRD markdown, not application code"
