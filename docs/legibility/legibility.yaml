# dark_factory's own per-project legibility config (PRD §7.4).
#
# Opts dark_factory into the nightly confusion-reduction trickle (ε) and
# periodic census (η): plans/confusion-reduction-prd.md. Consumed by
# scripts/legibility/config.load_config via scripts/legibility/sampling.py's
# CLI (--config defaults to this path).
project_id: dark_factory
project_root: /home/leo/src/dark-factory
# 8102 is dark_factory's ORCHESTRATOR escalation queue, and it is the only
# correct value here. Do not point this at 8103 (fused-memory's RECONCILIATION
# queue): that queue has no promotion ladder — `promote_to_l2` exists in
# orchestrator/ and escalation/ and appears NOWHERE in fused-memory/src — so an
# L0 filed there stays L0 forever, behind a hand-launched consumer. Measured on
# the 2026-08-18 twin failure: reify's identical trickle L0 went L0->L1->L2 and
# reached a human in ~10 minutes on its orchestrator port, while dark_factory's
# (esc-legibility-trickle-dark_factory-1, "38/38 digests failed") sat unpromoted
# for 2d3h and was then closed only INCIDENTALLY, as a side effect of a human
# ruling reify's twin. Ruled by Leo 2026-08-25 (esc-4526-1): this was always a
# misconfiguration, never a routing choice.
escalation_port: 8102
# reify adds warm-lane + worktree roots; the inventory pre-filters
# ~/.claude/projects encoded dir names by these prefixes (57 encodings for
# dark-factory today: main checkout + .worktrees/.claude-worktrees children).
cwd_prefixes:
  - /home/leo/src/dark-factory
# Additional archive roots the miner enumerates ALONGSIDE ~/.claude/projects:
# the fleet-transcript tree produced by shared.transcript_archive (PRD task α,
# plans/agent-transcript-archival-prd.md). Relative to project_root, git-ignored
# (the dir may not exist yet). Shipping this SET turns the fleet corpus on with
# no operator flip.
agent_transcript_roots:
  - data/orchestrator/agent-transcripts
budgets:
  max_daily_digest_bytes: 300000
sampling:
  top_fraction: 0.12
  per_stratum_min: 2
census:
  max_interval_days: 10
  tasks_landed_threshold: 120
  tasks_landed_min_days: 7
  novelty_spike:
    count: 4
    window_hours: 72
  floor_days: 5
  saturation:
    dup_rate: 0.9
    consecutive_batches: 2
models:
  trickle: haiku
  census_miner: sonnet
  census_verify: sonnet
  census_synthesis: fable
# Per-census-stage `claude` CLI subprocess budgets (seconds); see the Timeouts
# model in scripts/legibility/config.py for the rationale (why each stage needs
# its own budget). Pinned here (not just riding the schema defaults) so a future
# change to those defaults cannot silently alter this project's census budgets.
timeouts:
  census_mining_secs: 120
  census_verify_secs: 900
  census_synthesis_secs: 1800
