    origin_phase: implement
    manifested_phase: review
    evidence_quote: 'The Specimens section claims: ''Four real examples, drawn from our own tool-call logs and reproduced below losslessly'' … none appear [in the corpus]. The specimens are plausible, structurally faithful reconstructions, which is a perfectly legitimate thing to file with an external vendor — but this document is being sent to a harness maintainer as an evidentiary bug report whose load-bearing rhetorical move is ''we can show you exactly what the parser received''. Shipping a sanitized reconstruction under an explicit ''exact text … losslessly'' claim is the one error that discredits the whole filing if the recipient ever asks for the raw transcript.'
