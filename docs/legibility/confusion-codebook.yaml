  cause: 'The repair() function in plan_tools.py recovers parameters based on the tool''s input schema (_CREATE_PLAN_PARAMS) but writes them directly into the plan document without validating that each parameter name maps to a corresponding field in the plan''s document schema. When a parameter like ''files'' (which must be a LIST in the plan) gets absorbed into prose fields by the harness, repair() recovers it as a STRING and writes it unchecked into plan[''files''], causing type mismatches that corrupt downstream systems: workflow.py type errors, empty lock charters, spurious merge-gate violations, and silent wrong-value persistence.'
  area: orchestrator/src/orchestrator/mcp/plan_tools.py — _repair_plan_fields function and _CREATE_PLAN_PARAMS repairable-surface table
  first_seen: '2026-08-10'
  disposition: pending
  sightings:
  - date: '2026-08-10'
    project: dark_factory
    session: 7223e48f-1bd2-45a0-aef9-34df5292d7b6
    origin_phase: architect
    manifested_phase: implement
    evidence_quote: 'When `plan[''files'']` is empty — exactly the state produced when the harness absorbed the `files` argument into `title`/`analysis` during the original `create_plan` — `_is_authored([])` is False, so `files` is treated as a hole and repair() is allowed to recover it, writing a plain STRING into `plan[''files'']`. Reproduced: `_repair_plan_fields` on a plan whose `title` absorbed a `files` parameter yields `plan[''files''] == ''orchestrator/src/a.py''` (str), `outcome: ''repaired''`, persisted by `_atomic_write_plan`; ... `workflow.py:2772` `current_files + [...]` raises TypeError'
