- id: unverified-task-premises
  title: 'Tasks filed and dispatched on unverified premises: recon-invented code models, dep ''done'' ≠ capability delivered, phantom found_on_main dones'
  severity: high
  area: process-convention / recon-prompt
  cause: Nothing verifies a task's factual premises against the tree at filing or dispatch time. Recon stages extrapolate code mechanisms from memory observations and file tasks against nonexistent paths/symbols (2083/2092/2093, 1929/1947/1971, 2433's done_provenance_invalidated with 0 repo matches); dependency status 'done' is read as capability-delivered when the dep landed only unwired primitives, feature-gated code, or a deliberately reversed contract; the found_on_main recovery gate marks tasks done with empty files lists against unrelated commits (4th recurrence), poisoning every downstream premi
  sightings_2026_06: 15
  affected:
  - recon Stage-1/2 task filers
  - architect
  - block-time investigator
  - curator
  status: partially
