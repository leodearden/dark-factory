- id: cand-20260723-2
  title: Review-suggestion settled/deferred adjudicator must be told resemblance-to-prior-round ≠ verified resolution
  cause: 'The judge task dedupes CURRENT review findings against a PRIOR-ROUND suggestions list, but that list conflates two different statuses: suggestions actually resolved (fix applied, or deliberately reverted-and-kept) and suggestions merely routed to a follow-up task and still open. Nothing in the prior-round record itself marks which is which, so a suggestion that superficially resembles an earlier one is at risk of being marked ''settled'' (suppressed) when it was in fact only deferred and remains unaddressed — the harness has to explicitly instruct the judge never to infer resolution from resemblance alone and to default to ''inconclusive'' rather than guess.'
