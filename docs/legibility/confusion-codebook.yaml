- id: cand-20260802-15
  title: Gate-logic measurement-timing asymmetry in recovery advisors
  cause: A recovery gate compares measurements taken at different points in time (age measured post-wait against grace threshold pre-wait), creating asymmetric logic where one branch is always True and the other is dead code. The guard's destructive recovery advice inverts—applying to the normal case instead of the pathological one. Confusion is cemented in OPERATIONS.md, which documents this inverted behavior as the intended action.
