- label: delta
  task_id: 3210
  title: 'E6 corpus-health detector upgrade + series: ANN candidate generation, all
    three Mem0 categories, cluster metrics'
  capabilities:
  - name: qdrant-vector-access-for-ann
    binding: 'capability→producer — scroll_by_metadata (mem0_client.py:341-424)
      does not pass with_vectors to client.scroll at all on main; delta introduces
      the parameter rather than widening an existing literal. PRD §6 states "with_vectors
      not yet passed — delta adds it", which is correct as written. The only with_vectors
      literal in the module is with_vectors=False inside get_point_by_id (client.retrieve,
      mem0_client.py:454), a different call site that delta does not touch. CHECK
      TIGHTENED (task 3364): the superseded {kind: grep, pattern: ''with_vectors: bool''}
      was FILE-scoped, so it would have reported DELIVERED had the parameter landed
      on get_point_by_id instead of scroll_by_metadata — git grep -E is single-line
      POSIX ERE and this module spreads every def across lines, so no single-line
      pattern can bind a match to one signature. Replaced by a method-scoped AST
      check that asserts scroll_by_metadata specifically DECLARES with_vectors: bool
      and FORWARDS it by name into client.scroll (an ast.Name value, so a hardcoded
      literal like get_point_by_id''s with_vectors=False does not satisfy it —
      declaration alone is not vector access). timeout_secs: 60 mirrors the sole
      existing kind: script precedent (plans/agent-transcript-archival-prd.capability-manifest.yaml);
      the check is a pure single-file AST parse, so 60s is generous'
    verdict: PASS
    delivered_check:
      kind: script
      script: scripts/check_method_param_wiring.py
      args:
      - --file
      - fused-memory/src/fused_memory/backends/mem0_client.py
      - --function
      - scroll_by_metadata
      - --param
      - with_vectors
      - --annotation
      - bool
      - --forwards-to
      - scroll
      timeout_secs: 60
  - name: ann-candidate-generation
    binding: capability→producer — query_points ANN retrieval feeding the EXISTING
      union-find (audit_duplicate_memories.py:113-153), precedent task_curator.py:1890
      verified on main
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: query_points
      paths:
      - fused-memory/scripts/audit_duplicate_memories.py
      expect: present
  - name: labeled-duplicate-pair-dataset
    binding: capability→producer — task 3130's curator-ground-truth fixture is ALREADY
      ON MAIN (fused-memory/tests/fixtures/write_triage_calibration.jsonl, 104 labeled
      records + fixtures/README.md provenance), so delta needs no dependency edge
      to 3130; PRD §8 seam honored (no new labeling here)
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: write_triage_calibration
      paths:
      - fused-memory/tests/
      expect: present
  - name: measured-not-asserted-similarity
    binding: G6 — the fixture pair's cosine AND lexical SequenceMatcher ratio are
      both MEASURED at authoring and recorded; no a-priori similarity threshold is
      asserted anywhere in the signal
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a mechanical floor grep would encode the uncalibrated bound G6 forbids;
        the two measured numbers are recorded in the test and reported alongside the
        ANN verdict
  - name: detector-cli-path-stable-for-3136
    binding: capability→consumer (PRD §8 seam) — delta EXTENDS audit_duplicate_memories.py
      rather than forking it (D6, INV-5), so 3136 keeps scheduling + gate-filing ownership
      and its topic carve-out is honored as input filtering, not reimplemented
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: audit_duplicate_memories
      paths:
      - fused-memory/scripts/
      expect: present
  - name: dropped-candidate-disclosure
    binding: INV-2/INV-4 — ANN candidate caps are DISCLOSED as counts in the M1 artifact
      (no silent truncation), so a cap firing is a countable metric the limits evaluator
      can alarm on rather than invisible recall loss
    verdict: PASS
    delivered_check:
      kind: manual
      reason: disclosure field naming is implementation-chosen; pinned by delta's
        disclosure-count test
