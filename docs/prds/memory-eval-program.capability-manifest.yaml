tasks:
- label: alpha
  task_id: 3207
  title: Memory-eval M1 metric-series schema + M2 limits evaluator (shared/, budget-derived
    alpha, grandfather ratchet)
  capabilities:
  - name: metric-series-schema-single-home
    binding: capability→producer (INV-5 / PRD D2) — one M1 schema module in shared/;
      both fused-memory and orchestrator already depend on dark-factory-shared (fused-memory/pyproject.toml
      lists only dark-factory-shared), and shared/ has no stats module today, so this
      is a fresh single home
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: memory_eval_metrics
      paths:
      - shared/src/shared/
      expect: present
  - name: limits-evaluator-single-home
    binding: capability→producer (PRD M2/D2) — evaluator implementing tripwire/proportion/count
      rule kinds, budget-derived alpha, min_samples, grandfather-set persistence,
      limits-artifact writer; stdlib-only (math.comb/lgamma), no scipy
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: memory_eval_limits
      paths:
      - shared/src/shared/
      expect: present
  - name: no-wrong-direction-orchestrator-dep
    binding: rejection-mechanism (PRD D2, INV-5) — the canary limit pattern is COPIED,
      never imported; fused-memory importing orchestrator.evals is a wrong-direction
      package edge and is verified absent on main today
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: orchestrator\.evals
      paths:
      - fused-memory/src/
      expect: absent
  - name: budget-derived-significance
    binding: 'G6 — no a-priori numeric threshold: alpha per test is derived from a
      declared false-alarm budget divided by (runs-per-quarter x alarmed-metric count),
      recomputed as metrics are added; min_samples yields the insufficient_data report
      status, never an alarm'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a mechanical grep for a numeric constant would either encode an a-priori
        bound (the exact thing G6 forbids) or match the budget config default; the
        derivation is pinned by alpha's per-rule-kind verdict fixtures incl. insufficient_data
        and grandfathered-no-alarm
