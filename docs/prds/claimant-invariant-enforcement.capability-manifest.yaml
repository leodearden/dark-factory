# Machine-readable twin of claimant-invariant-enforcement.capability-manifest.md
# Schema: shared/src/shared/capability_manifest.py (CapabilityManifestDoc,
# schema_version 1); field reference plans/capability-delivered-checks-prd.md
# Contract section. task_id stays null — commit_planning stamps it.
#
# Every `grep` pattern below was measured on main @ d31a125357 with a
# known-positive control, and EVERY check carries an explicit `paths:` scope.
# That scoping is load-bearing, not tidiness: an unscoped grep for
# DEFAULT_CLAIMANT_HEARTBEAT_TTL returns 3 hits today — all of them the PRD's
# own prose — so a repo-wide check would be satisfied by the document that
# DESCRIBES the work rather than by the work.
