# Dark Factory — project-specific orchestrator overrides.
# Core defaults are in the orchestrator package (defaults.yaml).

max_concurrent_tasks: 24

# Verification commands (dark-factory multi-subproject layout)
# test_command fans out per-subproject so each runs in its own venv with its
# own pyproject.toml (per-test timeout, -n auto, -m 'not integration', …).
# Bare ``pytest`` at the worktree root collects every subproject's tests/ into
# one process and only honours the root pyproject.toml — slow + cross-process
# state pollution. With Fix 1's docs-only short-circuit + per-subproject
# fan-out for non-prefixed source, this command rarely fires; when it does
# (root conftest.py changes), the fan-out keeps it safe.
# task 2361: worker-kill de-flake + coverage. Every segment appends
# --timeout=300 (CLI overrides each subproject's pyproject.toml timeout=60):
# orchestrator/fused-memory run pytest-xdist with a 60s per-test timeout, and
# under host CPU oversubscription a starved xdist worker crosses that ceiling,
# gets os._exit()'d by pytest-timeout's thread method, and
# --max-worker-restart=0 turns that into a false-failing per-test "node down"
# on whatever test happens to be running. A uniform ``-n`` cap was rejected:
# shared/escalation/dashboard declare no pytest-xdist, so ``-n`` would error
# with "unrecognized arguments" on those segments. A 6th segment now also runs
# the repo-root tests/scripts/ suite (not a workspace member, so never covered
# by the 5 subprojects' own tests/ dirs) via ``--project shared``, mirroring
# scripts/orchestrator.yaml, so a task scoped only to tests/scripts/ is no
# longer gated on unrelated subprojects while its own tests never run.
# task 2368: sampler is a workspace member with its own tests/ and is now
# fanned out the same as the other 5 subprojects (hard ``cd ../sampler``,
# sampler is present on main). cockpit (introduced by the un-merged Fleet
# Cockpit batch 2291-2303) is NOT yet present on main, so its segment is
# wrapped in a ``[ -d cockpit ] || exit 0`` presence guard rather than a hard
# ``cd ../cockpit`` — a hard cd would return non-zero and abort this entire
# &&-chain (used by both this fallback AND merge-queue verify) while cockpit
# is absent. The guard subshell keeps the outer cwd at repo root (it runs
# after the preceding ``cd ..``) so the trailing tests/scripts/ segment still
# resolves, and does not mask real cockpit test failures once the directory
# exists.
# NOTE: any pytest segment added to this chain in the future must also carry
# --timeout>60 — enforced by
# tests/scripts/test_fallback_verify_config.py::test_fallback_verify_raises_per_test_timeout.
# task 3384: this segment also runs ``scripts/tests/`` together with
# ``tests/scripts/`` above — a near-homograph but DIFFERENT directory (~30
# modules testing scripts/legibility/*, scripts/*.py census / trickle /
# codebook / worktree-lifecycle tooling, e.g. test_census_trigger.py and
# test_legibility_census.py). Neither the 5 subprojects' own tests/ dirs nor
# tests/scripts/ itself ever collect scripts/tests/ (it is not a workspace
# member and sits outside every subproject prefix), so it is folded into the
# same ``--project shared`` pytest invocation (scripts/tests/ imports no
# first-party package, and shared is the member declaring pytest;
# collection across the two directories' few shared basenames is safe
# because the root pyproject.toml sets addopts = "--import-mode=importlib"
# and neither directory has an __init__.py). Measured green standalone:
# 1184 passed in ~113s (lowest of local runs) — see the fleet-chain budget
# accounting below for how this feeds verify_command_timeout_secs; the
# combined-directories figure is recorded in project memory for task 3460
# rather than duplicated here.
#
# DEFENCE-IN-DEPTH ONLY: this whole chain is built by
# ``_build_fallback_config``, which ``run_scoped_verification``
# (orchestrator/verify.py) reaches only past its ``if module_configs:``
# check — i.e. only when NO module config is discovered at all.
# ``_discover_module_configs`` DOES register a ``scripts`` module config,
# and ``derive_modules`` -> ``OrchestratorConfig.for_module``'s
# longest-prefix walk resolves every scripts/** path
# (scripts/legibility/digest.py, scripts/census_trigger.py,
# scripts/tests/test_codebook.py, ...) to prefix ``scripts`` — so a
# scripts/** diff routes to scripts/orchestrator.yaml's own test_command
# instead, and this segment never executes for it. The real, still-open
# gate is scripts/orchestrator.yaml's test_command, which targets only
# tests/scripts/ under FULL_SUITE / merge-role merge_verify_breadth="full";
# task 3460 owns closing that gap there — do not re-close it here.
test_command: "cd shared && uv run pytest tests/ --timeout=300 && cd ../escalation && uv run pytest tests/ --timeout=300 && cd ../orchestrator && uv run pytest tests/ --timeout=300 && cd ../fused-memory && uv run pytest tests/ --timeout=300 && cd ../dashboard && uv run pytest tests/ --timeout=300 && cd ../sampler && uv run pytest tests/ --timeout=300 && cd .. && ( [ -d cockpit ] || exit 0; cd cockpit && uv run pytest tests/ --timeout=300 ) && uv run --project shared pytest tests/scripts/ scripts/tests/ --timeout=300"
# ``uv run`` prefix is load-bearing: ruff is not on PATH at the worktree root
# (only inside each member venv). Without it the fallback scoper (which narrows
# this to a single touched file for root-level changes) emits a bare ``ruff
# check <file>`` that exits 127 (command not found). ``uv run ruff`` resolves
# the workspace venv from root in both the full and scoped forms.
# bare-MagicMock config gate — whole-repo scope on this rare module_config-less
# fallback path (per-module orchestrator.yaml lint_commands carry the per-package
# scope; also runs in merge-queue verify; see hooks/project-checks).
# task 3397: the ``ruff check`` leg now covers all 7 [tool.uv.workspace].members
# (added sampler and cockpit — cockpit is on main now), closing the gap where a
# docs-only or cross-cutting diff (zero .py files touched -> verify._build_
# fallback_config returns None -> this chain runs verbatim, no per-subproject
# rescoping) left them never ruff-checked at the gating layer. Enforced by
# tests/scripts/test_fallback_verify_config.py::TestFleetLintCoversEveryWorkspaceMember.
# Preserve the existing chain SHAPE when editing either leg — the leading
# ``uv run ruff check ...`` head plus the ``&& python3 ...`` tail:
# verify._reproject_str relies on split_chain_tail(cmd, 'uv run') carrying the
# tail through verbatim; adding target names to the head does not disturb it,
# restructuring the chain would.
# The ``check_bare_magicmock_config.py`` tail leg now also covers all 7
# members' tests/ dirs, for the same reason and via the same workspace-member
# set as the ruff leg above — a future member is therefore caught by
# TestFleetLintCoversEveryWorkspaceMember.
# test_every_present_workspace_member_tests_dir_is_magicmock_checked rather
# than silently escaping this gate.
lint_command: "uv run ruff check shared escalation fused-memory orchestrator dashboard sampler cockpit && python3 fused-memory/scripts/check_bare_magicmock_config.py shared/tests escalation/tests fused-memory/tests orchestrator/tests dashboard/tests sampler/tests cockpit/tests"
# The bare ``npx pyright`` spelling is DELIBERATE and safe (task 3367 /
# esc-3359-1): every ``cd`` target below pins pyright's own interpreter via
# ``[tool.pyright] venvPath = ".."`` / ``venv = ".venv"`` in its pyproject.toml,
# resolved relative to that file's directory — so each clause always type-checks
# against THIS worktree's own .venv, never an ambient VIRTUAL_ENV/PATH one
# (verify._target_subprocess_env strips both) and never another tree's.
# Enforced by tests/scripts/test_fallback_verify_config.py::
# TestRootTypeCheckCommandPyrightInterpreterPinned, which walks these clauses.
# Do NOT "fix" this by rewriting the clauses to ``uv run --project <sub> pyright``:
# ``uv run --project`` SYNCS that member's environment, and every member of this
# uv workspace shares ONE root .venv — that would add a second concurrent
# shared-venv mutator racing the TEST leg's own ``cd X && uv run pytest`` fanout,
# reintroducing the mutation class tasks 2045/2048 exist to paper over. The
# pyproject pin is static config: zero mutation, zero concurrency.
# task 3397: extended from 3 to all 7 [tool.uv.workspace].members (fused-memory,
# orchestrator, dashboard, shared, escalation, sampler, cockpit), closing the
# gap where a docs-only or cross-cutting diff (zero .py files touched ->
# verify._build_fallback_config returns None -> this chain runs verbatim with
# no per-subproject rescoping) left 4 of 7 members never type-checked at the
# gating layer — the same defect class tasks 2361/2368 closed for test_command.
# cockpit gets a HARD ``cd ../cockpit`` here, deliberately NOT test_command's
# ``( [ -d cockpit ] || exit 0; cd cockpit && ... )`` presence-guard idiom:
# cockpit is on main now (unlike when that idiom was written for test_command),
# and more importantly a subshell clause is unparseable to
# verify._cd_clause_target, which requires an exact two-token ``cd <dir>``.
# Splitting a guarded subshell on ``&&`` yields a >2-token first half, which
# silently STALLS cwd tracking at the previous member for BOTH
# verify._scope_fallback_tool_to_subproject (task 3022) and
# TestRootTypeCheckCommandPyrightInterpreterPinned (task 3367) — mis-attributing
# the trailing ``npx pyright`` clause to the wrong directory. Every clause in
# this chain must therefore stay a bare ``cd <dir>`` or a bare ``npx pyright``;
# enforced by tests/scripts/test_fallback_verify_config.py::
# TestFleetTypeCheckCoversEveryWorkspaceMember, which derives coverage from
# this same &&-walk (not a substring search), so an unwalkable clause fails
# loudly as a missing member instead of silently passing.
# Measured 2026-08-02 in a synced worktree under `env -u VIRTUAL_ENV` (mirrors
# verify._target_subprocess_env): fused-memory 113s, orchestrator 220s,
# dashboard 51s, shared 64s, escalation 42s, sampler 11s, cockpit 17s — sum
# 518s. The full 7-clause chain ran end-to-end in 576s, exit 0, "0 errors" x7,
# against the 3600s warm / 5400s cold per-command budgets below (6.25x / 9.4x
# headroom) — see tests/scripts/test_fallback_verify_config.py::
# MEASURED_FLEET_TYPE_SEGMENT_SECS. A dated snapshot, not a self-maintaining
# invariant — same honesty as the test_command budget derivation below.
type_check_command: "cd fused-memory && npx pyright && cd ../orchestrator && npx pyright && cd ../dashboard && npx pyright && cd ../shared && npx pyright && cd ../escalation && npx pyright && cd ../sampler && npx pyright && cd ../cockpit && npx pyright"

# Verification timeouts. verify_command_timeout_secs is a PER-COMMAND budget
# (skills/orchestrate/references/project-setup.md:150) and the fallback fleet
# chain above is ONE shell command, so this single ceiling bounds all eight
# suites together.
#
# The "full warm verify here is ~2 min" premise these were originally sized
# against is STALE by an order of magnitude — it predates the monorepo growing
# to 9 chained suites. It is deleted rather than softened, because a stale
# justification is worse than none. MEASURED per-segment durations (task 3062
# attempt-2, .task/verify/attempt-2.__fallback__.{summary.json,test.log}, run
# started 2026-07-31T02:00:48Z under `nice -n 15 ionice -c2 -n7`, surfaced as
# escalation esc-3062-3):
#
#     shared         120.21   (2582 passed)
#     escalation     123.29   (898 passed)
#     orchestrator  1366.23   (13398 passed, zero failures)
#     fused-memory   123.87   (8658 passed)
#     tests/scripts  105.00   (lowest of four independent runs, 105-127s)
#                   -------
#                   1838.60s   <- five of eight segments; already > the old 1800
#
# dashboard, sampler and cockpit are absent because the run timed out at
# 1800.66s before dashboard even started, so 1838.60 is a hard measured LOWER
# BOUND, not an estimate. The old 1800s ceiling was provably below it: a healthy
# run could not clear it, so it surfaced no hangs — it manufactured infra_timeout
# on the honest green path, after already passing 25,536 tests with zero
# failures. A structural overrun, not a hang.
#
# Raised to 3600s warm / 5400s cold. All eight segments accounted for — the six
# measured plus the three unmeasured ones estimated rather than silently costed
# at zero:
#
#     measured floor (five segments, above)       1838.60
#     + scripts/tests (task 3384, lowest of local
#                   runs, 1184 passed)                ~113
#     + dashboard  1393 collected @ ~0.137 s/test  ~190
#     + sampler                                     ~60
#     + cockpit     321 collected @ ~0.137 s/test   ~44   (conditional: the
#                   segment is wrapped in `[ -d cockpit ] || exit 0`, so it
#                   costs 0 on a checkout where cockpit is absent — but it IS
#                   present here, so budget for it)
#                                                 -------
#     honest green path                            ~2246
#
# The ~0.137 s/test rate is escalation's 898 serial tests in 123.29s; dashboard
# and cockpit both run serial (no pytest-xdist, per this file's own fanout
# comment). 3600s leaves ~1.6x headroom over that path, covering the load
# variance the two same-day orchestrator measurements demonstrate (1157.62s vs
# 1366.23s, ~18%) plus scripts/tests' own load sensitivity (task 3384 measured
# it between ~113s idle and, combined with tests/scripts/, up to ~505s wall
# under contention — see the task-3384 comment above and project memory for
# the combined-directories figures). Cold gets 5400s because it additionally
# pays the ~180s `uv sync --all-packages` preprovision plus uv sync across 6
# subprojects.
#
# It also un-starves the `orchestrator` module's OWN verify, which at 1366.23s
# was consuming 76% of the old per-command ceiling.
#
# WHERE "tight timeouts surface hangs" LIVES NOW: on the PER-MODULE budgets —
# each subproject's own orchestrator.yaml, plus tests/scripts/orchestrator.yaml's
# 600s — not on starving the whole-fleet fallback chain. The tight-timeout
# rationale still holds and is unchanged in KIND: a genuine hang should still
# surface on the first verify that touches the module, not 8 days later at a
# post-completion full review. But that property cannot hold at the FLEET level,
# because a ceiling a green run cannot clear surfaces nothing but false
# infra_timeouts. It holds per-module, where each suite's real cost is known.
# Guarded by tests/scripts/test_fallback_verify_config.py::
# test_fallback_verify_budget_clears_the_measured_fleet_chain_floor.
#
# BE PRECISE ABOUT WHAT THAT GUARD DOES, because overclaiming it would repeat
# this comment's own original sin. It asserts the measured floor rather than
# pinning a value, so it catches anyone LOWERING this budget back below
# 1838.60s. It does NOT detect suite growth: MEASURED_FLEET_SEGMENT_SECS is a
# frozen literal table, so if the orchestrator segment doubles tomorrow the
# table still reads 1366.23, the floor still reads 1838.60, and the guard stays
# green while the budget is once again provably below the honest green path.
# Detecting that requires RE-MEASUREMENT — the table has no way to measure
# itself. So the numbers above are a dated snapshot (2026-07-31), not a
# self-maintaining invariant: when a verify run's own recorded durations diverge
# from the table, re-measure and update BOTH the table and this derivation. (A
# durations-based growth check would need to read a recent run's recorded
# per-segment times rather than a literal; that is deliberately not built here —
# the point is that nothing currently performs it, so a human must.)
#
# NOTE: this buys headroom, it does not fix the trend. orchestrator's suite
# alone grew to 1366s; if it keeps growing, the answer is scoping verify to the
# task's declared modules — which is what tests/scripts/orchestrator.yaml now
# does for this very fallback path (task 3350) — not raising this number again.
verify_command_timeout_secs: 3600
verify_cold_command_timeout_secs: 5400

# Cold-verify shared-venv pre-provision (task 2997, esc-2913-3). On a COLD verify
# worktree the shared workspace .venv is populated only as a SIDE EFFECT of the
# TEST leg running `uv run pytest` in each member. The full-repo-scope root LINT
# (`uv run ruff check …`) and TYPE (`… npx pyright`) commands, launched ~11ms
# alongside TEST in one asyncio.gather, then race that sync and fail spuriously
# (`Failed to spawn: ruff`; `Import "pytest" could not be resolved`).
# run_verification runs this command ONCE per cold worktree, synchronously,
# BEFORE the test/lint/type gather so the venv is populated first.
#
# `--all-packages` (NOT the naive `--project shared --extra dev`): ruff + the dev
# deps live in each member's `[dependency-groups] dev`, NOT an optional-deps
# `dev` extra (so `--extra dev` ERRORS: "Extra `dev` is not defined"). pyright
# type-checks fused-memory/orchestrator/dashboard and resolves their test imports
# against the shared root .venv, so it needs EVERY member's dev deps present, not
# just shared's. `--all-packages` syncs all workspace members + their default dev
# groups into the single root .venv. Verified against uv.lock (uv 0.11.6): it
# resolves ruff 0.15.9 + pytest 9.0.3 + pytest-asyncio + aiosqlite + pyright —
# the exact set the working shared venv already carries.
verify_cold_preprovision_command: "uv sync --all-packages"

# TEMPORARY manual override (watcher, 2026-07-13) to break the cross-project
# verify-admission-slot contention with reify while task 2501 (per-project
# slots-dir default) lands. Without this, verify_admission_slots_dir defaults to
# the host-global /tmp/df-verify-slots-<uid>, which reify's long cargo verifies
# monopolize — stalling dark_factory's whole verify/merge pipeline. This gives
# dark_factory its own slot dir. REMOVE once 2501 is on main + the orch has
# restarted onto it (2501's code default derives a per-project path itself;
# invariant I3 preserves this explicit override until then).
verify_admission_slots_dir: "/tmp/df-verify-slots-1000-dark_factory"

# Fused memory HTTP server — port 8002
# Port scheme: reify=xxx0, autopilot-video=xxx1, dark-factory=xxx2
fused_memory:
  url: "http://localhost:8002"
  project_id: "dark_factory"
  config_path: "fused-memory/config/config.yaml"
  server_command: []

# Escalation — port 8102 (matches .mcp.json so interactive sessions share the server)
escalation:
  queue_dir: "data/escalations"
  port: 8102

# Per-role turn budgets. Raising the architect budget is a direct response to
# silent max_turns exits on large-scope tasks: the architect now has headroom
# to verify premises and produce a plan without the CLI truncating mid-tool-call.
max_turns:
  architect: 120

# Trailing-24h spend ceiling. Default $200 was a backstop from before the
# multi-account failover landed — with Anthropic's per-account caps as the
# real spend governor, the orch-level dollar guard just trips during normal
# operation. Raised to effectively-disabled. The watcher ceiling
# (watcher_daily_cost_ceiling_usd, default $50) was tripping on the L1
# auto-watcher's normal ~$50/24h Opus burn (esc-__scheduler__-4, 2026-07-14 —
# 28 opus invocations = $50.34), pausing dispatch. Raised to $150 to give
# ~3 days of headroom while keeping an early-warning guard well below the
# orch-wide net.
orch_daily_cost_ceiling_usd: 10000.0
watcher_daily_cost_ceiling_usd: 150.0

# Usage cap / multi-account failover
usage_cap:
  enabled: true
  accounts_file: "${USAGE_ACCOUNTS_FILE:/home/leo/src/dark-factory/config/usage-accounts.yaml}"

# Project root (absolute path)
project_root: "${PROJECT_ROOT:/home/leo/src/dark-factory}"

# OS filesystem sandbox (Landlock) — DF canary flip, γ2.
# Per plans/os-sandbox-worktree-containment-prd.md task γ2 (D6, D7): enable
# the OS-enforced writable-set containment (SandboxConfig,
# orchestrator/src/orchestrator/config.py) for sandboxed roles
# (implementer/debugger/simple_task) on the DF fleet, backend pinned to
# landlock (the proven fleet backend per PRD Background; bwrap is
# effectively dead fleet-wide).
#
# ACTIVATION NOTE: like the U2 restart-on-merge and verify-scope-inversion
# flips above, `sandbox.*` is NOT in the config hot-reload allowlist
# (RELOADABLE_FIELDS, orchestrator/src/orchestrator/config.py) — this edit
# is inert in the running daemon until the next orchestrator restart.
# Activation is the separate γ3 deterministic-deploy capstone task.
sandbox:
  enabled: true
  backend: landlock

# Post-merge staleness hook — U2 restart-on-merge for the orchestrator fleet
# itself. Flips the (previously dormant, enabled=False-by-default) coordinator
# on for dark-factory's own daemon. All six orchestrator-*.service units are
# restarted via scripts/restart-all-orchestrators.sh, which enumerates running
# units, verifies a fresh ActiveEnterTimestampMonotonic per unit, and defers
# SELF_UNIT=orchestrator-dark-factory.service to last so a same-cgroup caller
# doesn't get killed before the other units are restarted.
#
# See orchestrator/src/orchestrator/config.py (orchestrator_restart_* field
# docstrings) and orchestrator/src/orchestrator/service_restart.py for the
# coordinator's debounce / agents-idle / merge-drain-precondition policy.
# Per plans/orchestrator-fleet-staleness-prd.md task γ.
#
# ACTIVATION NOTE: this flip is inert in the running daemon until the next
# orchestrator restart — these knobs are not in the config hot-reload
# allowlist. Activation is a separate deterministic capstone task.
#
# WATCH-PREFIX CONVENTION: every entry below must be a full, existing path
# (directory or file) relative to the repo root — enforced by
# tests/scripts/test_orchestrator_restart_config_drift.py. This is stricter
# than the runtime matcher (service_restart.diff_touches_watched_paths does
# plain boundary-safe string-prefix matching against changed file paths with
# no filesystem check), chosen deliberately so a typo'd prefix fails CI
# instead of silently never matching a changed file at fire time.
orchestrator_restart_on_merge_enabled: true
orchestrator_restart_script: "scripts/restart-all-orchestrators.sh"
orchestrator_restart_watch_prefixes:
  - "orchestrator/src/"
  - "escalation/src/"
  - "orchestrator/pyproject.toml"
  - "orchestrator/uv.lock"
  - "escalation/pyproject.toml"

# Verify-scope inversion — σ capstone (plans/verify-scope-inversion-prd.md).
# Flips the broad merge-role verify gate on and enables merge-train formation
# now that ξ (boundary suite) is green and 2501 (per-project verify-slot
# scoping) has landed the contention headroom this needs on the shared host.
#
# merge_verify_breadth: "full" makes merge-role verify run every REGISTERED
# module's full suite instead of only the touched modules (Resolved decision
# 5 in the PRD) — the λ knob, defaulting to "scoped" in defaults.yaml.
#
# merge_train_former_enabled / merge_train_coalesce_enabled /
# merge_train_max_members: turn on the train former + retroactive
# queue-coalescing pass at N=3 (Resolved decision 6). The train
# former/coalescer is DF code (tasks 1704-1708), production-proven in reify
# since 2026-06-10 (GO-N3 precedent: s(3)=0.962, coupling-failure 0/104) —
# amortizes the now-broader gate's cost across up to 3 members per train,
# same per-tip correctness gate as a single merge.
#
# ACTIVATION NOTE: like the U2 restart-on-merge flip above, these four knobs
# are restart-only — NOT in the config hot-reload allowlist
# (RELOADABLE_FIELDS, orchestrator/src/orchestrator/config.py) — so this edit
# is inert in the running daemon until the next orchestrator restart. Unlike
# most restart-only edits, this one is NOT auto-covered by the U2 coordinator
# either: orchestrator/config.yaml itself is not listed in
# orchestrator_restart_watch_prefixes above (config.yaml:122-127), so a merge
# of this file alone does not auto-fire a fleet restart. Activation is the
# separate τ deterministic-deploy capstone task.
merge_verify_breadth: "full"
merge_train_former_enabled: true
merge_train_coalesce_enabled: true
merge_train_max_members: 3

# Serialize the per-merge module fan-out to 1 (operator decision, 2026-07-19)
# to cut merge-verify CPU oversubscription on the shared 32-core host. With
# breadth="full", the default (4) lets ONE merge verify run up to 4 modules'
# suites concurrently, each `pytest -n auto` = 32 workers -> up to 128 workers
# from a single merge (4x the cores) -> starved xdist workers cross the 60s
# wall-clock timeout, os._exit, and false-red innocent tests (the CPU-contention
# flakiness RCA, memory project_cpu_contention_test_flakiness_rootcause_2026_07_18).
# Setting 1 caps a merge verify to one 32-worker pool at a time; modules run
# sequentially within the merge. Green-tier hot-reloadable (RELOADABLE_FIELDS),
# so this is live-tunable via mcp__escalation__reload_config without a restart.
# Trade-off: a merge's full-breadth verify is slower wall-clock (modules
# serialized), accepted against the oversubscription-flake churn it removes.
merge_verify_max_concurrent_modules: 1

# Config-driven off-hot-path offline lane — dark-factory qdrant-integration
# instance (plans/integration-test-lane-prd.md, task beta). Restores the
# qdrant-client/mem0 version-compat coverage that task 2773 removes from the
# merge-verify hot path: `pytest -m integration` now runs in fused-memory/ on
# the off-hot-path offline lane at each post-merge advance from the current
# main head, instead of on every merge-verify.
#
# offline_lane_legacy_numeric_enabled: false because dark-factory has no
# reify-style scripts/run-offline-deep.sh (PRD D2) — the generic
# offline_lane_commands entry below drives the lane instead of the legacy
# numeric seam.
#
# ACTIVATION NOTE: like the other restart-only flips in this file,
# offline_lane_enabled is the START gate for the offline-deep lane worker and
# is NOT in the config hot-reload allowlist (RELOADABLE_FIELDS,
# orchestrator/src/orchestrator/config.py) — this edit is inert in the
# running daemon until the next orchestrator restart. Activation is the
# separate PRD task gamma. offline_lane_commands and
# offline_lane_legacy_numeric_enabled ARE hot-reloadable.
git:
  offline_lane_enabled: true
  persistent_offline_deep_worktree: true
  offline_lane_legacy_numeric_enabled: false
  offline_lane_commands:
    - name: qdrant-integration
      command: "pytest -m integration"
      cwd: "fused-memory"
      fix_task_priority: "medium"
    # PRD §11 q4 RE-DECIDED (task 3349, 2026-08-01): the ported warm-lane bash
    # bucket moves OFF the verify hot path and onto this lane — the escape
    # plans/warm-lane-infra-repatriation-prd.md documented for exactly this
    # case. Two grounds, both recorded in orchestrator/tests/warm-lane/README.md:
    #   (1) Half the original justification is CONSUMED. q4's first reason was
    #       that leaf γ changes warm-lane-gc.sh's core predicate and needed this
    #       coverage on its verify leg. γ IS task 3075 — it has LANDED, with its
    #       verify green and this coverage in place.
    #   (2) The surviving cost ground inverted. Measured 289.58s for the 12
    #       items at loadavg 128.72 (1-min, 32 cores) on 2026-08-01 — 6.2x the
    #       README's 47s module baseline. A LOAD-QUALIFIED figure, never to be
    #       quoted as an unloaded one. ``xdist_group('warm_lane_bash')`` pins
    #       all 12 items to ONE worker by design, so the cost is fully additive
    #       to the verify critical path and gains nothing from ``-n auto``.
    #
    # COUPLING — the two edits below NEVER move independently:
    #   (a) orchestrator/pyproject.toml addopts  -m 'not warm_lane_bash'
    #   (b) this entry                           -m warm_lane_bash
    # Landing (a) without (b) is silent ZERO coverage — the "appearance of
    # coverage without the fact of it" q4 originally refused, and leaf κ deletes
    # reify's originals on the strength of this suite being green.
    # orchestrator/tests/test_warm_lane_bash_bucket_placement.py asserts the
    # biconditional and is deliberately NOT marked warm_lane_bash, so it keeps
    # running on the hot path and cannot deselect itself.
    #
    # A CLI ``-m`` overrides the pyproject ``-m`` (last wins) — the same
    # mechanism the qdrant-integration entry above already relies on. The
    # confirm re-run adds ``-p no:xdist -o addopts=`` (_serial_pytest_str),
    # which clears addopts but leaves this CLI ``-m`` intact, so the red-path
    # confirmation still selects exactly this bucket.
    #
    # RELOAD ASYMMETRY: offline_lane_commands IS green-tier hot-reloadable
    # (RELOADABLE_FIELDS, orchestrator/src/orchestrator/config.py) — unlike
    # offline_lane_enabled above, this entry takes effect via
    # mcp__escalation__reload_config with NO restart. The paired addopts change
    # lands with the merge and needs no reload at all.
    #
    # fix_task_priority is "high" (vs qdrant's "medium"): leaf κ deletes reify's
    # originals on this suite's green, so a red here must not sit in a
    # low-priority queue.
    - name: warm-lane-bash
      command: "pytest -m warm_lane_bash"
      cwd: "orchestrator"
      fix_task_priority: "high"

# Variable-depth speculative verify placement (task 2359) — ACTIVATE the deep
# probe (operator decision, 2026-07-19). probe_fraction=0.5: half of second-slot
# dispatch rounds target a deeper already-built speculative stack (probe_depths
# default [2,3,5,8]) instead of the adjacent depth-1 stack, producing genuine
# depth≥2 merge_verify records (labelled by task 2340's depth field) so
# scripts/analyze_speculation_depth.py can print the deep P(pass|depth) curve that
# validates/refutes N*≈20. suppress_flake_rate=0.40 lifts the thrash guard above
# the shared host's ~0.33 per-attempt verify fail rate so the probe actually fires
# (the 0.30 default sat at/below the flake floor and self-suppressed).
# NOTE: 0.5 is ~5x the 2359 design-suggested bound (≤0.1); a failed deep probe
# skips the safe depth-1 item, so this trades throughput for curve data. Green-tier
# hot-reloadable (RELOADABLE_FIELDS) — live via mcp__escalation__reload_config, no
# restart; probe_fraction=0.0 reverts byte-identically.
# DEACTIVATED 2026-07-23 (operator decision): the probe CANNOT produce genuine
# depth≥2 records under K=2 — build-ahead is capped at speculation_depth, so
# probe_depths 3/5/8 never pass select_probe_depth's availability guard, and a
# firing d=2 probe is attribution-only (ProbePlacement Phase-1 limitation) with
# an off-by-one label: it relabels an ordinary 2-item adjacent verify as depth=2,
# corrupting analyze_speculation_depth.py's depth calibration. Deep P(pass|d) is
# being measured instead by the offline replay study (reify-replay-study unit).
speculation_probe:
  probe_fraction: 0.0
  suppress_flake_rate: 0.40
