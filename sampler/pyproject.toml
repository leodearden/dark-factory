[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sampler"]

[project]
name = "dark-factory-load-sampler"
version = "0.1.0"
description = "Dark Factory load sampler — writes PSI + verify metrics to SQLite every 5s"
requires-python = ">=3.11,<4"
dependencies = [
    "psutil>=5.9",
    "dark-factory-shared",
]

[tool.uv.sources]
dark-factory-shared = { workspace = true }

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "../shared/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate: nothing in hooks/project-checks, any orchestrator.yaml lint_command,
# or verify runs `ruff format` (CONTRIBUTING.md section 3, task 3441). Retained deliberately —
# ruff defaults to double quotes while this repo writes single, so an ad-hoc or editor-on-save
# run on escalation/src is 317 changed lines with this block vs 1437 without it (~4.5x). Do not
# delete it as "unused config", and do not add a `ruff format --check` gate, without first
# reversing that policy; tests/scripts/test_ruff_format_policy.py guards both directions.
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7.1",
]
