[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sampler"]

[project]
name = "dark-factory-load-sampler"
version = "0.1.0"
description = "Dark Factory load sampler — writes PSI + verify metrics to SQLite every 5s"
requires-python = ">=3.11,<4"
dependencies = [
    "psutil>=5.9",
    "dark-factory-shared",
]

[tool.uv.sources]
dark-factory-shared = { workspace = true }

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "../shared/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default per-test timeout. This entry CLOSES A TOTAL-ABSENCE GAP rather than
# updating a stale value: until task 5442 this config declared neither key, so
# this suite ran uncapped even though pytest-timeout was already a dev
# dependency — the plugin was installed and inert.
# `signal` — but NOT because this suite is serial, which it is not. It declares
# no addopts and so no `-n` of its own, and that used to be given as the reason;
# verify.py::_with_pytest_numprocesses_str falsifies it by appending
# `-n <verify_admission_pytest_n>` ("8") to every pytest leg at the gated roles.
# dark-factory-orchestrator.yaml records the MEASURED render of THIS module's
# command as `cd sampler && uv run pytest ... -n 8 tests/`.
# The choice is the same one, on the same evidence, as every other config here:
# signal measured green under xdist (task 5408). The signal-vs-thread trade is
# not reopened here; it lives once, in fused-memory/pyproject.toml's own
# timeout_method block.
# Value provenance: plans/pytest-per-test-timeout-measurement-2026-09-17.md.
# Rationale for the setting: shared/pyproject.toml. Neither is restated here.
timeout = 540
timeout_method = "signal"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7.1",
]
