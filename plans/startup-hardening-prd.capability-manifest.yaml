        binding: "capability→producer — new orchestrator/src/orchestrator/startup_steps.py"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "class StartupStep"
          paths: ["orchestrator/src/orchestrator/"]
          expect: present
      - name: "startup-step-failed-event-type"
        binding: "capability→producer — additive EventType member"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "startup_step_failed"
          paths: ["orchestrator/src/orchestrator/event_store.py"]
          expect: present
      - name: "ad-hoc-startup-try-except-removed"
        binding: "rejection-mechanism — 1c0a's ad-hoc 'Failed to recover pending merges' block is gone once the runner owns the policy"
        verdict: PASS
        delivered_check:
          kind: grep
          pattern: "Failed to recover pending merges"
          paths: ["orchestrator/src/orchestrator/harness.py"]
          expect: absent
