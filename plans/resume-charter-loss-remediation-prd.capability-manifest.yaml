# capability had been delivered.  This revision re-anchors on PRODUCTION
# symbols wherever the PRD's contracts fix them: 14 of 17 mechanical checks now
# point at production code or the production entry-path document, and only 3
# remain test-anchored (α's fold preservation, δ's guard retention, η's
# writable-set) because in those three the production shape is genuinely left
# open by the PRD — C2's storage shape, a RETAINED negative behaviour that
# emits no new symbol, and open question #5's schema-default-vs-relocation
# split which touches different files.
#
# task_id values are those stamped by commit_planning on 2026-08-11
# (commit 728aa04d33) and are PRESERVED verbatim here — this revision changes
# only anchors, never identity.  Producer metadata.delivered_checks were
# re-synchronised to this file by hand in the same session.
#
# RED-TODAY DISCIPLINE.  Every mechanical check below was executed as
# `git grep -E -c '<pattern>' -- <paths>` against main and is RED today: an
# `expect: present` check MISSES (0 hits); an `expect: absent` check HITS.
