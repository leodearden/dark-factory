#
# ε, θ and ι carry no mechanical check — out-of-tree fleet state, live-DB
# runtime evidence, and a decision recorded on OTHER tasks respectively.
# Manual checks are sidecar-only and excluded from the dispatch gate, so those
# three producers correctly carry no metadata.delivered_checks.
