      paths:
      - orchestrator/src/orchestrator/config.py
      expect: present
  - name: three-lockstep-sites-move-together
    binding: INV-5 — config.py:1026, scripts/gc_agent_transcripts.py:107 DEFAULT_MAX_TASK_DIRS,
      and the pinning assert at scripts/tests/test_gc_agent_transcripts.py:410; already
      test-pinned (house pattern)
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: DEFAULT_MAX_TASK_DIRS *= *50_?000
      paths:
      - scripts/gc_agent_transcripts.py
      expect: present
  - name: count-pruning-is-loud-when-it-binds
    binding: INV-4 — grep:scripts/gc_agent_transcripts.py:183 is_count has no distinct
      signal today, so a bound cap silently truncates the 90-day window
    verdict: PASS
    delivered_check:
      kind: manual
      reason: loudness is a runtime-emission property asserted by δ's tests, not a
        repo grep
  - name: derived-bound-test-is-non-vacuous
    binding: INV-1 — a cap ≥ 90 × rate × safety assert with a HARDCODED rate is arithmetic
