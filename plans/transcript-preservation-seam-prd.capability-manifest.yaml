      must be derived from real archive dir mtimes, skipping when the archive is absent
    verdict: PASS
    delivered_check:
      kind: manual
      reason: non-vacuity is a property of how the test sources its input; a grep
        cannot distinguish a measured rate from a literal
  - name: peak-rate-premise
    binding: 'floor: 50,000 / (90 × 71 peak/day) ≈ 7.8× headroom — MEASURED 2026-08-04:
      600 task dirs / 17 days, mean 35/day, recent-7d 46.6/day (84% of the 5,000 cap),
      peak 71/day → 6,390 @ 90d, binding at ~day 70'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: the rate is measured off the live archive tree, which is gitignored
        runtime state
