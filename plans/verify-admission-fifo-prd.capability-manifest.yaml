prd: plans/verify-admission-fifo-prd.md
schema_version: 1
tasks:
- label: α
  task_id: 5628
  title: Ordered task-verify admission gate with recorded wait (behaviour-preserving
    default)
  capabilities:
  - name: gate-is-the-only-new-acquirer-path
    binding: capability→producer (wired) — orchestrator/src/orchestrator/verify.py::_admission_slot
      is the sole production caller of shared.verify_admission.acquire_task_slot (git
      grep 2026-09-18); α wraps it
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 'class [A-Za-z_]*AdmissionGate'
      paths:
      - orchestrator/src/orchestrator/
      expect: present
  - name: plan-event-type-registered
    binding: capability→producer (wired) — orchestrator/src/orchestrator/event_store.py::EventType
      is a StrEnum; α adds the member and run_scoped_verification (which already takes
      event_store) emits it
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: verify_admission_plan
      paths:
      - orchestrator/src/orchestrator/event_store.py
      expect: present
  - name: order-knob-hot-reloadable
    binding: capability→producer (wired) — orchestrator/src/orchestrator/config.py::RELOADABLE_FIELDS
      already lists the seven verify_admission_* keys; α adds three
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: verify_admission_order
      paths:
      - orchestrator/src/orchestrator/config.py
      expect: present
  - name: workflow-passes-event-store-to-task-verify
    binding: capability→producer — run_scoped_verification(event_store=...) parameter
      exists on main; the two workflow.py task-verify call sites do not pass it today;
      α wires both
    verdict: PASS
    delivered_check:
      kind: manual
      reason: proved by boundary scenario 11 (end-to-end row in a real event store),
        not by a grep
  - name: ordering-and-cancellation-semantics
    binding: built+bound by α — boundary scenarios 1-10,12 run against the real flock
      in a tmp slots_dir
    verdict: PASS
    delivered_check:
      kind: manual
      reason: behavioural; judged by α's own tests
