tasks:
- label: α
  task_id: 5322
  title: shared.uuid_prefix detector + UuidPrefixGuardMiddleware (C1, C3)
  note: 'Intermediate; unlocks γ, δ, ε. PRD §4 C3 names `MarkupStormCounter`, which
    does not exist — the real symbol is shared/src/shared/storm_counter.py::StormCounter,
    whose threshold/window are per-call .record() arguments. Erratum 1 in the .md
    manifest. C3''s project_for cannot simply read project_id off the arguments: update_task
    and submit_task declare project_root. It must invert run_server''s known_projects
    {project_id: project_root} registry. Erratum 7.'
  capabilities:
  - name: prefix-detector-module-exists
    binding: capability→producer (this leaf) — C1 pure detector + span-exact substitute
      in shared/
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: def find_prefix_tokens\(
      paths:
      - shared/src/shared/
      expect: present
  - name: prefix-guard-middleware-exists
    binding: capability→producer (this leaf) — C3 declared outcome × tool-class matrix
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: class UuidPrefixGuardMiddleware
      paths:
      - shared/src/shared/
      expect: present
  - name: storm-counter-reused-not-forked
    binding: capability→producer (wired) — shared/src/shared/storm_counter.py::StormCounter
      reused (INV-5)
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: class (Uuid)?PrefixStormCounter
      paths:
      - shared/src/shared/
      expect: absent
  - name: detector-invariants-pinned
    binding: field-population — ≥200-row real-context fixture corpus, replays byte-identically
      twice
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: find_prefix_tokens
      paths:
      - shared/tests/
      expect: present
  - name: project-for-resolves-project-root-tools
    binding: capability→producer (this leaf) — project_for must resolve a project
      for update_task/submit_task, which declare project_root rather than project_id;
      server/markup_guard.py::_resolve_project_root is the precedent translator.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: project_root
      paths:
      - shared/src/shared/uuid_prefix_guard.py
      expect: present
  - name: detector-loop-occupancy-bounded
    binding: manual — find_prefix_tokens is sync on the loop thread; bound is the
      MCP argument-map size (INV-8)
    verdict: OPEN
    delivered_check:
      kind: manual
      reason: a stated wall-time bound is a review judgement, not a grep
