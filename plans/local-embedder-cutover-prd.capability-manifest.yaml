prd: plans/local-embedder-cutover-prd.md
schema_version: 1
tasks:
- label: α1
  task_id: 6797
  title: Define the granite embedder compose service and the fused-memory hold drop-in
  note: >-
    docker-compose.yml already carries three services (falkordb, qdrant, fused-mcp), so
    the embedder is a new fourth service, not "a third". α1 adds two NEW `-`-prefixed
    ExecStartPre lines (compose up for the embedder; a wait on 127.0.0.1:8420 through the
    host-local /home/leo/bin/wait-for-port.py) and leaves the two existing lines unchanged,
    so an embedder failure never blocks fused-memory's start and α2 only adds lines. Q2
    (restart policy, bounded never-blocking wait) is decided here.
  capabilities:
  - name: embedder-compose-service-loopback-8420
    binding: >-
      capability→producer — α1 adds the service to fused-memory/docker/docker-compose.yml
      bound to 127.0.0.1:8420 (PRD §4 item 1). Substrate verified: the compose file
      exists and nothing in fused-memory/, scripts/ or the docs names 127.0.0.1:8420 at main.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 127\.0\.0\.1:8420
      paths:
      - fused-memory/docker/docker-compose.yml
      expect: present
  - name: embedder-image-digest-pin
    binding: >-
      capability→producer — α1 pins vllm/vllm-openai v0.26.0 by digest; substrate:
      `docker image ls --digests` shows sha256:ffb2d59b1c05… locally (drift D14).
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: sha256:ffb2d59b1c059a5bd8d781320c9f5189de8293693b7d95da54befddaa54abf52
      paths:
      - fused-memory/docker/docker-compose.yml
      expect: present
  - name: embedder-gpu-share-0062
    binding: >-
      substrate — scripts/local-model-serving/lms_serve.py::_memory_share_for yields 0.062
      for granite (executed, drift D14); α1 writes that bound into the service command.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 0\.062
      paths:
      - fused-memory/docker/docker-compose.yml
      expect: present
  - name: service-template-bounded-embedder-wait
    binding: >-
      capability→producer — α1 extends scripts/fused-memory.service.template's ExecStartPre
      (today `up -d falkordb qdrant` plus a wait on 6379/6333) with the embedder and a
      bounded, never-blocking wait on 8420.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: 127\.0\.0\.1:8420
      paths:
      - scripts/fused-memory.service.template
      expect: present
  - name: hold-drop-in-condition
    binding: >-
      capability→producer — α1 adds a new hold drop-in template under scripts/ carrying
      ConditionPathExists=!<cutover lock>; no unit template in scripts/ uses
      ConditionPathExists at main.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ConditionPathExists=!
      paths:
      - scripts/
      expect: present
  - name: compose-config-validates
    binding: >-
      substrate — Docker Compose v5.1.2 and the NVIDIA runtime are present (PRD §8);
      `docker compose -f … config` is run by α1's own verify.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a docker CLI validation, not expressible as a grep over the tree
