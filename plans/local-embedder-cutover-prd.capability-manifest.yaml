      excluded or unrooted. Seeds: evalmem_*, _probe*, _test_*, task_curator_test_*,
      task_dedup_*, test, mem0migrations. task_curator_p / _proj / _project are D13
      unrooted (backed up, dropped at P3). β2 proves it with a read-only live C0 run before
      merge; ζ's live census and P0 dry-run are the arbiter.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a definition the leaf makes; B8a asserts the classification on fixtures and α2 observes it live
  - name: qdrant-and-falkor-width-guard
