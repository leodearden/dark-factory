    policy_of(config) callable; δ2 adds the config keys and the real reader. Rows
    9 and 12 assert only the on_unavailable hook call here (tracker half: δ1/ι); row
    13 asserts the dispatcher-side cancel ordering (workflow SOFT_CANCELLED half:
    ι).'
