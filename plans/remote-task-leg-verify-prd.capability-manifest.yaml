    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^def build_remote_runners\(
      paths:
      - orchestrator/src/orchestrator/
      expect: present
  - name: policy-without-config-keys
    binding: DAG-direction — AS WRITTEN the dispatcher read config.verify_task_* keys
      produced by δ2 (downstream) = producer-downstream FAIL; RESOLVED at decompose
      by a γ-owned TaskVerifyPolicy value injected via policy_of(config), with δ2
