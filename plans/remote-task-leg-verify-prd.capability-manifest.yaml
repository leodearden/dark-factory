    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^class TaskVerifySpec[(:]
      paths:
      - orchestrator/src/orchestrator/
      expect: present
  - name: run-task-verify-transport
    binding: capability→producer — α adds RemoteRunner.run_task_verify over a factored
      RemoteRunner._dispatch in verify_runner.py (PRD §5.2). Substrate verified on
      main — RemoteRunner.run_merge_verify (push → ssh → result_from_json → archive
      → delete-ref, single _inflight_request_id).
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: def run_task_verify\(
      paths:
      - orchestrator/src/orchestrator/
      expect: present
  - name: public-no-verdict-predicate
    binding: capability→producer — α adds verify.py::is_no_verdict_summary over the
      existing private verify.py::_NO_VERDICT_SUMMARY_MARKERS (present on main), so
      verify_runner.py reaches no private name.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: def is_no_verdict_summary\(
      paths:
      - orchestrator/src/orchestrator/
      expect: present
  - name: no-verdict-raises-runner-unavailable-both-callers
    binding: rejection-mechanism — built by α at RemoteRunner._dispatch; boundary
      row 4 observes it fire for run_merge_verify AND run_task_verify on a 'killed
      by signal 9' summary.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: behaviour asserted by boundary row 4's executed fakes, not greppable
  - name: wire-shape-and-exclusive-use-rejections
    binding: rejection-mechanism — built by α; row 1 observes from_dict reject an
      extra key (TypeError), row 19 observes a concurrent _dispatch raise before pushing.
    verdict: PASS
