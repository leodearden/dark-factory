# Machine-readable twin of scheduler-pause-halt-retirement-prd.capability-manifest.md
# Path is strictly PRD-derived (decompose-mode.md Step 2.5); do NOT rename to match the .md.
# Schema: shared/src/shared/capability_manifest.py (CapabilityManifestDoc).
#
# task_id values were stamped by commit_planning on 2026-08-24 (task 2578 machinery).
# That stamp REWRITES the file through a YAML dumper and therefore STRIPS every comment;
# this header was restored by hand afterwards. If you re-run commit_planning against this
# batch, expect to restore it again.
#
# Note label η is task 3876, which pre-existed this batch: it was already filed as a
# standalone task and was AMENDED into the batch rather than re-filed as a duplicate,
# so its id is out of sequence with the 4686-4694 block.
#
# Every `expect: present` pattern below was verified ABSENT on main 4919b42b65, and every
# `expect: absent` pattern verified PRESENT, so each check discriminates rather than
# passing vacuously. Two traps found while doing that and worked around here:
#   - a bare `watcher_guard` present-check is satisfied TODAY by the pre-existing
#     `_check_watcher_guard` method (a neighbouring name), so alpha's check keys on the
#     enum-member form `WATCHER_GUARD\s*=` instead;
#   - the ewa_trip absent-check is scoped to harness.py, because config.py carries the
#     same literal in prose that beta rewrites separately.
#
# Two legitimate kinds of mechanical check appear below, and they read differently:
#   (1) DELIVERY checks, whose expected state differs from today's -- these flip when the
#       task lands (e.g. alpha's `class PauseClass` present, beta's ewa_trip call absent);
#   (2) RETENTION tripwires, already true today and expected to STAY true -- these catch a
#       deletion-heavy task over-deleting (beta must keep 4559's `ewa_value` forensics;
#       delta must not strand `cost_totals_in_window` or `scheduler_resumed`).
# Checks that would be neither -- passing today and proving nothing about the task's own
# deliverable -- were demoted to `manual` rather than left in as gate cost with no signal.
