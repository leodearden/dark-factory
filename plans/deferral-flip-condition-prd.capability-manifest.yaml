prd: plans/deferral-flip-condition-prd.md
schema_version: 1
tasks:
- label: α
  task_id: 6524
  title: Deferral record and process identity (shared)
  note: 'The manifest seat found needs-human-expiry-overrun-threshold FAIL (producer-downstream):
    the sweep interval had no owner upstream of α. Resolved at decompose (PRD §12
    item 3): α owns DEFAULT_SWEEP_INTERVAL_SECS and LAPSE_OVERDUE_AFTER_SECS, and
    γ''s config default reads the former.'
  capabilities:
  - name: deferral-kind-vocabulary
    binding: capability→producer — α introduces `DeferralKind` (StrEnum, five members)
      in shared/src/shared/task_deferral.py. Class name and module path are fixed
      by PRD §5.1; no task_deferral module exists on main. Every consumer (gate, sweep,
      dashboard, census) imports it and none restates a kind list.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^class[[:space:]]+DeferralKind[[:space:]]*[(:]
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
  - name: caller-kinds-subset
    binding: capability→producer — α introduces `CALLER_KINDS`, the frozenset of kinds
      a caller may write (carried_by, until_condition, held_by_session). The gate's
      `server_only_kind` refusal and the migration's `legacy_unknown` exception both
      read it. Name fixed by PRD §5.1.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^CALLER_KINDS[[:space:]]*[:=]
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
  - name: deferral-submodel-registered
    binding: capability→producer — α registers the stored record under metadata key
      `deferral` with register_metadata_submodel(…, cardinality='dict'), following
      shared/src/shared/deploy_state.py and shared/src/shared/capability_manifest.py.
      The registry API is shared/src/shared/task_metadata.py::register_metadata_submodel.
      The pattern accepts both the one-line call and the wrapped call whose key sits
      on the next line.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: register_metadata_submodel\([[:space:]]*(['"]deferral['"]|$)
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
  - name: process-identity-type
    binding: capability→producer — α introduces the frozen `ProcessIdentity` (pid,
      start_ticks, boot_id, host) in shared/src/shared/process_identity.py; β stores
      it as `holder` and γ/δ read liveness from it. Module path and class name are
      fixed by PRD §5.2.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^class[[:space:]]+ProcessIdentity[[:space:]]*[(:]
      paths:
      - shared/src/shared/process_identity.py
      expect: present
  - name: liveness-predicate
    binding: capability→producer — α introduces `liveness(identity)` in shared/src/shared/process_identity.py,
      the one liveness test everywhere (ALIVE / DEAD / OTHER_HOST). γ's sweep and
      δ's dashboard both call it. Signature fixed by PRD §5.2.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^def[[:space:]]+liveness[[:space:]]*\(
      paths:
      - shared/src/shared/process_identity.py
      expect: present
  - name: lapse-cause-predicate
    binding: capability→producer — α introduces the pure `lapse_cause(record, now,
      dead_since)` in shared/src/shared/task_deferral.py; γ's `decide` is its only
      production caller. Signature fixed by PRD §5.1 and decision 6.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^def[[:space:]]+lapse_cause[[:space:]]*\(
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
  - name: needs-human-predicate
    binding: capability→producer — α introduces the pure `needs_human(record, now,
      carrier_status, liveness)` in shared/src/shared/task_deferral.py, the single
      definition (INV-5) of what a human must act on. δ's header count and ε's census
      both call it. Signature fixed by PRD §5.1 and decision 10.
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^def[[:space:]]+needs_human[[:space:]]*\(
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
  - name: process-identity-capture-and-command-name
    binding: capability→producer — α introduces `capture(pid)` and `command_name(pid)`
      in shared/src/shared/process_identity.py (PRD §5.2). β's `holder_not_live` and
      `holder_not_session` refusals consume them. Covered by boundary row 12 with
      real spawned processes.
    verdict: PASS
    delivered_check:
      kind: manual
      reason: two names that must both exist cannot be ANDed in one grep (alternation
        is OR); the sibling process-identity-type and liveness-predicate checks prove
        the module landed, and shared/tests/test_process_identity.py drives both functions
        against real processes
  - name: registration-load-path
    binding: capability→producer — registration is a side effect of importing the
      registering module (shared/src/shared/deploy_state.py precedent), and shared/src/shared/task_metadata.py::parse_metadata
      reports unknown_key for a key not registered in the calling process. So α makes
      shared/src/shared/task_metadata.py load the deferral registration, as milestone
      and recurrence register inside it (PRD §5.1, amended at decompose), and tests
      is_known_metadata_key('deferral') after importing only shared.task_metadata.
      parse_metadata splats a registered slice into the model, and a pydantic RootModel
      accepts that (verified on pydantic 2.12.5 at decompose).
    verdict: PASS
    delivered_check:
      kind: manual
      reason: the load mechanism is the implementer's choice inside task_metadata.py;
        α's own test proves it
  - name: process-identity-unreadable-is-not-dead
    binding: 'capability→producer — α delivers ProcessIdentityUnreadable (PRD §5.2,
      decision 6): DEAD needs ENOENT plus a positive self-check, and any other /proc
      read failure raises. β maps it to holder_unverifiable, γ to Hold surfaced liveness_unknown.
      Boundary row 26.'
    verdict: PASS
    delivered_check:
      kind: manual
      reason: a behavioural property proved by α's row-26 test, not a symbol a dependent
        greps for
  - name: needs-human-expiry-overrun-threshold
    binding: capability→producer — resolved at decompose (PRD §12 item 3). α owns
      DEFAULT_SWEEP_INTERVAL_SECS = 60 and LAPSE_OVERDUE_AFTER_SECS = 2 * DEFAULT_SWEEP_INTERVAL_SECS
      in shared/src/shared/task_deferral.py (PRD §5.1, amended). needs_human and ε's
      census both read the latter, and γ's deferral_sweep_interval_secs default reads
      the former. The constant's name is fixed by the amended §5.1. Formerly FAIL
      (producer-downstream).
    verdict: PASS
    delivered_check:
      kind: grep
      pattern: ^LAPSE_OVERDUE_AFTER_SECS[[:space:]]*[:=]
      paths:
      - shared/src/shared/task_deferral.py
      expect: present
