# it holds here, scoped to a suite whose real cost is known.
#
# verify_command_timeout_secs is a PER-COMMAND budget
# (skills/orchestrate/references/project-setup.md:150), so this bounds the TEST
# leg on its own — not the sum of test+lint+type.
#
# verify_cold_command_timeout_secs is deliberately left UNSET here: this suite
# has no build step whose cold cost would justify a separate cold budget. An
# unset module cold knob falls through to
# config.verify_cold_command_timeout_secs (5400) — per the
# verify._resolve_verify_timeout cascade, cited by SYMBOL, not file:line, since
# a prior numeric pin here had already rotted onto unrelated code within a week
# of being written — NOT to the 1000 below, which is the warm budget only. Under
# a merge-role cold verify (this file's commands run VERBATIM under
# merge_verify_breadth: "full", noted above), the cascade instead consults
# config.merge_verify_cold_command_timeout_secs (7200) FIRST: that value ships
# from the package-bundled orchestrator/src/orchestrator/defaults.yaml, not
# dark-factory-orchestrator.yaml, so it stays invisible to a reader checking
# only the root config — the same defaults.yaml-shadows-root blind spot
# test_tests_scripts_module_config.py::
# test_tests_scripts_is_a_registered_module_config already records for
# lock_depth.
verify_command_timeout_secs: 1000
