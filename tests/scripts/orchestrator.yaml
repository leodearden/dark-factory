# SIZING (task 4320). Size against 397.47s — the largest figure across every
# VERBATIM run above, measured on the command this file declares. 1000s is
# 2.52x it, which is this family's own convention for the multiple (this module
# sat at 600/233.50 = 2.57x until today; scripts/ sits at 2400/930.59 = 2.58x),
