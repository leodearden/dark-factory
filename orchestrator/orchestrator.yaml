# Orchestrator orchestrator configuration
# Scopes verification to orchestrator's own venv.

# Verification commands
test_command: "uv run --directory orchestrator pytest tests/ --tb=short -q --timeout=300"
# bare-MagicMock config gate (also runs in merge-queue verify; see hooks/project-checks)
lint_command: "uv run --directory orchestrator ruff check src/ tests/ && python3 fused-memory/scripts/check_bare_magicmock_config.py orchestrator/tests"
type_check_command: "uv run --directory orchestrator pyright src/ tests/"

# Per-module verify budget — RULED BY LEO, esc-4211-6 (2026-09-07 option B,
# unstuck 2026-09-11 option C), recorded on task 3353 and split out as task
# 5422 because 3353 could not dispatch.
#
# INTERIM, AND NOT YET D-DERIVED (Leo's ruling D16', 2026-09-08). 7200 is an
# operator estimate, not a measured distribution — task 3353's own scope D (a
# distribution measured under load: p50/p90/max, with PSI and runqueue
# recorded alongside) is what refines it later. No later reader should
# mistake this for a measured budget.
#
# DELIBERATELY NOT NARROWER than the repo-root whole-fleet ceiling — the
# opposite of every other module's per-module budget, which narrows below
# it. Green orchestrator runs have reached ~5288s, past the 3600s fleet
# ceiling in force when this was ruled, so a budget below that ceiling would
# make the false-timeout failure MORE common, not less.
#
# EQUAL TO THAT CEILING TODAY RATHER THAN ABOVE IT, and that is the
# OPERATOR's doing, not this module's: commit 36c4c71eb4 (Leo, 2026-09-12)
# raised the fleet ceiling 3600 -> 7200 as a stopgap, recording in
# dark-factory-orchestrator.yaml that "7200 is the figure already ruled as
# task 3353 scope B" — this figure. That same note states the revert
# condition, "when ... the module declares its own budget, put these back to
# 3600/5400" — i.e. this declaration — so the two are expected to separate
# again. THE DECLARATION IS NOT REDUNDANT WHILE THEY COINCIDE: the fleet
# ceiling is operator-tunable and this figure is RULED, so the module keeps
# 7200 through that revert instead of falling back to 3600 with it. The
# guard below therefore asserts at-or-above rather than strictly-above.
#
# The documented, single-entry exception this overrides — for both the
# "at least ~2x worst measured" and the "strictly below the fleet ceiling"
# checks — lives in tests/scripts/test_module_verify_budgets.py::
# RULED_INTERIM_BUDGET_EXCEPTIONS.
#
# BASIS FOR 7200: ~1.6x headroom over the ~4400s loaded extrapolation from
# task 4176's contended run.
#
# THE COLD LANE IS NOW CLOSED HERE — see verify_cold_command_timeout_secs at
# the bottom of this block. It was deliberately left open until scope D', and
# this records why it is closed now and on what basis.
#
# WHY IT COULD NOT STAY OPEN. Per verify._resolve_verify_timeout's cascade an
# unset module cold knob does NOT inherit the warm budget: a COLD verify falls
# through to the repo-root verify_cold_command_timeout_secs, and pays
# verify_cold_preprovision_command (`uv sync --all-packages && npm ci ...`) and
# unwarmed caches ON TOP of the warm cost 7200 sizes. Whether that fall-through
# was adequate was an operator-tunable question whose answer had already
# changed once: at the 5400s cold ceiling it was NOT — 5400 is BELOW the 7200
# declared here and only ~2% above the then-recorded 5288s worst green WARM
# run, on a strictly costlier path, so the false-infra_timeout mode esc-4211-6
# documents was LIVE ON THE COLD LANE. Commit 36c4c71eb4 raised cold
# 5400 -> 10800, which clears both, but that commit states its own revert
# condition ("put these back to 3600/5400") — and a fall-through does not
# survive it while a module declaration does. That is the whole argument for
# declaring: the same argument the warm figure already carries, applied to the
# lane the warm figure explicitly does not cover.
#
# COUNT THE RETRIES — the wall clock a genuine hang costs is a MULTIPLE of
# 7200, not 7200. config.verify_timeout_retries defaults to 2
# (orchestrator/src/orchestrator/defaults.yaml; dark-factory-orchestrator.yaml
# does not override it) and verify.py's attempt loop re-runs a PURE TIMEOUT
# failure — it breaks only on `attempt.passed or not
# attempt.pure_timeout_failure or retries >= max_retries`. So on the TASK path
# a real hang here now burns up to 3 x 7200s = ~6 hours before it surfaces,
# against ~3 hours at the old 3600s ceiling. That is the price of removing the
# false timeouts, written down because an operator would act on it; the
# MERGE-verify and background-sweep paths pass max_retries=0, so on those the
# bound is a single 7200s. Full statement of this mechanism lives ONCE, in
# shared/orchestrator.yaml paragraph (4a).
#
# GATED BY tests/scripts/test_module_verify_budgets.py::
# test_module_carries_its_own_measured_verify_budget[orchestrator].
verify_command_timeout_secs: 7200

# Per-module COLD budget — ruled by D17 (2026-09-14, task 3353 scope D').
#
# INTERIM, AND DELIBERATELY NOT CENSUS-DERIVED — labelled exactly as 7200 was
# labelled under D16', and for a reason that is measured rather than assumed. A
# summary.json carries NO is-cold flag, and the only available inference
# ("attempt-1 in a worktree with no prior verify dir is cold") cannot tell a
# cold first verify from a warm re-verify of a RESET worktree: the
# .task/verify_warmed marker is not part of the record and does not survive
# into the archive. scripts/verify_budget_census.py reports that as an explicit
# `cold_separable: false` finding with the count of records a guess would have
# claimed, rather than making the guess. So there is no cold DISTRIBUTION to
# derive from, and D17 rules the fallback for exactly this case: label the cold
# value INTERIM with its basis.
#
# BASIS: the warm derivation (7200, itself now census-derived — see the block
# above) PLUS the cold preprovision cost this lane additionally pays. 10800
# allots 3600s to that increment, which is the fleet's own current allowance
# for it (the repo-root verify_cold_command_timeout_secs, raised to 10800 by
# commit 36c4c71eb4). This figure is therefore NOT a new measurement and must
# not be read as one — it is the ruled, revert-surviving restatement of the
# fleet's present cold allowance for this module.
#
# NOT REDUNDANT WHILE IT EQUALS THE ROOT CEILING, for the same reason the warm
# figure is not: the ceiling is operator-tunable and this figure is RULED, so
# the module keeps 10800 through commit 36c4c71eb4's revert condition instead
# of falling back to 5400 with it — the state in which the cold false-timeout
# hazard was LIVE. The guard therefore asserts at-or-above, not
# strictly-above.
#
# REFINE IT by separating cold runs in the census, which needs an is-cold fact
# IN the record — not by re-inferring it from attempt numbering.
#
# GATED BY the same guard, assertion (f)'s
# RULED_COLD_BUDGET_DECLARATIONS branch, which additionally pins that a cold
# budget may never sit BELOW the warm one (a cold verify pays strictly more)
# and that the RESOLVER actually returns this value rather than the cascade
# shadowing it.
verify_cold_command_timeout_secs: 10800
