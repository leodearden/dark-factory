# Core orchestrator defaults — shipped as package data.
# Per-project config files override individual keys via deep merge.

# Concurrency
max_concurrent_tasks: 24
max_per_module: 1
lock_depth: 4
module_overrides: {}

# Iteration limits
max_execute_iterations: 10
max_verify_attempts: 5
max_review_cycles: 2
reviewer_stagger_secs: 2.0
max_reviewer_retries: 4
max_amendment_rounds: 1

# Merge conflict reduction
max_advance_attempts: 3
max_pre_merge_retries: 2
max_merge_retries: 3
inter_iteration_rebase: true
# Rebase onto main before each verify retry (Fix 3 — closes the verify-only
# rebase gap so a fully-implemented task can pick up sibling fixes on main
# without re-running execute).
rebase_before_verify: true

# Fix 2 — thrash threshold for repeated infra-issue resumes on the same
# root cause.  Counter resets to 1 when the iteration log grows; at
# threshold the orchestrator escalates to L1 instead of resuming the
# implementer.  3 matches the empirical reify task-2289 thrash window.
max_consecutive_infra_resumes: 3

# Fix 3 — merge-phase thrash threshold. Counter increments when the merge
# queue returns the same blocked outcome (signature-keyed) on consecutive
# attempts; resets to 1 on a different verdict. At threshold the
# orchestrator escalates to L1 instead of resubmitting.
max_consecutive_merge_thrash: 2

# Verify-loop signature-repetition cap.  After N consecutive verify failures
# with the same (category, normalised cause_hint) tuple the loop escalates to
# L1 instead of retrying.  Normalisation strips file:line tails, ANSI codes,
# collapses whitespace, and lowercases — so shifting line numbers don't defeat
# the equality check.  Default 3 mirrors max_consecutive_infra_resumes.
max_failure_signature_repeat: 3

# Per-task retry cap — max WorkflowOutcome.REQUEUED iterations before L1
# escalation.  Backstop against tight steward→REQUEUED loops (e.g. architect
# returns empty output every time, steward classes it as transient).
# Process-local; orchestrator restart resets it.
requeue_cap: 3

# Verification timeouts
verify_command_timeout_secs: 1800
# Cold-build timeout: used for the *first* verify in a freshly created worktree
# (before the .task/verify_warmed marker exists — i.e., before cargo/build cache
# is populated).  After the first non-timeout run, subsequent verifies use
# verify_command_timeout_secs.  Set to null to disable the cold window and always
# use verify_command_timeout_secs.  Default = 3× warm (90 min) to accommodate
# cold OCCT + Tauri + full workspace builds seen in the reify escalation cluster.
verify_cold_command_timeout_secs: 5400
# Per-command timeout for cold merge-verify runs (is_merge_verify=True, is_cold=True).
# Wins over verify_cold_command_timeout_secs in _resolve_verify_timeout, letting ops
# raise the merge-path cold budget without lengthening task-phase cold verifies.
# 7200 s = 4× warm (1800) and one step above the 90-min/5400 s general cold, giving
# headroom for a cold full-workspace compile + frontend install (observed >30 min).
# Task 1602's fail-closed post-merge type-check gate makes a timeout a queue stall.
merge_verify_cold_command_timeout_secs: 7200
verify_timeout_retries: 2

# Verification execution mode + environment injection
concurrent_verify: true
verify_env: {}
# Task-phase verify rewrites cargo --workspace → cargo -p <crate> when
# all task files live in one (or a few) workspace crates.
scope_cargo: true

# Steward lifecycle
steward_lifetime_budget: 12.0
steward_max_attempts: 1
steward_completion_timeout: 900.0
steward_max_timeouts_per_escalation: 3

# Pre-triage threshold for review suggestions (count)
suggestion_triage_threshold: 10

# Wall-clock backstop for any single agent invocation (seconds).
# Legacy scalar — per-role timeouts below take precedence.
invocation_timeout: 7200.0

# Per-role wall-clock timeout (seconds)
timeouts:
  architect: 2400
  implementer: 1200
  debugger: 1200
  reviewer: 1200
  merger: 600
  steward: 1800
  triage: 300
  module_tagger: 300
  deep_reviewer: 2400
  judge: 300

# Models per role
models:
  architect: "opus"
  implementer: "sonnet"
  debugger: "sonnet"
  reviewer: "opus"
  merger: "opus"
  steward: "opus"
  triage: "sonnet"
  module_tagger: "sonnet"
  deep_reviewer: "opus"
  judge: "sonnet"

# Budget per invocation (USD)
budgets:
  architect: 12.0
  implementer: 10.0
  debugger: 5.0
  reviewer: 5.0
  merger: 5.0
  steward: 5.0
  triage: 2.0
  module_tagger: 2.0
  deep_reviewer: 15.0
  judge: 0.50

# Turn limits per invocation
max_turns:
  architect: 100
  implementer: 80
  debugger: 50
  reviewer: 30
  merger: 50
  steward: 100
  triage: 25
  module_tagger: 30
  deep_reviewer: 100
  judge: 15

# Reasoning effort per role
effort:
  architect: "max"
  implementer: "max"
  debugger: "max"
  reviewer: "high"
  merger: "max"
  steward: "high"
  triage: "medium"
  module_tagger: "medium"
  deep_reviewer: "max"
  judge: "medium"

# Backend CLI per role (claude, codex, gemini)
backends:
  architect: "claude"
  implementer: "claude"
  debugger: "claude"
  reviewer: "claude"
  merger: "claude"
  steward: "claude"
  triage: "claude"
  module_tagger: "claude"
  deep_reviewer: "claude"
  judge: "claude"

# Review checkpoints
review:
  enabled: true
  interval: 40
  full_review_on_complete: true
  briefing_path: "review/briefing.yaml"
  reports_dir: "data/review-checkpoints"

# Scheduler fairness — anti-starvation for broad-footprint tasks.
#
# Parks are coupled to the owner's live state: they evaporate the moment the
# owner completes, is cancelled, or has its dependencies un-satisfied — no
# wall-clock lease needed.  Eager parks cover the full module set at once
# (cross-tier preemption + owner-state GC sweep are always active).
#
# Per-tier skip_threshold: tiers below the threshold park quickly; thresholds
# >= 1000 effectively disable parking for that tier and auto-enable
# rate-limited task_skipped emission.
fairness:
  skip_threshold:
    critical: 0
    high: 1
    medium: 2
    low: 4
    polish: 9999

# Value/h scheduler scoring knobs.
#   score(t) = TIER_BASE[eff_priority(t)]
#            + min(age_alpha * age + cpm_beta * log1p(transitive_dependents),
#                  TIER_WIDTH - 1)
# Age is proxied by (max_id - task_id): the number of newer tasks created
# since this one first went pending.  Resurrected cancelled tasks reset
# their age anchor — they do not inherit accumulated age.
age_alpha: 10.0
cpm_beta: 100.0

# Sandbox
sandbox:
  enabled: false

# Escalation
escalation:
  queue_dir: "data/escalations"
  port: 8100
  host: "127.0.0.1"

# Git
git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"

# Autonomous dry-run unblock hook
unblock_auto:
  enabled: true
  budget_usd: 5.0
  timeout_seconds: 600.0
  model: "sonnet"
  max_turns: 50
  effort: "high"
  backend: "claude"

# Usage cap handling — multi-account failover
usage_cap:
  enabled: true
  pause_threshold: 0.96
  wait_for_reset: true
  probe_interval_secs: 300
  max_probe_interval_secs: 1800
  accounts_file: "${DARK_FACTORY_ROOT:/home/leo/src/dark-factory}/config/usage-accounts.yaml"

# Scheduler park-and-stop (AFK hardening, task 1322)
#
# When N tasks transition to 'blocked' within a rolling M-hour window, the
# scheduler is automatically paused so no new tasks are dispatched.  In-flight
# workflows finish naturally; the merge queue keeps draining.  Resume is
# human-driven via Harness.resume_scheduler().
#
# Pause state persists across orchestrator restart via runs.db (scheduler_state
# table, PK=project_id) — Harness.run() reloads and re-applies it on startup.
# The persisted row is written by Harness.pause_scheduler() and cleared by
# Harness.resume_scheduler().
#
# Sibling tasks:
#   task 1323 — cost-ceiling watcher (calls Harness.pause_scheduler directly)
#   task 1327 — EWA escalation/done digest (calls Harness.pause_scheduler directly)
#
# park_stop_enabled: set to false to disable trip detection entirely.  Blocked
#   transitions are still recorded in the in-process deque so flipping back to
#   true at runtime reflects accurate state immediately (no warm-up delay).
#
# park_stop_parked_threshold: number of DISTINCT tasks transitioning to blocked
#   within the window required to trip the pause (ge=1; default 15).  Counts
#   distinct task_ids — a single flaky task re-blocked N times within the
#   window counts as one, not N.  Tune for "how many concurrent failures
#   warrant a human look", not "how many retries are too many".
#
# park_stop_parked_window_hours: rolling-window length in hours (gt=0; default 1.0).
park_stop_enabled: true
park_stop_parked_threshold: 15
park_stop_parked_window_hours: 1.0

# Escalation-watcher subprocess supervisor (AFK hardening, task 1326)
#
# An orchestrator-managed asyncio supervisor that keeps a fresh
# escalation-watcher-auto agent alive across multi-day AFK windows.
# The agent self-exits cleanly after ROTATION_ESCALATIONS or ROTATION_HOURS,
# then the supervisor restarts it immediately (clean → no backoff).
# Unclean exits (crash or timeout-kill) use exponential backoff.
# When ≥watcher_max_crashloop_restarts unclean exits occur within
# watcher_crashloop_window_secs the supervisor calls pause_scheduler
# with reason='watcher_crashloop' and stops.
#
# watcher_supervisor_enabled: set false to disable entirely (default true).
# watcher_subprocess_restart_backoff_secs: base backoff (s) on first unclean
#   exit; doubles on each consecutive unclean exit (default 30).
# watcher_rotation_escalations: agent self-exits after N escalations (default 50).
# watcher_rotation_hours: agent self-exits after M hours (default 4.0).
# watcher_max_crashloop_restarts: unclean exits within the window to trip
#   the crashloop guard (default 5).
# watcher_crashloop_window_secs: rolling window (s) for the crashloop counter
#   (default 600 = 10 min).
#
# Invocation knobs (per rotation):
# watcher_model: LLM backend model (default 'opus').
# watcher_rotation_budget_usd: per-rotation budget ($); must be sized for a
#   full rotation — invoke_agent default $5 would exhaust within minutes of a
#   4h rotation and falsely trip the crashloop guard (default 40.0).
# watcher_max_turns: max agent turns per rotation (default 400).
# watcher_effort: effort level for the agent (default 'high').
# watcher_backend: backend provider (default 'claude').
watcher_supervisor_enabled: true
watcher_subprocess_restart_backoff_secs: 30
watcher_rotation_escalations: 50
watcher_rotation_hours: 4.0
watcher_max_crashloop_restarts: 5
watcher_crashloop_window_secs: 600
# Cost-runaway guard: a clean rotation shorter than watcher_misconfigured_min_rotation_secs
# seconds is classified as degenerate (empty queue, SKILL.md drift, misconfigured env).
# After watcher_max_misconfigured_clean_exits such exits within watcher_crashloop_window_secs,
# the supervisor trips pause_scheduler('watcher_misconfigured') and stops.
watcher_misconfigured_min_rotation_secs: 120
watcher_max_misconfigured_clean_exits: 5
watcher_model: opus
watcher_rotation_budget_usd: 40.0
watcher_max_turns: 400
watcher_effort: high
watcher_backend: claude

# Daily cost ceilings (AFK hardening, task 1323)
#
# Two trailing-24h cost sums from the invocations table that trip the
# scheduler-pause mechanism when exceeded.  Both checks run every
# Harness.run() loop tick, immediately before scheduler.acquire_next().
# Resume is human-driven (same as park-and-stop — no auto-resume).
#
# watcher_daily_cost_ceiling_usd: ceiling for escalation-watcher invocations
#   only (role LIKE '%watcher%').  This is the early-warning trip — runaway
#   watcher dispatch is the most likely cost source during AFK windows.
#   Trip reason: cost_ceiling_watcher_exceeded (default 50.0).
#
# orch_daily_cost_ceiling_usd: ceiling for ALL orchestrator invocations
#   (entire invocations table, trailing 24h).  Final safety net.
#   Trip reason: cost_ceiling_orch_exceeded (default 200.0).
#
# Disable a ceiling by setting it to a very high value.
watcher_daily_cost_ceiling_usd: 50.0
orch_daily_cost_ceiling_usd: 200.0
