[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[project]
name = "orchestrator"
version = "0.1.0"
description = "Agent orchestration system — decomposes PRDs into concurrent TDD workflows"
requires-python = ">=3.11,<4"
dependencies = [
    "click>=8.0",
    # >=3.2, raised from >=2.0 by task 3690: orchestrator/mcp/verdict_tools.py
    # now registers shared.mcp_markup_middleware.MarkupGuardMiddleware, and
    # that module imports `fastmcp.tools.base` (a path that exists only after
    # tool.py was renamed to base.py) and `fastmcp.server.middleware.Middleware`
    # (absent before 2.9). Under the old >=2.0 floor a fresh resolve could hand
    # this package a 2.x where `import shared.mcp_markup_middleware` fails
    # OUTRIGHT rather than degrading. 3.2.2 is the version every substrate fact
    # in that module was measured against and what uv.lock already resolves.
    # Mirrors shared/pyproject.toml, which carries the same floor for the same
    # reason.
    "fastmcp>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "escalation",
    "dark-factory-shared[vllm]",
]

[tool.uv.sources]
escalation = { workspace = true }
dark-factory-shared = { workspace = true }

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.pyright]
include = ["src", "tests", "scripts"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
#
# "../scripts" — task 3931 / esc-3805-1 (2026-08-09), esc-3805-6 (2026-08-12),
# break-glass hotfix 27ac22a6a6. The root pyproject.toml's own extraPaths lists
# `scripts`, so ROOT-scoped pyright resolves tests/test_run_vllm_eval.py's
# `import run_vllm_eval` and EvalSummary/PodHandle become real types; without
# this entry PACKAGE-scoped pyright leaves that import unresolved, everything
# degrades to Unknown, and the defects go unreported HERE while the root-scoped
# verify gate reports them. MEASURED at pyright 1.1.408 with the hotfix
# reverse-applied: `npx pyright orchestrator/tests/test_run_vllm_eval.py` from
# the worktree ROOT -> 14 reportArgumentType errors (first at :1827);
# `cd orchestrator && npx pyright tests/test_run_vllm_eval.py` -> 0 errors.
# verify's FILE_SCOPED fallback runs pyright root-scoped while pre-commit
# (hooks/project-checks) and the fleet chain run it package-scoped, so this
# entry is what keeps the two gates in agreement. DO NOT REMOVE — pinned by
# tests/test_run_vllm_eval.py::TestPyrightScopeParity and by
# tests/scripts/test_fallback_verify_config.py's chain-independent
# generalisation. It only widens IMPORT RESOLUTION: the REPO-ROOT ../scripts is
# absent from `include` above, so its files are not themselves type-checked here.
extraPaths = ["src", "tests", "../scripts", "../shared/src", "../escalation/src", "../fused-memory/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Task 3367 / esc-3359-1: pins pyright's interpreter to THIS worktree's own
# .venv (venvPath is resolved relative to this file's directory, so it can
# never name another tree's environment). Without it, `cd orchestrator && npx
# pyright` resolves the interpreter from ambient VIRTUAL_ENV/PATH — which
# verify._target_subprocess_env deliberately strips — so a cold merge worktree
# type-checks against an env holding none of the workspace's third-party
# packages: measured 496 phantom reportMissingImports here, 0 with this pin.
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["F811"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
# Filters are anchored on the *verb* of each anti-pattern, not on specific
# internal symbol names, so that (a) they survive CPython/pytest renames of
# internal coroutine methods and (b) they catch the same anti-pattern even
# when it leaks through a different coroutine than AsyncMock's mixin.
# NOTE: Still message-regex-based, so a wholesale rewrite of the upstream
# wording would silently stop matching — revisit on pytest/Python/pytest-
# asyncio upgrades.
filterwarnings = [
    # Unawaited coroutine leak (most commonly from AsyncMock misuse, but any
    # forgotten `await` trips it).  Two emission paths with distinct shapes:
    #   (1) GC fires inline during the test — CPython emits
    #       RuntimeWarning("coroutine '<name>' was never awaited") directly.
    #   (2) GC fires after teardown — pytest's sys.unraisablehook wraps the
    #       event as PytestUnraisableExceptionWarning.  The exact prefix
    #       varies by CPython version (unraisable.err_msg may be None or a
    #       custom "Exception ignored while finalizing coroutine <...>"):
    #         Python <3.14: "Exception ignored in: <coroutine object ...>"
    #         Python  3.14: "Exception ignored while finalizing coroutine
    #                         <coroutine object ...>: None"
    #       `Exception ignored.*coroutine object` covers both forms without a
    #       literal `:` (filterwarnings uses `:` as field separator, so a
    #       literal `:` in the message regex would misparse the entry).
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error:Exception ignored.*coroutine object:pytest.PytestUnraisableExceptionWarning",
    # Sync def collected inside an @pytest.mark.asyncio class: mark mismatch.
    # Pins: pytest_asyncio/plugin.py (message emitted at the collection phase).
    "error:The test .* is marked with '@pytest.mark.asyncio' but it is not an async function:pytest.PytestWarning",
    # A test's background thread died with an unhandled exception.
    #
    # GUARDS: the task-2413 autouse aiosqlite reaper
    # (tests/conftest.py::_reap_leaked_aiosqlite_connections) and its
    # task-2780 siblings (_reap_leaked_merge_workers,
    # _reap_leaked_claimant_heartbeats). A leaked aiosqlite Connection runs a
    # background worker thread; once its per-test event loop closes, the
    # thread's next `future.get_loop().call_soon_threadsafe(...)` raises
    # RuntimeError: Event loop is closed, and pytest's threadexception plugin
    # attributes it to whatever UNRELATED test is running when the thread
    # fires (under -n auto on an oversubscribed host, reliably an innocent one).
    #
    # WHY AN ERROR, NOT A WARNING: reap_leaked_aiosqlite_connections()'s
    # MAINTENANCE NOTE documents that the helper degrades to a silent no-op
    # (returns 0) if aiosqlite renames `_running` / `_thread` /
    # `core._connection_worker_thread`. In that degraded state the leak still
    # happens — but as a warning nobody reads, so the suite stays green and
    # the regression is invisible. This entry is what makes the degradation
    # loud. Task 4075.
    #
    # ANCHOR: category only, empty message field — deliberately unlike the two
    # coroutine entries above, which anchor on a message verb. The
    # thread-exception message is a formatted traceback
    # ("Exception in thread <name>" + traceback.format_exception(...) + a
    # tracemalloc hint), so the only stable prefix is the thread name — useless
    # as a discriminator and brittle across versions. This is also the exact
    # spelling already shipped at shared/tests/test_async_sqlite_base.py:596,
    # keeping the repo's only two promotions of this category identical.
    #
    # MECHANISM (pytest 9.0.3 — revisit on a pytest major upgrade):
    # _pytest/threadexception.py::collect_thread_exception emits via
    # warnings.warn(...) inside a `try/except
    # PytestUnhandledThreadExceptionWarning` and re-raises out of the trylast
    # pytest_runtest_setup/call/teardown hooks, so an ini filter alone is
    # sufficient — no -W flag and no plugin change needed.
    #
    # MEASURED: full orchestrator suite green with this promotion active —
    # 16223 passed, 1 skipped, 2 xfailed in 872.57s under
    # `-n auto --dist loadgroup --max-worker-restart=0 -m 'not warm_lane_bash'`.
    # No pre-existing thread exceptions from any other source.
    #
    # NOT MIRRORED into the repo-root pyproject.toml (deliberate): that file's
    # mirroring rule at its lines 50-56 is about MARKER deselection, whose
    # failure mode is that deselected tests silently RUN. Mirroring here would
    # instead impose an unmeasured promotion on shared/, fused-memory/,
    # dashboard/ and sampler/. Consequence: a root-bound run does not promote,
    # and the three guards in tests/test_aiosqlite_leak_isolation.py skip there
    # by design (naming the governing inifile) rather than false-failing.
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]
# Default per-test timeout — see shared/pyproject.toml for the full rationale
# (UsageGate mock hang, make_gate_mock, asyncio-sleep footguns, and why this
# is large rather than the original 60: the cap is WALL-CLOCK, so a healthy test
# starved of CPU on a loaded 32-core host trips it and — under thread mode
# plus --max-worker-restart=0 — reds a SHIFTING VICTIM rather than itself).
# 540 is DERIVED FROM MEASUREMENT (task 5442) — worst unmarked per-test wall
# clock under real fleet load x the 8x headroom factor — and no longer
# judgement-picked; see
# plans/pytest-per-test-timeout-measurement-2026-09-17.md.
# Slow tests opt out with @pytest.mark.timeout(N) — but N is NOT free, and
# that line used to imply it was. A marker OVERRIDES the budget in BOTH
# directions rather than raising a floor under it, so any N below the
# --timeout=300 verify passes silently TIGHTENS the run that gates your merge.
# NOTE that CLI budget is now TIGHTER than this ini default rather than equal to
# it: task 5442 raised the ini 300 -> 540 and deliberately left every verify
# test_command's --timeout=300 alone, that knob being yaml rather than pyproject.
# The band below is stated against the CLI budget, which is the one that
# actually governs a merge-gating run.
# That inversion cost tasks 4176, 4384 and 4405. Write either N <= 60 (a
# DELIBERATE tight bound, for a test asserting something happens FAST) or
# @pytest.mark.timeout(VERIFY_CLI_PER_TEST_TIMEOUT) from tests/_orch_helpers.py
# — whose comment block on that constant is the SINGLE home of this rationale,
# including why the marker beats this setting. Enforced by
# tests/test_timeout_marker_inversion_guard.py.
# timeout_method: thread is RETAINED. Its original premise, that xdist worker
# subprocesses run pytest in a thread so signal cannot reach the test, is
# falsified by tests/scripts/test_timeout_method_policy.py, where the
# signal-vs-thread trade lives.
# UNCHANGED by the 60→300 and 300→540 raises, deliberately: a raise attacks the
# trigger, not the two safety mechanisms.
# MIRRORED by tests/_orch_helpers.py::PYPROJECT_DEFAULT_TIMEOUT, which
# test_whole_tree_scan_timeout_guard.py::TestTimeoutConstants asserts against
# this value with tomllib at runtime — edit the two together.
timeout = 540
timeout_method = "thread"
# A test still running after this many seconds dumps every thread's stack to
# the worker's stderr, which the verify log carries, so a hang whose kill comes
# LATER than this is legible before the os._exit() below erases the worker.
# Kept under verify's CLI --timeout=300 so an unmarked test dumps before it is
# killed. Why stderr, and why not pytest-timeout's own banner:
# test_whole_tree_scan_timeout_guard.py::TestTimeoutConstants, which pins it.
faulthandler_timeout = 240
# Parallelise the 2183-test orchestrator suite. ``-n auto`` picks worker
# count from CPUs; ``--dist loadgroup`` keeps tests tagged with the same
# xdist_group on a single worker (see test_cargo_scope.py /
# test_stale_escalation_cleanup.py for the unsafe-to-share fixtures).
# ``--max-worker-restart=0`` is the resilience net (task 1907): if any test
# ever exceeds the timeout above, pytest-timeout's thread method
# os._exit()s the xdist worker. With restarts allowed, xdist spawns a
# replacement node that
# re-collects the full suite and re-dies → restart/re-collect/re-die loop that
# hangs the whole suite at ~98%. Disabling restarts degrades a worker death to
# a single clean per-test failure instead of a suite-wide hang.
# ``-m 'not warm_lane_bash'`` deselects the ported warm-lane bash bucket from
# the default suite — PRD §11 q4 RE-DECIDED (task 3349, 2026-08-01): the
# documented escape is taken and the bucket now runs post-merge on
# ``git.offline_lane_commands`` (the ``warm-lane-bash`` entry in
# dark-factory-orchestrator.yaml). Measured 289.58s serialised onto one xdist
# worker at loadavg 128.72 on 32 cores — 6.2x the README's 47s module baseline,
# and fully additive to the verify critical path since ``xdist_group`` pins all
# 12 items to a single worker. Deselecting HERE rather than in
# orchestrator.yaml's test_command follows the shipped ``integration``
# precedent (shared/pyproject.toml, fused-memory/pyproject.toml): test_command
# is a bare directory-arg pytest with no ``-m`` of its own, so this one edit
# point covers merge-verify AND a bare local ``pytest`` with no risk of the two
# spellings drifting apart. COUPLED to the lane entry — see the marker note
# below and test_warm_lane_bash_bucket_placement.py.
addopts = "-n auto --dist loadgroup --max-worker-restart=0 -m 'not warm_lane_bash'"
# Every marker APPLIED under orchestrator/tests/ must appear in this list, or
# be registered via `config.addinivalue_line('markers', ...)` in
# tests/conftest.py (e.g. real_psi_reader) — pinned by
# tests/test_marker_registration_drift.py (task 3532), so a typo'd marker
# collects clean and passes forever instead of failing loudly.
# `--strict-markers` was evaluated and deliberately NOT added to addopts:
# MEASURED on pytest 9.0.3, the flag is INERT there — a typo'd marker still
# collects clean and passes (exit 0) even though
# `config.option.strict_markers` reads True — and only enforces when passed
# on the command line. Adding it here would be enforcement in appearance
# only; see test_marker_registration_drift.py's module docstring for the
# full measurement.
markers = [
    "exercise_dry_run_unblock: allow workflow._mark_blocked to spawn the real run_dry_run_unblock hook (fire-and-forget Claude CLI). Default: autouse no-op installed in conftest.py.",
    "mocks_dry_run_unblock: opt the class into an AsyncMock(return_value=None) patch of orchestrator.workflow.run_dry_run_unblock so BLOCKED-driving e2e tests do not invoke the real fire-and-forget hook. Default in test_workflow_e2e.py: a fail-fast stub that records calls and asserts in teardown.",
    "guard_self_test: marks a test class as a self-test of _dry_run_unblock_e2e_guard; suppresses the fixture's teardown assertion so deliberate stub invocations inside pytest.raises do not produce a false-positive failure.",
    "exercise_merge_verify: opt a test OUT of the autouse `_mock_merge_queue_verification` patch so its post-merge verify gate runs the REAL orchestrator.merge_queue.run_scoped_verification (e.g. cargo) instead of the passed=True stub. Default: autouse mock installed in conftest.py.",
    "exit_contract_violation_expected: opt a test OUT of the autouse `_no_unexpected_exit_contract_violation` guard, for a test that DELIBERATELY drives a run()-exit contract violation (spec docs/task-escalation-state-spec.md §5; the WHY is orchestrator/src/orchestrator/exit_contract.py). Never a fix for an unexpected violation: that is a producer or test-double bug (task 3542).",
    "real_verify_admission: opt a test OUT of the autouse `_neutralize_verify_admission` patch so it exercises the REAL orchestrator.verify admission wiring (nice-prefix wrap + shared.verify_admission.acquire_task_slot) instead of the force-inactive stub. Default: autouse neutralize installed in conftest.py (task 2390).",
    "warm_lane_bash: marks the pytest items in test_warm_lane_bash_suite.py that shell out to the ported warm-lane bash tests under tests/warm-lane/ (task 3073, PRD leaf α2). DESELECTED from the default suite in addopts and re-selected post-merge by the `warm-lane-bash` LaneCommand in dark-factory-orchestrator.yaml — PRD §11 q4 re-decided (task 3349, 2026-08-01) to take the escape the PRD itself documented. Two grounds: leaf γ (task 3075) has LANDED with this coverage green on its verify leg, consuming half the original justification; and the surviving cost ground inverted — measured 289.58s at loadavg 128.72 on 32 cores, 6.2x the README's 47s module baseline. Still selectable on demand with `-m warm_lane_bash`, which is exactly how the lane re-selects it (a CLI -m overrides the addopts -m, last wins). PRD leaves δ/δ2/ε, which still change warm-lane behaviour, must run `-m warm_lane_bash` explicitly on their own verify legs. The addopts deselection and the lane entry are COUPLED and never move independently — pinned by test_warm_lane_bash_bucket_placement.py. See orchestrator/tests/warm-lane/README.md.",
    "slow: marks heavyweight tests that shell out to real subprocesses (uv run pytest, plan-tools MCP servers) rather than mocking them, so they run materially slower than the rest of the suite. Call sites: test_verify_plan_integration.py::test_scoped_pytest_producer_and_runner_agree_on_scope (one real `uv run ... pytest` subprocess) and test_plan_tools_startup_load.py::test_concurrent_startup_no_hang (six real subprocesses). Deselect with -m 'not slow and not warm_lane_bash' — NOT a bare -m 'not slow': pytest's -m is single-value, so a CLI -m overrides addopts' `-m 'not warm_lane_bash'` entirely (last wins, per the warm_lane_bash note above), and a bare 'not slow' would silently RE-SELECT that already-deselected 12-item bucket instead of speeding the run up. Unlike warm_lane_bash this marker is NOT deselected by addopts by default — registering it here only stops it being silently accepted as an unknown/typo-able marker name (task 3506).",
]

[dependency-groups]
dev = [
    # complexipy — the cognitive-complexity engine behind
    # scripts/merge_lane_metrics.py and the merge-lane ratchet
    # (tests/test_merge_lane_ratchet.py). PRD plans/merge-lane-quality-prd.md
    # task α. BOTH bounds are load-bearing and were MEASURED in this worktree
    # on 2026-09-03 against src/orchestrator/merge_queue.py (21,550 lines):
    #
    #   version | wall clock | file total | _verifier_loop
    #   3.0.0   |     4.63s  |      2031  |  186
    #   4.0.0   |     4.31s  |      2124  |  188
    #   5.0.0   |     4.81s  |      2092  |  192
    #   6.0.0   |     5.18s  |      2133  |  245
    #   6.2.0   |     4.75s  |      2133  |  245
    #   7.0.1   |   247.00s  |      2133  |  245
    #
    # The FLOOR (>=6.2) is correctness: 3/4/5 compute DIFFERENT numbers, so an
    # older resolve would silently rewrite every baseline figure and turn the
    # ratchet into noise. 6.x and 7.0.1 agree, and reproduce exactly the
    # figures the PRD Background table quotes; 6.2.0 is the newest 6.x and the
    # one every committed baseline number was measured with.
    #
    # The CEILING (<7) is not hygiene — it is what keeps the instrument from
    # becoming a suite-truncating landmine. 7.0.1's cost grows roughly cubically
    # in file size (2,800 lines = 0.31s; 21,550 lines = 247s), so the whole
    # 22-path cluster costs ~330s+ at 7.0.1 against 9.52s at 6.2.0. The ratchet
    # carries @pytest.mark.timeout(WHOLE_TREE_SCAN_TEST_TIMEOUT) = 300s and this
    # file's own `timeout = 300`-equivalent budget; exceeding it does not merely
    # fail the test — pytest-timeout's thread method os._exit()s the xdist
    # worker and `--max-worker-restart=0` then truncates the ENTIRE orchestrator
    # suite, reporting against an innocent test (the esc-3980-1 / esc-3787-1
    # mode documented at tests/_orch_helpers.py::WHOLE_TREE_SCAN_TEST_TIMEOUT).
    # Do not relax to >=6 or drop the <7 ceiling without re-measuring.
    "complexipy>=6.2,<7",
    # mutmut — the mutation-score baseline of task 5035 ([tool.mutmut] below).
    # <3.8 because 3.8.0 requires click>=8.4.2 and uv.lock pins click 8.3.2.
    "mutmut>=3.7,<3.8",
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.0",
    # radon — used ONLY for the reported-not-ratcheted maintainability-index
    # column of scripts/merge_lane_metrics.py --report (radon.metrics.mi_visit;
    # measured 0.00 for both merge_queue.py and git_ops.py, reproducing the
    # PRD's "Maintainability index (radon) | 0" row). It is genuinely exercised
    # by metrics.maintainability_index() — NOT dead, do not delete as unused.
    "radon>=6.0,<7",
    "ruff>=0.7.1",
]

# mutmut: the merge lane's mutation-score baseline (tasks 5035, 6374), run from
# this directory. The procedure and results are in
# plans/merge-lane-quality-prd.mutation-baseline.md. merge_lane/worker.py is
# deliberately not mutated; task 6327 owns it.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/orchestrator/merge_lane/gates.py",
    "src/orchestrator/merge_lane/types.py",
]
# Logger calls are not mutated (PRD Open question 4, Leo 2026-10-05). mutmut
# skips any expression that starts on a matching line, multi-line calls
# included; the anchor keeps lines that merely mention `logger.` mutable.
do_not_mutate_patterns = ['^\s*logger\.(debug|info|warning|error|exception|critical)\(']
# mutmut maps tests to the functions they reach in-process, so xdist is off.
pytest_add_cli_args = ["-n", "0", "-p", "no:cacheprovider"]
# The lane-importing test files (scripts/merge_lane_metrics.py::
# imports_lane_module) that execute at least one function of gates.py or
# types.py: a snapshot, re-derived as the baseline report's Method describes.
pytest_add_cli_args_test_selection = [
    "tests/test_atomic_train_merge.py",
    "tests/test_block_disposition.py",
