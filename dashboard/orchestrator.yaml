# Dashboard orchestrator configuration
# Ports on xxx2 range to avoid collisions with reify (xxx0) and autopilot-video (xxx1)

# Concurrency
max_concurrent_tasks: 3
max_per_module: 1
lock_depth: 4
module_overrides:
  tests: 2

# Iteration limits
max_execute_iterations: 10
max_verify_attempts: 5
max_review_cycles: 2

# Models per role
models:
  architect: "opus"
  implementer: "opus"
  debugger: "opus"
  reviewer: "sonnet"
  merger: "opus"

# Budget per invocation (USD)
budgets:
  architect: 5.0
  implementer: 10.0
  debugger: 5.0
  reviewer: 2.0
  merger: 5.0

# Turn limits per invocation
max_turns:
  architect: 50
  implementer: 80
  debugger: 50
  reviewer: 30
  merger: 50

# Verification commands
test_command: "uv run --project dashboard --directory dashboard pytest tests/ --tb=short -q --timeout=300"
# bare-MagicMock config gate (also runs in merge-queue verify; see hooks/project-checks)
lint_command: "uv run --project dashboard --directory dashboard ruff check src/ tests/ && python3 fused-memory/scripts/check_bare_magicmock_config.py dashboard/tests"
type_check_command: "uv run --project dashboard --directory dashboard pyright src/ tests/"

# Per-module verify budget (task 3473). Before this, dashboard declared nothing
# here and fell HARD through to the repo-root whole-fleet ceiling.
#
# (1) MEASUREMENT PROVENANCE. Six runs of the VERBATIM test_command above,
# copied byte-for-byte, on base main 5a7770d239. All rc=0, all reporting
# 1648 passed / 1 xfailed. EVERY FIGURE IS CONTENDED — a 32-core host running
# /proc/loadavg 106-252 throughout — and none is quoted as an unloaded one, per
# orchestrator/tests/warm-lane/README.md.
#
#    283.47s wall /274.87s pytest @ loadavg 133.30  <- the CONVENIENT figure
#    320.40s wall /310.40s pytest @ loadavg 141.24
#    341.70s wall /332.59s pytest @ loadavg 146.79
#    409.78s wall /402.35s pytest @ loadavg 137.33
#    452.56s wall /443.36s pytest @ loadavg 106.94
#    653.54s wall /646.23s pytest @ loadavg 123.76  <- the INCONVENIENT one
#                                                      (6-way concurrent wave)
#
# (1a) THESE ARE THE FIRST MEASUREMENTS THIS SUITE HAS EVER HAD, which is an
# error bar worth stating rather than leaving implied. Task 3062 attempt-2 —
# the run that produced the per-segment figures the repo-root yaml's own budget
# derivation is built on — TIMED OUT at 1800.66s BEFORE dashboard's segment
# started. The root yaml consequently carries only an ESTIMATE for this module
# ("1393 collected @ ~0.137 s/test ~190"), and that estimate is now known to be
# low by roughly 1.5x-3.4x against measurement. So unlike shared, escalation and
# fused-memory, there is no independent earlier figure to cross-check these six
# against; they stand alone. They also show the widest spread in the sweep,
# 2.3x (283.47s -> 653.54s).
#
# (1b) THE CONCURRENT ARM OF THAT SWEEP WAS A 6-WAY WAVE, which is a LOWER
# BOUND on the production shape rather than a reproduction of it:
# verify.run_full_verification asyncio.gathers over module_configs.values() —
# NINE registered configs today, including the dominant `orchestrator` segment
# measured at 1366.23s — so a full gather is materially heavier than what was
# measured, and W under-states the fully-concurrent cost. Two uncredited
# mechanisms bound the gap (verify_plan scoping, and the
# shared.verify_admission slot gate whose wait falls outside the timeout
# clock); what remains is what the 2.6x multiple absorbs, as an assumption
# rather than a measurement. Full statement in shared/orchestrator.yaml
# paragraph (1a).
#
# (2) SIZING. W = 653.54s, the WORST run, never the mean.
#     B ~= 2.6 x W = 1699.2 -> rounded up to 1700.
# Max-not-mean is forced by recorded evidence: scripts/orchestrator.yaml logs a
# ~3x spread (310.33s -> 914.61s) for a BYTE-IDENTICAL command on a
# BYTE-IDENTICAL tree — host load at measurement time, not suite variance. With
# no earlier figure to corroborate against, sizing against the max matters more
# here than on any other module in this task.
#
# (3) THE 2.6x MULTIPLE AND THE 600s FLOOR ARE INHERITED DELIBERATELY, not
# coincidentally: tests/scripts' 600 ~= 2.6 x 233.50 and scripts' 2400 ~= 2.6 x
# 930.59, and scripts/orchestrator.yaml states it kept the multiple identical
# across the two on purpose. The 600s floor is not binding here.
#
# (4) WHAT THIS ACTUALLY BUYS: 3600s -> 1700s, a 2.1x narrowing — the most
# modest of the six, because this is the most expensive suite of the six.
# Nothing tighter is declarable without manufacturing infra_timeout on the
# honest green path under load.
#
# (4a) COUNT THE RETRIES. config.verify_timeout_retries defaults to 2 and the
# repo-root yaml does not override it, and verify.py's attempt loop re-runs a
# PURE TIMEOUT failure — so on the TASK path a hang here costs up to
# 3 x 1700s = ~85 minutes, not ~28, against up to 3 x 3600s = ~3 hours before
# this declaration. The 2.1x ratio is unaffected (the multiplier divides out);
# the absolute minutes are 3x larger than the budget alone suggests, and on this
# module that is the difference between "surfaces within the hour" and does not.
# The merge-verify and background paths pass max_retries=0 and pay 1700s once.
# Full statement of the mechanism in shared/orchestrator.yaml paragraph (4a).
#
# (5) verify_command_timeout_secs is a PER-COMMAND budget, so this bounds the
# TEST leg on its own — NOT test + lint + type summed.
#
# (6) verify_cold_command_timeout_secs is DELIBERATELY LEFT UNSET: no build step
# whose cold cost would justify a separate cold budget. Per
# verify._resolve_verify_timeout, an unset module cold knob does NOT inherit the
# 1700 below — it falls through to the repo-root verify_cold_command_timeout_secs
# (5400), and on a MERGE-cold verify falls through first to
# config.merge_verify_cold_command_timeout_secs (7200, shipped by the
# package-bundled orchestrator/src/orchestrator/defaults.yaml and not overridden
# by the root yaml). Gated by assertion (f) of the guard below.
#
# (7) RAISE THEM TOGETHER. If this suite grows enough to approach 1700s,
# RE-MEASURE and raise BOTH this value and
# MEASURED_MODULE_SUITE_WORST_SECS['dashboard'] in
# tests/scripts/test_module_verify_budgets.py — never quietly widen one.
#
# (8) GATED BY tests/scripts/test_module_verify_budgets.py::
# test_module_carries_its_own_measured_verify_budget[dashboard].
verify_command_timeout_secs: 1700

# Fused memory HTTP server — port 8002
fused_memory:
  url: "http://localhost:8002"
  project_id: "dark_factory"
  config_path: "dashboard/fused-memory-config.yaml"
  server_command:
    - "uv"
    - "run"
    - "--project"
    - "fused-memory"
    - "python"
    - "-m"
    - "fused_memory.server.main"
    - "--transport"
    - "http"

# Sandbox — disabled due to Bun segfault inside bwrap on this kernel (6.17).
# A landlock backend now exists (SandboxConfig.backend: landlock) that sidesteps
# the bwrap/userns issue — flip to `enabled: true, backend: landlock` when ready.
sandbox:
  enabled: false

# Escalation — port 8102
escalation:
  queue_dir: "data/escalations"
  port: 8102

# Git
git:
  main_branch: "main"
  branch_prefix: "task/"
  remote: "origin"
  worktree_dir: ".worktrees"

# Project root (absolute path)
project_root: "${PROJECT_ROOT:/home/leo/src/dark-factory}"
