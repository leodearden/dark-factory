[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[project]
name = "dashboard"
version = "0.1.0"
description = "Dark Factory dashboard — real-time monitoring UI for orchestration"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "httpx>=0.27",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    # Direct import (data/mcp_fanout.py), NOT just a fastapi/pydantic transitive:
    # TTLCache's key TypeVar carries a PEP 696 `default=`, and pyright REJECTS
    # `typing.TypeVar(default=...)` under this package's `pythonVersion = "3.11"`
    # pin ("Type variable default types require Python 3.13 or newer"). The
    # typing_extensions spelling is accepted at that pin and applies the default,
    # so every single-argument `TTLCache[V]` keeps checking unedited.
    "typing-extensions>=4.12",
    "escalation>=0.1",
    "dark-factory-shared",
]

[tool.uv.sources]
escalation = { workspace = true }
dark-factory-shared = { workspace = true }

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "../shared/src", "../escalation/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# PARALLEL TEST EXECUTION (task 5408). Spelling and flag ORDER copy
# fused-memory/pyproject.toml verbatim, so every parallel module in this
# workspace reads as one family rather than as independently-invented variants.
# `-n auto`, never a literal `-n 8`: pytest-xdist resolves `auto` through
# PYTEST_XDIST_AUTO_NUM_WORKERS, which dark-factory-orchestrator.yaml pins in
# its `verify_env` block and verify._resolve_verify_env injects for EVERY
# verify role. This module declares no verify_env of its own, so nothing
# shadows that pin — one knob governs every parallel module and the A/B cut of
# the worker count moves them together. A numeral here would opt this module
# out of it.
# `--dist loadgroup` travels with `-n` rather than leaving xdist at its default
# `load`: it is what makes @pytest.mark.xdist_group a guarantee rather than a
# hint, which is how a suite keeps its order-sensitive and resource-sharing
# tests honest once it has workers.
# orchestrator's `--max-worker-restart=0` is deliberately NOT copied across;
# see tests/scripts/test_merge_gate_parallelism_config.py::
# test_parallel_member_addopts_do_not_copy_max_worker_restart for why.
addopts = "-n auto --dist loadgroup"
# Default per-test wall-clock cap (pytest-timeout, already a dev dependency).
# Task 3431 / esc-3216-2: observed one run of
# tests/test_app.py::test_performance_returns_performance spend 178.5s in
# teardown and end in sqlite3.OperationalError "attempt to write a readonly
# database" from the aiosqlite worker thread; the retry mechanism behind the
# stall is unconfirmed (task 3431 flags it as an unverified hypothesis, not
# established fact). Without this cap, a wedge like that hangs the whole
# suite with no output instead of failing loud with a traceback.
# 300s matches shared/escalation/orchestrator/fused-memory's default, so slow
# tests can opt up individually with @pytest.mark.timeout(N) as those
# configs document. Per-module merge/root verify test_commands already pass
# --timeout=300 on the CLI (which overrides this ini value), so this default
# instead governs bare local/agent invocations (`cd dashboard && uv run
# pytest tests/`, the form CONTRIBUTING.md and the 3216 incident used).
# Raised 60→300 on 2026-09-12; see shared/pyproject.toml for the full
# rationale (the cap is WALL-CLOCK, so a healthy test starved of CPU on a
# loaded 32-core host trips it, and in the xdist packages that reds a
# SHIFTING VICTIM rather than the starved test). 300 is INTERIM and
# judgement-picked, not measured.
timeout = 300
# signal is KEPT under xdist (task 5408), and the premise this comment used to
# give for it — "dashboard runs no pytest-xdist, so signal is safe" — is
# corrected rather than softened, because it is false twice over. It was
# ALREADY false before 5408: verify.py injects
# `-n <verify_admission_pytest_n>` for roles task/background, so this suite has
# been running 8-way on task-role verify all along, with signal, staying green.
# 5408's `-n auto --dist loadgroup` above then made it false on its face.
# WHAT SURVIVES IS A MEASUREMENT, not the premise: at `-n 8 --dist loadgroup`
# on the 5408 tree this suite ran 2299 passed / 1 xfailed in 75.02s, exit 0,
# with signal unchanged. signal remains the only method that interrupts a
# blocking main-thread wait (thread mode can't — mirrors
# escalation/pyproject.toml).
# NOT flipped to `thread`, deliberately. fused-memory/pyproject.toml records the
# opposite experience ("signal proved unreliable under pytest-xdist workers in
# practice"), and that same block explains why the flip is a real trade rather
# than a free upgrade: pytest-timeout's thread handler ends in `os._exit(1)`,
# which kills the whole xdist worker, and near end-of-suite the controller can
# deadlock waiting for a completion signal that never arrives. Changing it on no
# measurement, inside a config-only task, would be unmeasured scope creep; the
# open question is filed as follow-up instead.
# Residual risk: signal only raises in the main
# thread, and aiosqlite's connection worker is a non-daemon thread
# (aiosqlite/core.py: `Thread(target=_connection_worker_thread, ...)`), so a
# sufficiently wedged worker can still block interpreter shutdown even after
# pytest-timeout has failed the test.
timeout_method = "signal"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.7.1",
    "httpx>=0.27",
]
