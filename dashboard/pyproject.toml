[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[project]
name = "dashboard"
version = "0.1.0"
description = "Dark Factory dashboard — real-time monitoring UI for orchestration"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "httpx>=0.27",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
    "escalation>=0.1",
    "dark-factory-shared",
]

[tool.uv.sources]
escalation = { workspace = true }
dark-factory-shared = { workspace = true }

[tool.pyright]
include = ["src", "tests"]
# ".." LAST (mirrors tests/conftest.py's sys.path.append): resolves the repo-root
# df_pytest_isolation module without letting project dirs shadow their own src/.
extraPaths = ["src", "../shared/src", "../escalation/src", ".."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = ".."
venv = ".venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]

# NOT an enforced gate — style config only: it shapes an ad-hoc or editor-on-save
# `ruff format` into a repo-consistent single-quoted diff. Do not delete as unused,
# do not promote to a gate. Why, and the measurements: CONTRIBUTING.md section 3;
# both directions guarded by tests/scripts/test_ruff_format_policy.py (task 3441).
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Default per-test wall-clock cap (pytest-timeout, already a dev dependency).
# Task 3431 / esc-3216-2: observed one run of
# tests/test_app.py::test_performance_returns_performance spend 178.5s in
# teardown and end in sqlite3.OperationalError "attempt to write a readonly
# database" from the aiosqlite worker thread; the retry mechanism behind the
# stall is unconfirmed (task 3431 flags it as an unverified hypothesis, not
# established fact). Without this cap, a wedge like that hangs the whole
# suite with no output instead of failing loud with a traceback.
# 60s matches shared/escalation/orchestrator/fused-memory's default, so slow
# tests can opt up individually with @pytest.mark.timeout(N) as those
# configs document. Per-module merge/root verify test_commands already pass
# --timeout=300 on the CLI (which overrides this ini value), so this default
# instead governs bare local/agent invocations (`cd dashboard && uv run
# pytest tests/`, the form CONTRIBUTING.md and the 3216 incident used).
timeout = 60
# dashboard runs no pytest-xdist, so signal is safe and is the only method
# that interrupts a blocking main-thread wait (thread mode can't — mirrors
# escalation/pyproject.toml). Residual risk: signal only raises in the main
# thread, and aiosqlite's connection worker is a non-daemon thread
# (aiosqlite/core.py: `Thread(target=_connection_worker_thread, ...)`), so a
# sufficiently wedged worker can still block interpreter shutdown even after
# pytest-timeout has failed the test.
timeout_method = "signal"

[dependency-groups]
dev = [
    "pyright>=1.1.404",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.7.1",
    "httpx>=0.27",
]
